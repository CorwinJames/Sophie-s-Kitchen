'receipts-queue.md':`# Receipts

Photos taken with the Scan button land in Recipes/_receipts and get logged
here. Ask Claude to "process the receipt queue" and it will read them, update
the pantry with what was bought, and record prices.

Written as:  YYYY-MM-DD HH:MM | filename | drive-id | status

## Queue

## Done
`
};

/* ---------- receipt queue ---------- */
function parseReceipts(text){
  const S2=sections(text);
  const row=l=>{
    const p=l.split('|').map(x=>x.trim());
    return p.length>=3?{when:p[0],file:p[1],id:p[2],status:p[3]||'new'}:null;
  };
  return {rows:bullets(S2['queue']).map(row).filter(Boolean),
          done:bullets(S2['done']).map(row).filter(Boolean),raw:text};
}
function serializeReceipts(r){
  const out=['# Receipts','',
    'Photos taken with the Scan button land in Recipes/_receipts and get logged',
    'here. Ask Claude to "process the receipt queue" and it will read them, update',
    'the pantry with what was bought, and record prices.','',
    'Written as:  YYYY-MM-DD HH:MM | filename | drive-id | status','','## Queue',''];
  r.rows.forEach(x=>out.push(`- ${x.when} | ${x.file} | ${x.id} | ${x.status}`));
  out.push('','## Done','');
  (r.done||[]).forEach(x=>out.push(`- ${x.when} | ${x.file} | ${x.id} | ${x.status}`));
  return out.join('\n')+'\n';
}

/* cache so the app opens instantly and works offline (read-only) */
function saveCache(){
  try{ writeCache(true); }
  catch(e){ try{ writeCache(false); }catch(e2){ LS.del('cache'); } }
}
function writeCache(withRecipes){
  LS.set('cache',{
    at:Date.now(), ids:S.ids,
    files:Object.fromEntries(Object.entries(S.files).map(([k,v])=>[k,{id:v.id,modifiedTime:v.modifiedTime}])),
    raw:{
      rules:S.rules.raw,pantry:S.pantry.raw,steps:S.steps.raw,plan:S.plan.raw,grocery:S.grocery.raw
    },
    recipes:withRecipes?S.recipes.map(r=>({fileId:r.fileId,fileName:r.fileName,
      modifiedTime:r.modifiedTime,raw:r.raw})):[]
  });
}
function loadCache(){
  const c=LS.get('cache',null); if(!c)return false;
  S.ids=c.ids||S.ids;
  S.files=c.files||{};
  S.rules=parseRules(c.raw.rules); S.pantry=parsePantry(c.raw.pantry);
  S.steps=parseSteps(c.raw.steps); S.plan=parsePlan(c.raw.plan); S.grocery=parseGrocery(c.raw.grocery);
  S.receipts=parseReceipts(c.raw.receipts||'');
  S.prices=parsePrices(c.raw.prices||''); S.stores=parseStores(c.raw.stores||'');
  S.recipes=(c.recipes||[]).map(r=>parseRecipe(r.raw,{id:r.fileId,name:r.fileName,modifiedTime:r.modifiedTime}));
  S.loadedAt=c.at;
  return true;
}

async function syncAll(){
  if(!Drive.clientId()){ status('Not configured — open Settings','err'); return false; }
  status('Syncing with Drive…','busy');
  try{
    await Drive.auth(false);
    S.ids.root=(await Drive.ensureFolder(LS.get('folderName',APP.FOLDER),null)).id;
    S.ids.library=(await Drive.ensureFolder('library',S.ids.root)).id;
    S.ids.inbox=(await Drive.ensureFolder('_inbox',S.ids.root)).id;
    S.ids.done=(await Drive.ensureFolder('done',S.ids.inbox)).id;
    S.ids.receipts=(await Drive.ensureFolder('_receipts',S.ids.root)).id;

    const rootFiles=await Drive.list(`'${S.ids.root}' in parents and trashed=false`);
    for(const [name,apply] of CONFIG_FILES){
      let f=rootFiles.find(x=>x.name===name);
      if(!f) f=await Drive.create(name,S.ids.root,SEED[name]);
      S.files[name]=f;
      apply(await Drive.readText(f));
    }
    const libFiles=(await Drive.list(`'${S.ids.library}' in parents and trashed=false`,
      'files(id,name,mimeType,modifiedTime,size)',
      n=>status('Finding recipes… '+n,'busy')))
      .filter(f=>/\.(md|txt)$/i.test(f.name));

    /* Anything whose modifiedTime hasn't moved since we last saw it doesn't
       need fetching again — with 300 recipes that is the difference between
       a two-minute sync and a two-second one. */
    const known={};
    S.recipes.forEach(r=>{ if(r.fileId&&r.modifiedTime)known[r.fileId]={t:r.modifiedTime,raw:r.raw}; });
    const recipes=new Array(libFiles.length);
    let fetched=0,reused=0,failed=0;
    const CONCURRENCY=8;
    let cursor=0;
    async function worker(){
      while(cursor<libFiles.length){
        const idx=cursor++;
        const f=libFiles[idx];
        const k=known[f.id];
        if(k && k.t===f.modifiedTime && k.raw){
          recipes[idx]=parseRecipe(k.raw,f); reused++;
        }else{
          try{
            recipes[idx]=parseRecipe(await Drive.readText(f),f);
            fetched++;
          }catch(e){
            failed++;
            if(k&&k.raw)recipes[idx]=parseRecipe(k.raw,f);   // keep the old copy rather than lose it
          }
        }
        if(((fetched+reused)&7)===0)
          status(`Reading recipes… ${fetched+reused}/${libFiles.length}`,'busy');
      }
    }
    await Promise.all(Array.from({length:Math.min(CONCURRENCY,libFiles.length||1)},worker));
    S.recipes=recipes.filter(Boolean);
    if(failed)toast(failed+' recipe'+(failed>1?'s':'')+' could not be read — the rest synced fine.');

    S.inbox=(await Drive.list(`'${S.ids.inbox}' in parents and trashed=false`))
      .filter(f=>f.mimeType!=='application/vnd.google-apps.folder');

    /* The _receipts FOLDER is the source of truth, not the queue file — so a
       photo that arrives any other way (an iOS Shortcut, the Drive app's share
       sheet, dragged in on a laptop) still gets picked up and queued. */
    S.receipts.rows=S.receipts.rows||[]; S.receipts.done=S.receipts.done||[];
    const seenShots=new Set(S.receipts.rows.concat(S.receipts.done).map(r=>r.id));
    const shots=(await Drive.list(`'${S.ids.receipts}' in parents and trashed=false`,
      'files(id,name,mimeType,modifiedTime,createdTime)'))
      .filter(f=>/^image\//.test(f.mimeType||'')||/\.(jpe?g|png|heic|webp)$/i.test(f.name||''));
    let newShots=0;
    shots.forEach(f=>{
      if(seenShots.has(f.id))return;
      S.receipts.rows.push({when:(f.createdTime||f.modifiedTime||'').replace('T',' ').slice(0,16),
        file:f.name,id:f.id,status:'new'});
      newShots++;
    });
    if(newShots){
      const rtext=serializeReceipts(S.receipts); S.receipts.raw=rtext;
      try{ await saveFile('receipts-queue.md',rtext); }catch(e){}
    }

    S.loadedAt=Date.now(); S.offline=false;
    saveCache();
    status(`${S.recipes.length} recipes · synced ${niceTime(new Date())}`,'good');
    $('#statusMeta').textContent=S.inbox.length?`${S.inbox.length} in inbox`:'';
    return true;
  }catch(e){
    console.error(e);
    S.offline=true;
    status('Offline — showing last synced copy. '+(e.message||''),'err');
    return false;
  }
}

async function saveFile(name,text){
  const f=S.files[name];
  if(!f) throw new Error('Unknown file '+name);
  const m=await Drive.meta(f.id);
  if(f.modifiedTime && m.modifiedTime!==f.modifiedTime){
    const go=confirm(`${name} was changed in Drive since this app loaded it (probably the other computer).\n\nOK = overwrite with what's on this screen.\nCancel = stop, hit Sync, and redo your change.`);
    if(!go) throw new Error('save cancelled');
  }
  const res=await Drive.write(f.id,text);
  S.files[name]=Object.assign({},f,{modifiedTime:res.modifiedTime});
  saveCache();
  return res;
}
async function saveRecipe(r){
  const text=typeof r==='string'?r:serializeRecipe(r);
  if(r.fileId){
    const res=await Drive.write(r.fileId,text);
    r.modifiedTime=res.modifiedTime; r.raw=text;
  }else{
    const name=(r.slug||slug(r.name))+'.md';
    const res=await Drive.create(name,S.ids.library,text);
    r.fileId=res.id; r.fileName=res.name; r.modifiedTime=res.modifiedTime; r.raw=text;
    if(!S.recipes.includes(r))S.recipes.push(r);
  }
  saveCache();
  return r;
}
/* ============================================================
   ENGINES
   ============================================================ */

/* ---------- what can we cook ---------- */
function haveKeys(extra){
  const keys=pantryHave(S.pantry).map(i=>i.key);
  return uniq(keys.concat(extra||[]));
}
function findSub(missingItem){
  // house rule says "their thing -> our thing"; if we have our thing, suggest it
  const have=pantryHave(S.pantry);
  for(const sw of S.rules.swap){
    if(sameThing(sw.from,missingItem)){
      const target=sw.to.split(',')[0];
      if(have.some(h=>sameThing(h.name,target))) return {to:sw.to,dir:'rule'};
    }
    if(sameThing(sw.to,missingItem) && have.some(h=>sameThing(h.name,sw.from))) return {to:sw.from,dir:'reverse'};
  }
  return null;
}
/* ============================================================
   THINGS WE MAKE RATHER THAN BUY
   A recipe with "makes: chicken stock" in its header doesn't just feed you —
   it produces a pantry ingredient. So having the bones counts as having the
   stock, and any recipe calling for stock can fold the stock-making into it.
   Never a rule, always a fallback: if the jar is in the cupboard, use the jar.
   ============================================================ */
function componentFor(item){
  if(!item)return null;
  return S.recipes.find(r=>r.meta.makes && sameThing(r.meta.makes,item))||null;
}
function inPantry(item){ return pantryHave(S.pantry).some(h=>answers(h.name,item)); }
/* can we produce this from what is in the house right now? depth-limited, so
   two recipes that quote each other cannot spin forever */
function canMake(item,depth,seen){
  depth = depth==null?2:depth;
  seen = seen||new Set();
  if(depth<0)return null;
  const key=norm(item);
  if(seen.has(key))return null;
  seen.add(key);
  const c=componentFor(item);
  if(!c)return null;
  for(const i of c.ingredients){
    if(!i.key||negligible(i))continue;
    if(inPantry(i.item))continue;
    if(canMake(i.item,depth-1,new Set(seen)))continue;
    return null;
  }
  return {recipe:c,item};
}
/* everything this recipe needs that we would have to make first */
function scratchPlan(r){
  const out=[];
  r.ingredients.forEach(i=>{
    if(!i.key||negligible(i)||inPantry(i.item))return;
    const c=canMake(i.item);
    if(c && !out.some(x=>sameThing(x.item,i.item)))out.push(c);
  });
  return out;
}

/* Comes out of the tap, or is otherwise always there. Never missing, never
   shopping, never costed, never deducted, and never counted against a
   recipe's coverage. Matches the way everything else does, so one entry of
   "water" also covers warm water, ice water and water for boiling. */
function freeHead(item){
  /* "water, for boiling the pasta" and "water for the sauce" are both just
     water. The general purpose-stripper only knows a fixed vocabulary of
     cooking verbs, and widening it would change matching everywhere; this
     narrow pass only ever runs against the short always-have list. */
  let t=String(item||'').split(',')[0];
  t=t.replace(/\s+\bfor\b\s+.*$/i,'');
  return t.trim();
}
/* Is this line a real ingredient at all? A bullet with no text is nothing.
   A bullet WITH text that we failed to parse is something — and it has to
   go on being something, or it disappears from the arithmetic. */
function ingredientCounts(i){
  return !!(i && String(i.item||'').trim());
}
function isFree(item){
  if(!item)return false;
  const head=freeHead(item);
  /* sameThing, not satisfies. satisfies is deliberately loose about a
     one-word request — any oil answers "oil" — and that looseness would
     make coconut water and tonic water come out of the tap. sameThing
     keeps the DISTINCT guard, so "warm water" is free and "rose water"
     is shopping. */
  return (S.rules.free||FREE_DEFAULT).some(f=>sameThing(f,item)||(head&&sameThing(f,head)));
}

function scoreRecipe(r,selected,have){
  const hv=have||haveKeys();
  const sel=(selected||[]).map(norm).filter(Boolean);
  let matched=0,usedSel=0;
  const missing=[];
  const scratch=[];
  r.ingredients.forEach(i=>{
    if(!ingredientCounts(i))return;
    if(isFree(i.item))return;                 // doesn't count for or against
    /* Text we could not reduce to anything. Never assume we have it — an
       unreadable line silently skipped is what let a cranberry sauce with
       no cranberries report "can make now". */
    if(!i.key){ missing.push(Object.assign({},i,{unknown:true})); return; }
    const inSel=sel.some(s=>answers(s,i.item));
    const held=hv.some(k=>answers(k,i.item));
    if(inSel)usedSel++;
    if(inSel||held){ matched++; return; }
    const mk=canMake(i.item);          // don't have it, but could make it
    if(mk){ matched++; scratch.push(mk); return; }
    missing.push(i);
  });
  const total=r.ingredients.filter(i=>ingredientCounts(i)&&!isFree(i.item)).length||1;
  const selHits=sel.filter(s=>r.ingredients.some(i=>sameThing(s,i.item))).length;
  const coverage=matched/total;
  const rating=parseFloat(r.meta.rating||0)||0;
  const never=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
  const subs=missing.map(m=>({ing:m,sub:findSub(m.item)}));
  const shoppable=subs.filter(s=>!s.sub).length;
  let score = coverage*100 + selHits*40 - shoppable*7 + rating*2 - scratch.length*4;
  if(sel.length && selHits<sel.length) score -= (sel.length-selHits)*35;
  return {recipe:r,coverage,matched,total,missing,subs,selHits,never,scratch,score};
}
/* ---------- search ----------
   "beef" should find the short ribs. "short ribs" should not find every
   beef recipe. So: exact and substring matches always count, and a
   family name additionally matches anything in that family. */
function searchScore(r,q){
  const raw=String(q||'').trim().toLowerCase();
  if(!raw)return 1;
  const nq=norm(raw);
  let s=0;
  const name=r.name.toLowerCase();
  if(name===raw)s+=100;
  else if(name.includes(raw))s+=60;
  if(r.tags.some(t=>t.toLowerCase()===raw))s+=40;
  else if(r.tags.some(t=>t.toLowerCase().includes(raw)))s+=15;
  r.ingredients.forEach(i=>{
    if(sameThing(i.item,raw))s+=45;                       // "short ribs" -> the short rib recipe
    else if(i.item.toLowerCase().includes(raw))s+=25;
    else if(nq && norm(i.item).includes(nq))s+=20;
  });
  if(FAMILY[nq]){                                          // "beef" -> chuck, short ribs, brisket…
    const hit=r.ingredients.some(i=>familyOf(i.item)===nq);
    if(hit)s+=35;
    if(r.tags.some(t=>norm(t)===nq))s+=10;
  }
  if(r.steps.join(' ').toLowerCase().includes(raw))s+=5;
  if((r.notes||'').toLowerCase().includes(raw))s+=3;
  return s;
}
function rankRecipes(selected,opts={}){
  const have=haveKeys();
  let list=S.recipes.map(r=>scoreRecipe(r,selected,have));
  if(opts.tag) list=list.filter(x=>x.recipe.tags.some(t=>t.toLowerCase().includes(opts.tag.toLowerCase())));
  if(opts.q && opts.q.trim()){
    list=list.map(x=>Object.assign(x,{search:searchScore(x.recipe,opts.q)}))
             .filter(x=>x.search>0)
             .map(x=>Object.assign(x,{score:x.score+x.search*3}));
  }
  if(opts.maxMissing!=null) list=list.filter(x=>x.missing.filter(m=>!findSub(m.item)).length<=opts.maxMissing);
  list.sort((a,b)=>b.score-a.score);
  return list;
}
/* recipes we could put on the table right now with nothing bought */
function cookableNow(){ return rankRecipes([]).filter(x=>x.missing.length===0); }
/* …and the ones a house substitution would rescue */
function cookableWithSwaps(){
  return rankRecipes([]).filter(x=>x.missing.length>0
    && x.missing.every(m=>findSub(m.item)||isDroppable(m.item)));
}
function isDroppable(item){
  const raw=String(item||'').toLowerCase().trim();
  const n=norm(item);
  if(!raw)return false;
  return (S.rules.drop||[]).some(d=>{
    const dr=String(d).toLowerCase().trim();
    if(!dr)return false;
    if(raw.includes(dr))return true;                 // "garnish" normalises to nothing, so match raw too
    const dn=norm(d);
    return !!dn && (sameThing(d,item)||(!!n&&n.includes(dn)));
  });
}

/* ============================================================
   COST — what a meal actually costs, from what we actually paid
   It refuses to guess. If we have never bought a thing, or bought it
   in units that cannot be converted, it says so rather than inventing
   a number and quietly making every total wrong.
   ============================================================ */
function priceHistory(item){
  return (S.prices.buy||[]).filter(b=>sameThing(b.item,item))
    .slice().sort((a,b)=>b.date.localeCompare(a.date));
}
/* the most recent price, expressed per base unit (per g, per ml, per one) */
function unitPrice(item){
  const hist=priceHistory(item);
  for(const b of hist){
    const base=toBase(b.qty||'1',b.unit||'');
    if(!base||!base.n)continue;
    return {per:b.price/base.n,fam:base.fam,unit:b.unit||'',paid:b.price,on:b.date,store:b.store,
      amount:[b.qty,b.unit].filter(Boolean).join(' ')||'1'};
  }
  return null;
}
function bestPrice(item){
  const hist=priceHistory(item);
  let best=null;
  hist.forEach(b=>{
    const base=toBase(b.qty||'1',b.unit||'');
    if(!base||!base.n)return;
    const per=b.price/base.n;
    if(!best||per<best.per)best={per,fam:base.fam,paid:b.price,on:b.date,store:b.store};
  });
  return best;
}
/* seasonings used by the pinch are not worth pricing and should not
   make the total look uncertain */
function negligible(ing){
  if(isFree(ing.item))return true;                          // it comes out of the wall
  const n=norm(ing.item);
  const seasonings=S.pantry.groups.filter(g=>/seasoning|spice/.test(g.name)).flatMap(g=>g.items);
  if(seasonings.some(x=>sameThing(x.name,ing.item)))return true;
  if(!ing.qty && /salt|pepper|oil|water/.test(norm(ing.item)))return true;
  return false;
}
/* what one of a thing weighs, in grams, if we have been told */
function typicalWeight(item){
  const W=(S.prices&&S.prices.weights)||{};
  for(const k of Object.keys(W)) if(sameThing(W[k].item,item))return W[k].g;
  return null;
}
function fx0(n){ return Math.round(n); }
/* What one <unit> of this item weighs — the missing piece that made
   "20 pieces small green cabbage" cost forty pounds of cabbage. A unit like
   "clove" or "pinch" means much the same whatever the food, so it carries an
   absolute weight. A unit like "piece" or "leaf" only means anything relative
   to the thing it came off, so it is held as a fraction of one whole and
   resolved against that thing's typical weight. */
function portionRule(unit){
  const u=unitKey(unit);
  if(!u)return null;
  const user=(S.prices&&S.prices.portions)||{};
  return user[u]||PORTION_DEFAULT[u]||null;
}
function portionWeight(item,unit,rawName){
  const r=portionRule(unit);
  if(!r)return null;
  const size=sizeFactor(rawName||item);
  if(r.of==='whole'){
    const w=typicalWeight(item);
    if(w==null)return null;
    return {fam:'weight',n:w*r.f*size,
            why:r.as+' of a '+fx0(w)+' g '+item+(size!==1?', scaled for size':'')};
  }
  return {fam:r.fam,n:r.n*size,
          why:'one '+unitKey(unit)+' \u2248 '+r.as+(size!==1?', scaled for size':'')};
}
/* recipes count things; shops sell them by weight. Bridge the two, but only
   with an assumption we can point at, and always flag it as an estimate. */
function crossConvert(item,base,targetFam,unit,rawName,priceUnit){
  if(!base)return null;
  if(base.fam===targetFam){
    /* Both counts, but a handful is not a bunch. Convert through what each
       one weighs if we can; if we cannot, at least stop calling it a fact. */
    if(base.fam==='count'&&unitKey(unit)!==unitKey(priceUnit)){
      const a=portionWeight(item,unit,rawName), b2=portionWeight(item,priceUnit,rawName);
      if(a&&b2&&a.fam===b2.fam&&b2.n)
        return {n:base.n*a.n/b2.n,est:true,
                why:'one '+(unitKey(unit)||'of these')+' against one '+(unitKey(priceUnit)||'unit')+' bought'};
      if(unit||priceUnit)
        return {n:base.n,est:true,
                why:'counted in '+(unitKey(unit)||'units')+', bought by the '+(unitKey(priceUnit)||'unit')+' \u2014 treated as the same size'};
    }
    return {n:base.n,est:false};
  }
  const size=sizeFactor(rawName||item);
  /* One WHAT? A counted unit knows its own size, and asking it first is the
     whole difference between twenty leaves and twenty cabbages. */
  if(base.fam==='count'){
    const p=portionWeight(item,unit,rawName);
    if(p)return {n:base.n*p.n,est:true,why:p.why};
  }
  const w=typicalWeight(item);
  if(base.fam==='count'&&targetFam==='weight'&&w!=null){
    const n=base.n*w*size;
    /* Backstop: a bare count with no unit landing somewhere absurd is more
       likely a misread ingredient than a real shopping list. */
    return {n,est:true,wild:(base.n>=6 && n>2270),
            why:trimNum(base.n)+' \u00d7 one '+item+' at '+fx0(w*size)+' g'};
  }
  if(base.fam==='weight'&&targetFam==='count'&&w)return {n:base.n/(w*size),est:true};
  if(base.fam==='count'&&targetFam==='volume'&&w!=null)return {n:base.n*w*size,est:true};
  /* for anything wet, a millilitre weighs about a gram. Wrong for flour,
     close enough for stock, milk, paste and sauce. */
  if((base.fam==='volume'&&targetFam==='weight')||(base.fam==='weight'&&targetFam==='volume'))
    return {n:base.n,est:true,why:'a millilitre of this weighs about a gram'};
  return null;
}
function recipeCost(recipe,servingsMultiplier){
  const mult=servingsMultiplier||1;
  let total=0;
  const priced=[],unpriced=[],skipped=[],estimated=[];
  recipe.ingredients.forEach(i=>{
    if(!i.key)return;
    if(negligible(i)){ skipped.push(i.item); return; }
    const up=unitPrice(i.item);
    if(!up){ unpriced.push(i.item); return; }
    const conv=crossConvert(i.item,toBase(i.qty||'1',i.unit||''),up.fam,i.unit,i.raw||i.item,up.unit);
    if(!conv){ unpriced.push(i.item); return; }
    const c=up.per*conv.n*mult;
    total+=c;
    if(conv.est)estimated.push(i.item);
    priced.push({item:i.item,cost:c,on:up.on,store:up.store,est:conv.est,wild:!!conv.wild,
                 why:conv.why||null,
                 asked:(i.qty?i.qty+' ':'')+(i.unit?i.unit+' ':'')});
  });
  /* One guess can swamp everything else. When it does, say so instead of
     printing a confident-looking figure that is mostly that guess. */
  const guesses=priced.filter(x=>x.est).sort((a,b)=>b.cost-a.cost);
  const worst=guesses[0]||null;
  const shaky=(worst&&total>0&&(worst.wild||(worst.cost/total>0.5&&total>=20)))?worst:null;
  return {total,priced:priced.slice().sort((a,b)=>b.cost-a.cost),unpriced,skipped,estimated,shaky,
    firm: total-guesses.reduce((a,x)=>a+x.cost,0),
    complete:unpriced.length===0,
    confidence: priced.length+unpriced.length ? priced.length/(priced.length+unpriced.length) : 0};
}
function costLabel(c){
  if(!c.priced.length)return null;
  if(c.shaky)return 'maybe '+money(c.total);
  if(!c.complete)return 'from '+money(c.total);
  return (c.estimated.length?'about ':'')+money(c.total);
}
/* spending, by month and in total */
function spending(){
  const rows=[];
  (S.prices.buy||[]).forEach(b=>rows.push({date:b.date,price:b.price,store:b.store,what:b.item}));
  (S.prices.other||[]).forEach(o=>rows.push({date:o.date,price:o.price,store:o.store,what:o.what,other:true}));
  const byMonth={};
  rows.forEach(r=>{ const m=(r.date||'').slice(0,7); if(!m)return;
    byMonth[m]=(byMonth[m]||0)+r.price; });
  const byStore={};
  rows.forEach(r=>{ const s=r.store||'unknown'; byStore[s]=(byStore[s]||0)+r.price; });
  return {rows,byMonth,byStore,total:rows.reduce((a,r)=>a+r.price,0)};
}
/* record a shop — used by the manual form and by receipt processing */
function recordPurchase({date,store,items,other}){
  const d=date||todayISO();
  (items||[]).forEach(it=>{
    S.prices.buy.push({date:d,item:it.item,qty:it.qty||'1',unit:it.unit||'',
      price:parseFloat(it.price)||0,store:store||'',key:norm(it.item)});
    /* bought it, so we have it again */
    S.pantry.groups.forEach(g=>g.items.forEach(p=>{
      if(!sameThing(p.name,it.item))return;
      setLevel(p,'plenty');
      if(it.qty){ p.qty=it.qty; p.unit=it.unit||null; }
      p.bought=d;
      S.grocery.need=S.grocery.need.filter(t=>t!==p.name);
    }));
  });
  (other||[]).forEach(o=>S.prices.other.push({date:d,what:o.what,price:parseFloat(o.price)||0,store:store||''}));
  return true;
}

/* ============================================================
   WHERE TO SHOP
   ============================================================ */
function storeFor(item){
  const month=new Date().getMonth()+1;
  /* an explicit rule wins */
  for(const k of Object.keys(S.stores.best||{})){
    const b=S.stores.best[k];
    if(sameThing(b.item,item)||norm(item).includes(norm(b.item)))
      return {store:b.store,why:'we always get it there'};
  }
  /* in season and someone sells seasonal produce */
  const seasonal=inSeason(item,month);
  if(seasonal){
    const farm=(S.stores.list||[]).find(s=>s.good.some(g=>/season|produce|vegetable|farm/i.test(g)));
    if(farm)return {store:farm.name,why:'in season right now'};
  }
  /* a store that lists this category as a speciality */
  const cat=familyOf(item);
  const byCat=(S.stores.list||[]).find(s=>s.good.some(g=>
    sameThing(g,item)||(cat&&norm(g)===cat)||norm(item).includes(norm(g))));
  if(byCat)return {store:byCat.name,why:'they are good for '+item};
  /* otherwise, wherever it was cheapest */
  const best=bestPrice(item);
  if(best&&best.store)return {store:best.store,why:'cheapest we have paid, '+money(best.paid)+' on '+best.on};
  const dflt=(S.stores.list||[]).find(s=>s.good.some(g=>/everything|default/i.test(g)));
  return dflt?{store:dflt.name,why:'default'}:null;
}
function shoppingRoute(items){
  const by={};
  items.forEach(t=>{
    const name=typeof t==='string'?t:t.item||t.text;
    const s=storeFor(name)||{store:'anywhere',why:''};
    (by[s.store]=by[s.store]||{store:s.store,items:[],why:{}}).items.push(name);
    by[s.store].why[name]=s.why;
  });
  return Object.values(by).sort((a,b)=>b.items.length-a.items.length);
}

/* ---------- planner ---------- */
function guestsOn(iso){ return (S.plan.guests||[]).find(g=>iso>=g.from&&iso<=g.to)||null; }
function houseSize(){ return parseInt((S.rules.portions||{}).serves||'2')||2; }
/* how many portions to cook on a given day */
function portionsOn(iso){ const g=guestsOn(iso); return houseSize()+(g?g.extra:0); }
function isFavourite(r){ return (S.plan.favourites||[]).some(f=>sameThing(f,r.name)||f.toLowerCase()===r.name.toLowerCase()); }
function isAway(iso){ return S.plan.away.some(a=>iso>=a.from&&iso<=a.to); }
function nextTrip(fromISO){
  const t=S.plan.away.filter(a=>a.from>=fromISO).sort((a,b)=>a.from.localeCompare(b.from));
  return t[0]||null;
}
function isSkipped(iso,meal){ return S.plan.skip.some(s=>s.date===iso&&s.meal===meal); }
function skipReason(iso,meal){ const s=S.plan.skip.find(s=>s.date===iso&&s.meal===meal); return s?s.reason:''; }
function recipeByName(name){
  if(!name)return null;
  const n=name.toLowerCase().trim();
  return S.recipes.find(r=>r.name.toLowerCase()===n)
      || S.recipes.find(r=>r.name.toLowerCase().includes(n)||n.includes(r.name.toLowerCase()))
      || null;
}
function perishScore(r){
  // how much of this recipe leans on stuff that goes bad — used to burn down the fridge before a trip
  const fridge=S.pantry.groups.filter(g=>/fridge|produce|veg/.test(g.name)).flatMap(g=>g.items);
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  let s=0;
  r.ingredients.forEach(i=>{
    if(fridge.some(f=>sameThing(f.name,i.item)))s+=2;
    if(freezer.some(f=>sameThing(f.name,i.item)))s+=1;
  });
  if(r.tags.some(t=>/use it up|flexible|clean/i.test(t)))s+=4;
  return s;
}
function buildPlan(startISO,days,opts={}){
  const out=[];
  const used=new Set();
  const trip=nextTrip(startISO);
  const have=haveKeys();
  for(let d=0;d<days;d++){
    const iso=fmtDate(addDays(parseDate(startISO),d));
    if(isAway(iso)){ out.push({date:iso,meal:'dinner',away:true,
      reason:(S.plan.away.find(a=>iso>=a.from&&iso<=a.to)||{}).label||'away'}); continue; }
    if(isSkipped(iso,'dinner')){ out.push({date:iso,meal:'dinner',skip:true,reason:skipReason(iso,'dinner')}); continue; }
    const existing=S.plan.plan.find(p=>p.date===iso&&p.meal==='dinner');
    if(existing && !opts.replace){
      out.push({date:iso,meal:'dinner',recipe:recipeByName(existing.recipe),name:existing.recipe,pinned:true,
        guest:guestsOn(iso),portions:portionsOn(iso),
        reason:guestsOn(iso)?`${guestsOn(iso).who} staying — cooking for ${portionsOn(iso)}`:''});
      used.add((recipeByName(existing.recipe)||{}).fileId); continue;
    }
    const daysToTrip = trip?dayDiff(iso,trip.from):999;
    const guest=guestsOn(iso);
    let pool=S.recipes.filter(r=>!used.has(r.fileId));
    if(!pool.length){ used.clear(); pool=S.recipes.slice(); }   // small library — start the rotation over
    const cands=pool.map(r=>{
      const sc=scoreRecipe(r,[],have);
      let s=sc.score;
      if(daysToTrip<=2 && daysToTrip>=0){ s+=perishScore(r)*6; s-=sc.missing.length*10; }   // burn the fridge down, buy nothing
      else if(daysToTrip<=4) s+=perishScore(r)*2;
      if(guest && isFavourite(r)) s+=80;                             // people are staying — cook the good stuff
      s+=Math.random()*3;                                            // a little shuffle so it isn't the same week forever
      return {r,s,sc,daysToTrip};
    }).sort((a,b)=>b.s-a.s);
    const pick=cands[0];
    out.push({date:iso,meal:'dinner',recipe:pick?pick.r:null,name:pick?pick.r.name:'',
      score:pick?pick.sc:null,guest,portions:portionsOn(iso),
      reason: guest ? `${guest.who} staying — cooking for ${portionsOn(iso)}`
        : (daysToTrip<=2&&daysToTrip>=0 ? `${daysToTrip===0?'leaving today':'before '+(trip.label||'the trip')} — uses what's here`:'')});
    if(pick)used.add(pick.r.fileId);
  }
  return out;
}
function thawFor(planRows){
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  const out=[];
  planRows.forEach(row=>{
    if(!row.recipe)return;
    row.recipe.ingredients.forEach(i=>{
      const hit=freezer.find(f=>sameThing(f.name,i.item));
      if(!hit)return;
      let hours=null;
      Object.keys(S.rules.thaw).forEach(k=>{ if(sameThing(k,i.item)&&(hours==null||S.rules.thaw[k]>hours))hours=S.rules.thaw[k]; });
      if(hours==null)hours=12;
      const dinner=parseDate(row.date); dinner.setHours(APP.DINNER_HOUR,0,0,0);
      const when=new Date(dinner.getTime()-hours*3600e3);
      out.push({item:hit.name,recipeItem:i.item,date:row.date,meal:row.meal,hours,late:when<new Date(),
        when:fmtDate(when)+' '+String(when.getHours()).padStart(2,'0')+':00',
        whenD:when,recipe:row.recipe.name});
    });
  });
  out.sort((a,b)=>a.whenD-b.whenD);
  return out;
}

/* ---------- grocery ---------- */
function buildGrocery(planRows){
  const have=pantryHave(S.pantry);
  const bucket=new Map();
  planRows.forEach(row=>{
    if(!row.recipe)return;
    const serves=parseInt(row.recipe.meta.serves||houseSize())||houseSize();
    const mult=row.portions?Math.max(1,row.portions/serves):1;
    row.recipe.ingredients.forEach(i=>{
      if(!ingredientCounts(i))return;
      if(isFree(i.item))return;                          // never shopping
      if(have.some(h=>answers(h.name,i.item)))return;
      if(canMake(i.item))return;                       // we can make this from what's here
      const comp=componentFor(i.item);
      if(comp){                                        // we make this, but are short an input
        comp.ingredients.forEach(ci=>{
          if(!ci.key||isFree(ci.item)||negligible(ci))return;
          if(have.some(h=>answers(h.name,ci.item)))return;
          const ck=ci.key;
          if(!bucket.has(ck))bucket.set(ck,{item:ci.item,parts:[],forr:new Set()});
          const cb=bucket.get(ck);
          cb.parts.push({qty:ci.qty,unit:ci.unit});
          cb.forr.add('to make '+comp.meta.makes);
        });
        return;
      }
      const k=i.key||('?'+String(i.item).toLowerCase().trim());
      if(!bucket.has(k))bucket.set(k,{item:i.item,parts:[],forr:new Set()});
      const b=bucket.get(k);
      const n=fracToNum(i.qty);
      b.parts.push({qty:n!=null?String(trimNum(n*mult)):i.qty,unit:i.unit});
      b.forr.add(row.recipe.name+(mult>1?' (for '+row.portions+')':''));
    });
  });
  const list=[...bucket.values()].map(b=>{
    const byUnit={};
    let unparsed=false;
    b.parts.forEach(p=>{
      if(!p.qty){unparsed=true;return;}
      const n=fracToNum(p.qty); if(n==null){unparsed=true;return;}
      const u=p.unit||'';
      byUnit[u]=(byUnit[u]||0)+n;
    });
    const amt=Object.keys(byUnit).map(u=>trimNum(byUnit[u])+(u?' '+u:'')).join(' + ');
    return {text:(amt?amt+' ':'')+b.item, item:b.item, forr:[...b.forr]};
  });
  /* being out of something we make ourselves is not a shopping problem —
     the inputs are already on the list above if we are short of them */
  const outOf=pantryAll(S.pantry)
    .filter(i=>i.out && !componentFor(i.name))
    .map(i=>({text:i.name,item:i.name,forr:['out of it']}));
  return list.concat(outOf);
}
function fracToNum(q){
  const s=String(q).trim();
  let m=/^(\d+)\s+(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]+ +m[2]/+m[3];
  m=/^(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]/+m[2];
  m=/^(\d+(?:\.\d+)?)/.exec(s); if(m)return +m[1];
  return null;
}
function trimNum(n){ return Math.round(n*100)/100; }

/* ============================================================
   REFACTOR — the part that makes somebody else's recipe into ours
   ============================================================ */
const PASSES=[
  {id:'units', name:'Tidy units', desc:'½ becomes 1/2, "tablespoons" becomes tbsp, spacing cleaned up.'},
  {id:'swap',  name:'House swaps', desc:'Applies the Swap list in house-rules.md — shallot becomes yellow onion, and so on.'},
  {id:'steps', name:'Link step library', desc:'Recognises steps you already have a house method for and replaces them with @references, so fixing the method once fixes every recipe.'},
  {id:'always',name:'House technique', desc:'Adds the Always rules that apply to this recipe (salt the beef ahead, sear before braising…).'},
  {id:'never', name:'Flag no-go ingredients', desc:'Marks anything on the Never list and removes it when it is only a garnish.'},
  {id:'tags',  name:'Auto-tag', desc:'Adds protein / method / speed tags so the matcher and planner can find it.'},
  {id:'meta',  name:'Fill in the blanks', desc:'Default serves, added date, status.'}
];
function enabledPasses(){ return LS.get('passes',PASSES.map(p=>p.id)); }

function refactor(rec,passIds){
  const on=new Set(passIds||enabledPasses());
  const r=JSON.parse(JSON.stringify(rec));
  const changes=[];
  const push=(pass,before,after,why)=>{ if(before!==after)changes.push({pass,before,after,why}); };

  if(on.has('units')){
    r.ingredients.forEach((i,n)=>{
      const before=i.raw||ingLine(i);
      const p=parseIngredient(before);
      const after=ingLine(p);
      if(before!==after){ Object.assign(i,p,{raw:after,dirty:true}); push('units',before,after,'unit spelling / fractions'); }
    });
    r.steps.forEach((s,n)=>{ const a=deVulgar(s).replace(/\s+/g,' ').trim();
      if(a!==s){ push('units',s,a,'fractions'); r.steps[n]=a; } });
  }

  if(on.has('swap')){
    S.rules.swap.forEach(sw=>{
      const target=sw.to.split(',')[0].trim();
      r.ingredients.forEach(i=>{
        // already the house version — don't swap it twice and re-append the note
        if(norm(i.item)===norm(target) && norm(i.item)!==norm(sw.from))return;
        if(sameThing(i.item,sw.from)){
          const before=ingLine(i);
          const parts=sw.to.split(',');
          i.item=parts[0].trim();
          if(parts.length>1) i.note=[i.note,parts.slice(1).join(',').trim()].filter(Boolean).join(', ');
          i.key=norm(i.item); i.dirty=true; i.raw=ingLine(i);
          push('swap',before,i.raw,'house rule: '+sw.from+' -> '+sw.to);
        }
      });
      r.steps.forEach((s,n)=>{
        const re=new RegExp('\\b'+sw.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','ig');
        if(re.test(s)){ const a=s.replace(re,target);
          push('swap',s,a,'house rule in step text'); r.steps[n]=a; }
      });
    });
  }

  if(on.has('steps')){
    const lib=Object.values(S.steps.map);
    r.steps.forEach((s,n)=>{
      if(/^@/.test(s.trim()))return;
      const low=s.toLowerCase();
      const hit=lib.find(L=>L.matches.some(m=>m&&low.includes(m)));
      if(hit){ const a='@'+hit.name; push('steps',s,a,'we already have a house method for this'); r.steps[n]=a; }
    });
  }

  if(on.has('always')){
    const hay=(r.name+' '+r.tags.join(' ')+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    S.rules.always.forEach(a=>{
      if(!a.trigger)return;
      if(!hay.includes(a.trigger.toLowerCase()))return;
      const already=r.steps.some(s=>s.toLowerCase().includes(a.do.toLowerCase().slice(0,18)))
        || (r.notes||'').toLowerCase().includes(a.do.toLowerCase().slice(0,18));
      if(already)return;
      r.steps.unshift(a.do.charAt(0).toUpperCase()+a.do.slice(1)+'.');
      changes.push({pass:'always',before:'(nothing)',after:a.do,why:'house rule for '+a.trigger});
    });
  }

  if(on.has('never')){
    S.rules.never.forEach(n=>{
      const idx=r.ingredients.findIndex(i=>sameThing(i.item,n));
      if(idx<0)return;
      const line=ingLine(r.ingredients[idx]);
      const garnish=/garnish|to serve|topping|for serving/i.test(line+' '+(r.ingredients[idx].note||''));
      if(garnish){ r.ingredients.splice(idx,1); changes.push({pass:'never',before:line,after:'(removed)',why:n+' is on the Never list and was only a garnish'}); }
      else changes.push({pass:'never',before:line,after:line+'   <-- FLAG',why:n+' is on the Never list — decide what to do'});
    });
  }

  if(on.has('tags')){
    const hay=(r.name+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    const add=[];
    const PROTEIN={beef:['beef','short rib','steak','chuck','brisket','ground beef'],chicken:['chicken'],
      pork:['pork','bacon','sausage','ham'],fish:['salmon','cod','fish','halibut','tuna'],
      shrimp:['shrimp','prawn'],egg:['egg'],tofu:['tofu'],lamb:['lamb'],vegetarian:[]};
    Object.keys(PROTEIN).forEach(k=>{ if(PROTEIN[k].some(w=>hay.includes(w)))add.push(k); });
    const METHOD={braise:['braise','braised'],roast:['roast','oven'],grill:['grill'],fry:['fry','fried','wok'],
      soup:['soup','stew','broth'],'sheet pan':['sheet pan'],'slow':['slow cook','3 hour','4 hour'],'one pan':['one pan','same pan']};
    Object.keys(METHOD).forEach(k=>{ if(METHOD[k].some(w=>hay.includes(w)))add.push(k); });
    const t=(r.meta.time||'');
    const mins=(/(\d+)\s*h/.test(t)?parseInt(/(\d+)\s*h/.exec(t)[1])*60:0)+(/(\d+)\s*m/.test(t)?parseInt(/(\d+)\s*m/.exec(t)[1]):0);
    if(mins&&mins<=35)add.push('fast'); if(mins&&mins>=150)add.push('long');
    const before=r.tags.join(', ');
    r.tags=uniq(r.tags.concat(add.filter(x=>x)));
    push('tags',before,r.tags.join(', '),'derived from the ingredients and method');
  }

  if(on.has('meta')){
    if(!r.meta.serves){ r.meta.serves=(S.rules.portions.serves||'2'); changes.push({pass:'meta',before:'(no serves)',after:'serves: '+r.meta.serves,why:'house default'}); }
    if(!r.meta.added){ r.meta.added=todayISO(); changes.push({pass:'meta',before:'(no added date)',after:'added: '+r.meta.added,why:''}); }
    if(!r.meta.status){ r.meta.status='untested'; changes.push({pass:'meta',before:'(no status)',after:'status: untested',why:'mark it tested once it works'}); }
  }

  return {result:r,changes};
}

/* ============================================================
   MAKE IT — adapt a recipe to what is actually in the house
   Substitute what we can, drop what doesn't matter, swap the protein
   if you want to, and be loud about every change.
   ============================================================ */
function makeIt(recipe,opts={}){
  const r=JSON.parse(JSON.stringify(recipe));
  const changes=[];
  const have=pantryHave(S.pantry);
  const hasIt=n=>have.some(h=>answers(h.name,n));
  const note=(kind,text,was)=>changes.push({kind,text,was:was||null});

  /* 1 — swap the whole protein, if asked */
  if(opts.protein){
    const target=opts.protein;
    const rule=S.rules.proteins[norm(target)]||null;
    const oldIdx=r.ingredients.findIndex(i=>isProtein(i.item));
    const oldName=oldIdx>=0?r.ingredients[oldIdx].item:null;
    const oldFam=oldName?isProtein(oldName):null;

    /* strip out everything that was only there because of the old protein */
    if(oldFam){
      const oldRule=S.rules.proteins[norm(oldFam)]||null;
      const before=r.steps.length;
      r.steps=r.steps.filter(s=>{
        const low=s.toLowerCase();
        if(oldRule&&oldRule.technique&&low.includes(oldRule.technique.toLowerCase().slice(0,20)))return false;
        return !S.rules.always.some(a=>a.trigger
          && (norm(a.trigger)===norm(oldFam)||isProtein(a.trigger)===oldFam)
          && low.includes(a.do.toLowerCase().slice(0,16)));
      });
      if(r.steps.length<before)note('technique','dropped the '+oldFam+' method');
      /* drop the old protein's pairings too, so fish doesn't inherit bay leaf */
      if(oldRule){
        oldRule.add.forEach(a=>{
          const n=r.ingredients.findIndex(i=>sameThing(i.item,a));
          if(n>=0 && !(rule&&rule.add.some(x=>sameThing(x,a)))){
            r.ingredients.splice(n,1);
            note('drop',`${a} — that was there for the ${oldFam}`);
          }
        });
      }
    }

    if(oldIdx>=0){
      const ing=r.ingredients.find(i=>isProtein(i.item));
      if(ing){ ing.item=target; ing.key=norm(target); ing.dirty=true; ing.chosen=true; ing.raw=ingLine(ing); }
      note('protein',`${target} instead of ${oldName}`,oldName);
      /* reword the written steps so they stop talking about ribs */
      const words=uniq(String(oldName).toLowerCase().split(/\s+/).concat(norm(oldName).split(' ')))
        .filter(w=>w.length>3);
      if(words.length){
        const re=new RegExp('\\b('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(s|es)?\\b','ig');
        const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
        r.steps=r.steps.map(s=>cap(s.replace(re,target)));
        r.notes=(r.notes||'').replace(re,target);
      }
    }else{
      r.ingredients.unshift(Object.assign(parseIngredient(target),{dirty:true,chosen:true}));
      note('protein',`added ${target}`);
    }

    if(rule){
      rule.add.forEach(a=>{
        if(r.ingredients.some(i=>sameThing(i.item,a)))return;
        r.ingredients.push(Object.assign(parseIngredient(a),{dirty:true}));
        note('add',`${a} — goes with ${target}`);
      });
      if(rule.technique){
        r.steps.unshift('With '+target+': '+rule.technique+'.');
        note('technique',rule.technique);
      }
      if(rule.time){ r.meta.time=rule.time; note('technique','timing: '+rule.time); }
    }
    /* apply the house Always rules that belong to the NEW protein only —
       the recipe's own tags still say "braise", and they are no longer true */
    S.rules.always.forEach(a=>{
      if(!a.trigger||!target.toLowerCase().includes(a.trigger.toLowerCase()))return;
      if(r.steps.some(s=>s.toLowerCase().includes(a.do.toLowerCase().slice(0,18))))return;
      r.steps.splice(1,0,a.do.charAt(0).toUpperCase()+a.do.slice(1)+'.');
      note('technique',a.do+' — house rule for '+a.trigger);
    });
    if(oldFam){
      r.tags=r.tags.filter(t=>norm(t)!==norm(oldFam));
      if(!r.tags.includes(target))r.tags.unshift(target);
      note('warn','the written steps below were composed for '+oldFam+
        ' — the method line at the top wins where they disagree');
    }
  }

  /* 2 — anything we don't have: make it, substitute, drop, or flag */
  const missing=[];
  const scratchUsed=[];
  for(let n=r.ingredients.length-1;n>=0;n--){
    const i=r.ingredients[n];
    if(!ingredientCounts(i)||isFree(i.item))continue;
    if(!i.key){ missing.push(i.item); continue; }        // unreadable — never assume
    if(hasIt(i.item))continue;
    if(i.chosen){ missing.push(i.item); continue; }   // you asked for this one — never drop it
    if(!opts.noScratch){
      const mk=canMake(i.item);
      if(mk){
        i.scratch=mk.recipe.name;
        scratchUsed.push(mk);
        note('scratch',`${i.item} — we don't have it, but we can make it: ${mk.recipe.name}`);
        continue;
      }
    }
    const sub=findSub(i.item);
    if(sub){
      const was=i.item;
      i.item=sub.to.split(',')[0].trim(); i.key=norm(i.item); i.dirty=true; i.sub=was; i.raw=ingLine(i);
      note('sub',`${i.item} instead of ${was}`,was);
      continue;
    }
    if(isDroppable(i.item)){
      note('drop',`left out the ${i.item}`,i.item);
      r.ingredients.splice(n,1);
      continue;
    }
    missing.push(i.item);
  }
  missing.reverse();

  /* 3 — splice the making-of into the top of the method, and bring its
     shopping along, so the page you cook from is complete */
  if(scratchUsed.length){
    scratchUsed.reverse();
    const pre=[];
    scratchUsed.forEach(mk=>{
      const t=mk.recipe.meta.time?' — '+mk.recipe.meta.time:'';
      pre.push('First, the '+mk.item+''+t+':');
      mk.recipe.steps.forEach(st=>pre.push(st));
      mk.recipe.ingredients.forEach(ing=>{
        if(negligible(ing))return;
        if(r.ingredients.some(x=>sameThing(x.item,ing.item)))return;
        const copy=Object.assign({},ing,{forScratch:mk.item,dirty:true});
        r.ingredients.push(copy);
      });
    });
    r.steps=pre.concat(r.steps);
  }

  if(missing.length)note('missing','still need: '+missing.join(', '));
  return {recipe:r,changes,missing,scratch:scratchUsed};
}
/* proteins we could swap in, given what's in the house */
function availableProteins(){
  const out=[];
  pantryHave(S.pantry).forEach(i=>{ if(isProtein(i.name))out.push(i.name); });
  return uniq(out);
}

/* ============================================================
   COOKING SOMETHING USES IT UP
   Perishables step down a level; a seasoning is not "used up" by a
   pinch of it. Everything is a suggestion you can override in one tap.
   ============================================================ */
function deductPlan(recipe){
  const rows=[];
  S.pantry.groups.forEach(g=>g.items.forEach(i=>{
    if(i.out)return;
    const used=recipe.ingredients.find(x=>answers(i.name,x.item)&&!isFree(x.item));
    if(!used)return;
    const perishable=/fridge|freezer|produce|veg|meat/.test(g.name);
    let suggestion='keep';
    if(i.level==='low')suggestion='out';
    else if(perishable)suggestion='down';
    rows.push({item:i,group:g.name,used:ingLine(used),suggestion,choice:suggestion});
  }));
  return rows;
}
/* "leaves: chicken bones" — roast a chicken, gain the makings of stock */
function applyLeaves(recipe){
  const list=String((recipe.meta||{}).leaves||'').split(',').map(x=>x.trim()).filter(Boolean);
  const added=[];
  list.forEach(name=>{
    let found=null;
    S.pantry.groups.forEach(g=>g.items.forEach(i=>{ if(sameThing(i.name,name))found=i; }));
    if(found){ setLevel(found,'plenty'); found.bought=todayISO(); }
    else{
      const g=S.pantry.groups.find(x=>/freezer/.test(x.name))||S.pantry.groups[0];
      g.items.push({name,level:'plenty',out:false,qty:null,unit:null,bought:todayISO(),key:norm(name)});
    }
    S.grocery.need=S.grocery.need.filter(t=>t!==name);
    added.push(name);
  });
  return added;
}
function applyDeduct(rows){
  const nowOut=[];
  rows.forEach(r=>{
    if(r.choice==='keep')return;
    if(r.choice==='out'){ setLevel(r.item,'out'); nowOut.push(r.item.name); }
    else { stepDown(r.item); if(r.item.out)nowOut.push(r.item.name); }
  });
  nowOut.forEach(name=>{
    if(!S.grocery.need.includes(name)&&!S.grocery.manual.includes(name))S.grocery.need.push(name);
    S.grocery.got=S.grocery.got.filter(t=>t!==name);
  });
  return nowOut;
}

/* ---------- turn a pasted blob into a recipe ---------- */
const ING_HEAD=/^\s*#*\s*(ingredients|what you.ll need|shopping list)\s*:?\s*$/i;
const STEP_HEAD=/^\s*#*\s*(instructions|directions|steps|method|preparation|how to make.*)\s*:?\s*$/i;
const NOTE_HEAD=/^\s*#*\s*(notes?|tips?)\s*:?\s*$/i;
function looksIngredient(l){
  const s=l.trim();
  if(!s||s.length>90)return false;
  if(QTY.test(s))return true;
  const w=s.toLowerCase().split(/[\s,]+/);
  if(w.some(x=>UNIT_CANON[x]))return true;
  if(w.length<=5 && !/[.!?]$/.test(s) && !/^(then|next|add|heat|cook|stir|place|remove|serve|preheat)/i.test(s))return true;
  return false;
}
function captureParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  let name='', ing=[], steps=[], notes=[], mode='?';
  let firstReal=lines.findIndex(l=>l.trim());
  if(firstReal>=0) name=lines[firstReal].replace(/^#+\s*/,'').trim().slice(0,90);
  for(let n=(firstReal<0?0:firstReal+1);n<lines.length;n++){
    const l=lines[n], t=l.trim();
    if(!t)continue;
    if(ING_HEAD.test(t)){mode='i';continue;}
    if(STEP_HEAD.test(t)){mode='s';continue;}
    if(NOTE_HEAD.test(t)){mode='n';continue;}
    const clean=t.replace(/^([-*•▢]|\d+[.)])\s*/,'').trim();
    if(!clean)continue;
    if(mode==='i'){
      // "Kosher salt and freshly ground black pepper" is two ingredients, not one
      const sp=/^(.*\bsalt)\s+and\s+(.*\bpepper.*)$/i.exec(clean);
      if(sp){ ing.push(sp[1].trim()); ing.push(sp[2].trim()); } else ing.push(clean);
    }
    else if(mode==='s')steps.push(clean);
    else if(mode==='n')notes.push(clean);
    else { if(looksIngredient(clean))ing.push(clean); else steps.push(clean); }
  }
  // a pasted transcript often has no ingredient list at all — pull nouns out of the steps
  if(!ing.length && steps.length){
    const found=new Set();
    const vocab=uniq(pantryAll(S.pantry).map(i=>i.name)
      .concat(S.recipes.flatMap(r=>r.ingredients.map(i=>i.item))));
    vocab.forEach(v=>{ const re=new RegExp('\\b'+norm(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','i');
      if(re.test(steps.join(' ')))found.add(v); });
    ing=[...found];
  }
  const r={name:name||'Untitled',meta:{source:'pasted'},tags:[],
    ingredients:ing.map(parseIngredient),steps,notes:notes.join('\n'),raw:text};
  r.slug=slug(r.name);
  return r;
}

    body:JSON.stringify({model,max_tokens:3000,system:sys,

  tucker   :{k:'IND', s:'Tucker, G., 2021, Campden BRI — oven spring completes in roughly the first third of the bake; gelatinisation above 60 °C'},
  craft    :{k:'craft',s:'Conventional formula. No published coefficient behind it — a starting point to edit, not a result.'},
  nodata   :{k:'no data',s:'The knowledge base has no published figure for this. Said so rather than invented.'}
};

/* ---------- fermentation kinetics ----------------------------------
   Two independent models, used for two different jobs, because that
   is as far as the evidence goes:

   1. Cucuzza's temperature / % rise matrix gives the base bulk
      duration. It is the only published thing that maps a dough
      temperature to an actual bulk time. Single practitioner source,
      one calibration formula. [PRAC]

   2. A Rosso cardinal-temperature model on the yeast's published
      growth constants gives the *ratio* between two inoculations at
      the same temperature. Used only to move off Cucuzza's 20%
      starter, never to generate an absolute time. [PR, derived]
   ------------------------------------------------------------------ */

const YEAST={tmin:8,topt:27,tmax:36,umax:0.42};   // Kazachstania humilis (Candida milleri) — Gänzle 1998
const LABUG={tmin:3.5,topt:32.5,tmax:41,umax:0.69}; // Fructilactobacillus sanfranciscensis — Gänzle 1998

function rosso(T,c){
  if(T<=c.tmin||T>=c.tmax)return 0;
  const num=(T-c.tmax)*Math.pow(T-c.tmin,2);
  const den=(c.topt-c.tmin)*((c.topt-c.tmin)*(T-c.topt)-(c.topt-c.tmax)*(c.topt+c.tmin-2*T));
  if(den===0)return 0;
  const r=c.umax*num/den;
  return r>0?r:0;
}
const muYeast=T=>rosso(T,YEAST);
const muLab  =T=>rosso(T,LABUG);

/* Cucuzza 2024 bulk matrix. Calibration that MUST travel with it:
   90% bread flour / 10% whole wheat, 75% hydration, 20% starter
   (≈9.1% prefermented flour), 2% salt. A % rise target quoted
   without its formula, inoculation and temperature is meaningless. */
const BULK_MATRIX=[
  {t:18, rise:100, lo:12, hi:18},
  {t:21, rise:75,  lo:8,  hi:12},
  {t:24, rise:50,  lo:5,  hi:7},
  {t:27, rise:30,  lo:3,  hi:5.5}
];
const PFF_REF=9.1;          // 20% starter at 100% hydration, on total flour
const HYD_REF=75;           // the matrix's calibration hydration
const RETARD_C=3.5;         // 3–4 °C domestic fridge
const PFF_MAX=35;           // practical ceiling — Dumonceaux 2017 [IND]
const PFF_MIN=1.0;

function lerp(a,b,f){ return a+(b-a)*f; }
function matrixAt(T){
  const m=BULK_MATRIX;
  if(T<=m[0].t){ // extrapolate down with the yeast rate model
    const k=muYeast(m[0].t)/Math.max(muYeast(T),1e-4);
    return {rise:m[0].rise, lo:m[0].lo*k, hi:m[0].hi*k, mid:(m[0].lo+m[0].hi)/2*k, out:'below'};
  }
  if(T>=m[m.length-1].t){
    const last=m[m.length-1];
    const k=muYeast(last.t)/Math.max(muYeast(T),1e-4);
    return {rise:last.rise, lo:last.lo*k, hi:last.hi*k, mid:(last.lo+last.hi)/2*k, out:T>last.t?'above':null};
  }
  for(let i=0;i<m.length-1;i++){
    if(T>=m[i].t&&T<=m[i+1].t){
      const f=(T-m[i].t)/(m[i+1].t-m[i].t);
      const lo=lerp(m[i].lo,m[i+1].lo,f), hi=lerp(m[i].hi,m[i+1].hi,f);
      return {rise:lerp(m[i].rise,m[i+1].rise,f), lo, hi, mid:(lo+hi)/2, out:null};
    }
  }
  return {rise:50,lo:5,hi:7,mid:6,out:null};
}

/* Hydration changes gas production. Codină 2011 measured 90-minute gas
   volume across a hydration series: ~11% more gas climbing to the
   farinograph optimum, ~1.6% more beyond it. Slope below optimum
   ≈1.7%/pp, above ≈0.3%/pp. */
function hydrationRateFactor(actual,optimum){
  const d=actual-optimum;
  if(d<0) return Math.max(0.70, 1+d*0.017);
  return Math.min(1.04, 1+d*0.003);
}

/* Enrichment. There is NO published coefficient for fat, sugar, egg or
   dairy effects on fermentation rate anywhere in the knowledge base —
   the one study that would have covered it could not have its
   authorship confirmed and was dropped. These are craft numbers.
   Treat them as a dial to calibrate, not a result. */
function enrichFactor(st){
  const load=(st.sugar||0)+(st.fat||0)+(st.egg||0);
  if(load<=2)return 1.00;
  if(load<=8)return 1.15;
  if(load<=20)return 1.40;
  return 1.80;
}

/* Bulk duration for a given dough temperature and inoculation.
   base    = Cucuzza midpoint at that temperature          [PRAC]
   shift   = (1/µ)·ln(PFF_ref/PFF), exponential-growth inference
             from the yeast's published µ                  [PR, derived] */
function bulkHours(T,pff,opts){
  opts=opts||{};
  const m=matrixAt(T);
  const mu=Math.max(muYeast(T),1e-3);
  const shift=Math.log(PFF_REF/Math.max(pff,0.05))/mu;
  let h=(m.mid+shift);
  h/=hydrationRateFactor(opts.hydration==null?HYD_REF:opts.hydration, opts.optimum==null?HYD_REF:opts.optimum);
  h*=(opts.enrich||1);
  return Math.max(0.25,h);
}
/* Inverse: what inoculation lands the bulk on a given number of hours */
function pffForHours(T,hours,opts){
  opts=opts||{};
  const m=matrixAt(T);
  const mu=Math.max(muYeast(T),1e-3);
  let target=hours/(opts.enrich||1)*hydrationRateFactor(opts.hydration==null?HYD_REF:opts.hydration, opts.optimum==null?HYD_REF:opts.optimum);
  return PFF_REF*Math.exp(mu*(m.mid-target));
}
/* Inverse: what dough temperature lands the bulk on a given number of hours */
function tempForHours(pff,hours,opts){
  let lo=12,hi=32;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    if(bulkHours(mid,pff,opts)>hours) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}

/* Cold retard. Cucuzza instrumented the cooling ramp of a domestic
   fridge: 27→21 °C in ~1 h gaining up to 20% rise, 21→10 °C over ~3 h
   gaining a further 10–20%, 8–10 h in total to reach 3 °C. Once
   equilibrated, 24 h at 3 °C is worth at most 30 min of peak-rate
   bulk. Most of a "retard" is a cooling ramp, not storage. [PRAC] */
function retardRise(hours,entryC){
  if(hours<=0)return 0;
  const warmth=Math.max(0,Math.min(1,(entryC-10)/17));   // 27 °C → 1.0, 10 °C → 0
  const rampFull=35*warmth;                              // 20% + 10–20% over the first ~4 h
  const ramp=rampFull*Math.min(1,hours/4);
  const cold=Math.max(0,hours-9)*(20*0.5/24);            // ≈0.42 %/h once equilibrated
  return ramp+cold;
}

/* ---------- flour and water ---------------------------------------
   Hydration is predicted as ANCHOR + DELTAS, never as an absolute.
   No farinograph-to-sourdough offset has ever been published, so an
   absolute number handed down from a farinograph figure would be a
   fabrication. You supply the hydration that works for you on a flour
   you know; the calculator moves off it.
   ------------------------------------------------------------------ */

const ABS_COEF={
  protein   :{lo:1.5, hi:2.0, cite:'hamelman'},   // pp hydration per pp flour protein
  bran      :{lo:0.55,hi:0.55,cite:'campbell'},   // pp per 1% bran
  stone     :{lo:3.0, hi:4.0, cite:'carcea22'},   // pp for stone-milled, via damaged starch
  scald     :{lo:0.58,hi:0.58,cite:'parenti'},    // pp per 1% of total flour gelatinised
  acid      :{lo:-1.9,hi:-1.9,cite:'koceva'},     // pp for a long-fermented, acidified dough
  einkorn   :{lo:-6.2,hi:-6.2,cite:'brandolini'}  // pp, measured against a 58.8% bread-wheat control
};
/* bran % of total flour ≈ whole-grain flour share × 0.14.
   Cross-check, not agreement: roller-mill stream yields put total bran
   at 21.2–26.7% of the kernel (Carcea 2020), which would give 0.21–0.27.
   The two are not reconciled anywhere. 0.14 is used because that is the
   figure the formula-engineering reference carries; the higher
   multiplier is shown alongside so you can see the spread. */
const BRAN_PER_WG=0.14;
const BRAN_PER_WG_ALT=0.24;

function flourByName(n){
  const k=norm(n);
  return (S.flours||[]).find(f=>norm(f.name)===k)||null;
}
/* Blend properties. pct values are shares of total flour. */
function blendProps(blend){
  const tot=blend.reduce((a,b)=>a+(+b.pct||0),0)||100;
  let protein=0,wg=0,stone=0,fiber=0,haveFiber=0,rye=0,einkorn=0,spelt=0,kernza=0,unknown=[];
  blend.forEach(b=>{
    const w=(+b.pct||0)/tot;
    const f=flourByName(b.flour)||{};
    protein+=w*(f.protein==null?11.5:+f.protein);
    wg     +=w*(f.whole==null?0:+f.whole);
    if(f.mill==='stone')stone+=w*100;
    if(f.fiber!=null){ fiber+=w*(+f.fiber); haveFiber+=w; }
    const g=(f.grain||'').toLowerCase();
    if(g==='rye')rye+=w*100;
    if(g==='einkorn')einkorn+=w*100;
    if(g==='spelt')spelt+=w*100;
    if(g==='kernza')kernza+=w*100;
    if(f.protein==null&&b.flour)unknown.push(b.flour);
  });
  /* If fibre is on the label, use it: refined wheat flour runs
     1.8–2.7% dietary fibre dry matter, whole meal 10.2–11.5%
     (Carcea 2020). Interpolating between those gives a whole-grain
     equivalent that beats guessing from the flour's name. */
  let wgFromFiber=null;
  if(haveFiber>0.5){
    const f=fiber/haveFiber;
    wgFromFiber=Math.max(0,Math.min(100,(f-2.25)/8.6*100));
  }
  const wgUse=wgFromFiber==null?wg:Math.max(wg,wgFromFiber);
  return {protein,wholegrain:wgUse,wgDeclared:wg,wgFromFiber,stone,fiber:haveFiber>0.5?fiber/haveFiber:null,
          rye,einkorn,spelt,kernza,unknown:uniq(unknown),bran:wgUse*BRAN_PER_WG,branAlt:wgUse*BRAN_PER_WG_ALT};
}

function hydrationPlan(blend,opts){
  opts=opts||{};
  const p=blendProps(blend);
  const anchorH=opts.anchorHydration==null?70:+opts.anchorHydration;
  const anchorP=opts.anchorProtein==null?11.5:+opts.anchorProtein;
  const deltas=[];
  const push=(label,lo,hi,cite,note)=>{ if(Math.abs(lo)<0.05&&Math.abs(hi)<0.05)return; deltas.push({label,lo,hi,cite,note}); };

  const dP=p.protein-anchorP;
  push('Protein '+fx(p.protein,1)+'% vs your anchor '+fx(anchorP,1)+'%',
       dP*ABS_COEF.protein.lo, dP*ABS_COEF.protein.hi,'hamelman');
  push('Bran '+fx(p.bran,1)+'% of flour (from '+fx(p.wholegrain,0)+'% whole grain)',
       p.bran*0.55, p.bran*0.55,'campbell',
       'At the alternative 0.24 multiplier this term would be '+fx(p.branAlt*0.55,1)+' pp instead.');
  push(fx(p.stone,0)+'% stone-milled', p.stone/100*3.0, p.stone/100*4.0,'carcea22');
  if(opts.scaldPct>0) push('Scald / tangzhong on '+fx(opts.scaldPct,1)+'% of the flour',
       opts.scaldPct*0.58, opts.scaldPct*0.58,'parenti');
  if(opts.sourdough!==false) push('Acidified, long-fermented dough',-1.9,-1.9,'koceva');
  if(p.einkorn>0) push(fx(p.einkorn,0)+'% einkorn', p.einkorn/100*-6.2, p.einkorn/100*-6.2,'brandolini');

  const lo=anchorH+deltas.reduce((a,d)=>a+d.lo,0);
  const hi=anchorH+deltas.reduce((a,d)=>a+d.hi,0);
  const target=(lo+hi)/2;
  return {anchor:anchorH,anchorProtein:anchorP,deltas,lo,hi,target,props:p};
}

/* ---------- grain ceilings ------------------------------------------
   Answers "how much can I use before it goes dense," but only where a
   number has actually been published. Where none has, it says so.
   -------------------------------------------------------------------- */
function grainLimits(blend){
  const p=blendProps(blend), out=[];
  /* Whole wheat, via bran dose. Campbell measured loaf volume at three
     bran levels: 858 cm³ control, 855 at 7.5% bran (no loss), 768 at
     15% (−11%). Converted through bran ≈ whole-grain × 0.14, 7.5% bran
     is about 54% whole-grain flour. */
  if(p.wholegrain>0){
    const bran=p.bran;
    let loss=0, verdict;
    if(bran<=7.5){ loss=0; verdict='No measured volume loss at this bran level — 7.5% bran gave 855 cm³ against an 858 cm³ control.'; }
    else { loss=(bran-7.5)/7.5*11; verdict='Expect roughly '+fx(loss,0)+'% less loaf volume. Campbell measured −11% at 15% bran; you are at '+fx(bran,1)+'%.'; }
    out.push({grain:'Whole grain',pct:p.wholegrain,ceiling:54,cite:'campbell',
      text:verdict+' The break point works out near 54% whole-grain flour.',
      warn:bran>7.5?(bran>13?'hard':'soft'):null,
      caveat:'Campbell is a paywalled chapter whose tables were not independently retrieved, and the bran-per-whole-grain multiplier is disputed (0.14 vs 0.24). If you use 0.24 your bran is '+fx(p.branAlt,1)+'% and the ceiling drops to about 31% whole grain.'});
    out.push({grain:'Whole grain, particle size',pct:p.wholegrain,cite:'alzuwaid',
      text:'Grind matters and the direction is counterintuitive: fine bran did MORE volume damage while needing 1.0–1.4% LESS water (Alzuwaid 2021). A second study found farinograph absorption flat at 68.3 ± 0.4% right across 77–1687 µm (Jacobs 2015). Two peer-reviewed sources, opposite implications. Coarse grind is the safer bet for volume.'});
  }
  if(p.rye>0){
    out.push({grain:'Rye',pct:p.rye,ceiling:null,cite:'ireks',warn:'soft',
      text:'No published % threshold exists. The circulating 20/40/60% breakpoints have no traceable source. What IS established: rye must be acidified below the α-amylase optimum of pH 5.0–5.5 or the starch framework is digested during the bake and the crumb goes gummy and unsliceable. This is structural, not a flavour preference. A rye at falling number ~120 needed 5% acidifier — a LOW falling number needs MORE acid, not less.',
      caveat:'Ginsberg: put at least 30% of the total flour through the rye sour. [PRAC]'});
  }
  if(p.spelt>0){
    out.push({grain:'Spelt',pct:p.spelt,ceiling:null,cite:'geisslitz',
      text:'No published maximum. Spelt has MORE gluten than common wheat (111.6 vs 80.4 mg/g), not less — it is weaker, not scarcer. Its gliadin:glutenin ratio of 3.3 sits closest to common wheat of the ancient species. Underdevelop it and watch for sudden slackening; the numeric rheology tables for spelt are behind a paywall and were not retrieved.'});
  }
  if(p.einkorn>0){
    out.push({grain:'Einkorn',pct:p.einkorn,ceiling:null,cite:'brandolini',warn:'soft',
      text:'Takes about 6 points LESS water (52.6% vs 58.8% on the same instrument) and ferments faster — dough development 120.8 min against 175.0 for the control, gas retention 99.1% vs 88.7%. Shorten the bulk. No published substitution ceiling.'});
  }
  if(p.kernza>0){
    out.push({grain:'Kernza',pct:p.kernza,ceiling:15,cite:'cetiner',warn:p.kernza>15?'hard':null,
      text:'Two sources that cannot be reconciled: Çetiner 2023 found a 45% ceiling with 15% optimal (loaf volume 485 mL at 15%, 420 at 30%, 380 at 45%, 360 with structural collapse at 60%, against a 445 mL control). AURI says 10–15% and flatbreads only. Both are reported; neither is averaged.'});
  }
  const sb=blend.find(b=>/salish/i.test(b.flour||''));
  if(sb&&+sb.pct>0){
    out.push({grain:'Salish Blue',pct:+sb.pct,ceiling:null,cite:'morgan23',warn:'soft',
      text:'There is no published baking dataset for Salish Blue. No protein, ash, falling number, farinograph absorption, alveograph W or loaf volume figure exists in any peer-reviewed source, WSU publication or variety release. The 8–9% protein number is a vendor product target, not a lab measurement. Its parentage is Triticum aestivum × Thinopyrum ponticum (tall wheatgrass) — NOT intermediate wheatgrass, so Kernza data do not transfer to it.',
      caveat:'What can honestly be inferred: a soft-white-equivalent flour at 8–9% protein used at high inclusion will dilute gluten and cut loaf volume — that is the direction the perennial-wheat data already shows (Murphy 2009 found reduced mix time and reduced loaf volume). Treat it as a flavour grain blended into a strong base and establish your own ceiling by test bake. The ladder below is mine, not data.',
      protocol:['Bake your usual formula at 0% Salish Blue and record crumb height, loaf volume by seed displacement, and how the dough felt at shaping.',
                'Repeat at 15%, changing NOTHING else. Same flour lot, same dough temperature, same % rise, same oven.',
                'Repeat at 30%. Then 45% if 30% still holds.',
                'Your ceiling is the step before the one where crumb height drops or the dough stops holding shape. Write it down — it is now the only Salish Blue data that exists for your kitchen.']});
  }
  if(p.unknown.length){
    out.push({grain:'No protein figure',pct:0,cite:'nodata',warn:'soft',
      text:'Nothing on file for: '+p.unknown.join(', ')+'. They are being treated as 11.5% protein, refined, roller-milled, which is a placeholder and not a measurement. Put the numbers off the bag into your flour list and the hydration prediction becomes real.'});
  }
  return out;
}
