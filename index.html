<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen</title>
<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#232019; --line:#332e26;
  --ink:#f2ece2; --ink2:#b8ae9e; --ink3:#7d7466;
  --hot:#e0703a; --hot2:#f0a06a; --ok:#7fa86a; --warn:#d9a441; --bad:#c05646;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--hot2)}
h1,h2,h3,h4{margin:0 0 .4em;font-weight:600;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:17px}
h3{font-size:15px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.right{margin-left:auto}
.hide{display:none !important}

/* shell */
header{
  position:sticky;top:0;z-index:20;background:rgba(18,16,14,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand span{color:var(--hot)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--ink2);
  cursor:pointer;white-space:nowrap;font-size:14px
}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button.on{background:var(--hot);color:#1a1005;font-weight:600}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}

/* bits */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:12px}
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;cursor:pointer;color:var(--ink);white-space:nowrap
}
.btn:hover{border-color:#4a4236;background:#2b271f}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#1a1005;font-weight:600}
.btn.pri:hover{background:var(--hot2);border-color:var(--hot2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:#4a2e28}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%
}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--hot)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;
  font-size:13px;user-select:none
}
.chip:hover{border-color:#4a4236}
.chip.on{background:var(--hot);border-color:var(--hot);color:#1a1005;font-weight:600}
.chip.out{opacity:.4;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;background:#2a2419;border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;font-size:11.5px;color:var(--ink2);margin:0 4px 4px 0}
.bar{height:5px;background:#2a251d;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--hot)}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:#25331e;color:#a8d18d}
.pill.warn{background:#3a2f14;color:#e6c268}
.pill.bad{background:#3a201b;color:#e08b78}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv b{color:var(--ink2);font-weight:400}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:5px 0;border-bottom:1px solid #26221c}
ul.clean li:last-child{border-bottom:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.split{grid-template-columns:1fr}.hwrap{flex-wrap:wrap}}

/* status */
#status{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel2);
  border-top:1px solid var(--line);padding:7px 16px;font-size:13px;display:flex;gap:10px;align-items:center}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
#status.busy .dot{background:var(--warn)}
#status.good .dot{background:var(--ok)}
#status.err .dot{background:var(--bad)}
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:40;
  background:#2c2720;border:1px solid var(--line);border-radius:8px;padding:9px 16px;
  box-shadow:0 8px 24px #0008;opacity:0;transition:opacity .18s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-start;
  justify-content:center;padding:24px 12px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:min(860px,100%);padding:18px}

/* diff */
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;
  background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:320px}
.diff .del{color:#e08b78;background:#3a201b55;text-decoration:line-through}
.diff .add{color:#a8d18d;background:#25331e55}
.step-ref{color:var(--hot2);font-weight:600;cursor:help;border-bottom:1px dotted var(--hot2)}
.miss{color:var(--warn)}
.sub{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">Kitchen<span>.</span></div>
    <nav id="nav"></nav>
    <div class="right row">
      <button class="btn sm" id="btnSync">Sync</button>
      <button class="btn sm pri hide" id="btnSignin">Connect Drive</button>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="status"><span class="dot"></span><span id="statusText">Starting…</span>
  <span class="right dim tiny" id="statusMeta"></span></div>
<div id="toast"></div>
<div id="modalHost"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   Kitchen — local-first recipe system backed by Google Drive
   Everything lives as plain text .md files in your Drive folder.
   This app is just a lens on those files. Delete it and your data
   is still perfectly readable.
   ============================================================ */

const APP = {
  FOLDER: 'Recipes',            // top-level folder name in My Drive
  DINNER_HOUR: 18,              // used for thaw math
  VER: '1.0'
};

/* ---------- tiny store (degrades if storage is blocked) ---------- */
const LS = (()=>{
  let mem = {};
  let ok = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ ok=false; }
  return {
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ const s=JSON.stringify(v); try{ ok?localStorage.setItem(k,s):(mem[k]=s);}catch(e){mem[k]=s;} },
    del(k){ try{ ok?localStorage.removeItem(k):delete mem[k];}catch(e){} }
  };
})();

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==='class')n.className=a[k]; else if(k==='html')n.innerHTML=a[k];
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)n.setAttribute(k,a[k]); }
  kids.flat().forEach(c=>{ if(c==null||c===false)return; n.append(c.nodeType?c:document.createTextNode(c)); });
  return n;};
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'recipe';
const uniq = a=>[...new Set(a)];
const todayISO = ()=>fmtDate(new Date());
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim()); if(!m)return null;
  return new Date(+m[1],+m[2]-1,+m[3],12,0,0); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a,b){ return Math.round((parseDate(b)-parseDate(a))/864e5); }
function weekday(iso){ const d=parseDate(iso); return d?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]:''; }
function niceDate(iso){ const d=parseDate(iso); if(!d)return iso;
  return weekday(iso)+' '+(d.getMonth()+1)+'/'+d.getDate(); }
function niceTime(d){ let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
  const ap=h<12?'am':'pm'; h=h%12||12; return h+(m==='00'?'':':'+m)+ap; }

function toast(msg,ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),ms); }
function status(text,kind=''){ $('#statusText').textContent=text; $('#status').className=kind; }

/* ============================================================
   TEXT FORMAT — parsers and serializers
   These define the file format. Keep them tolerant: a human typing
   into Drive on a phone should never be able to "break" a file.
   ============================================================ */

/* split "## Section" blocks out of a markdown doc */
function sections(text){
  const out={_head:[]}; let cur='_head';
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m=/^##\s+(.+?)\s*$/.exec(line);
    if(m){ cur=m[1].trim().toLowerCase(); out[cur]=out[cur]||[]; }
    else (out[cur]=out[cur]||[]).push(line);
  });
  return out;
}
/* bullet lines only, comments and prose stripped */
function bullets(lines){
  return (lines||[]).map(l=>l.trim())
    .filter(l=>/^[-*]\s+/.test(l))
    .map(l=>l.replace(/^[-*]\s+/,'').trim())
    .filter(l=>l && l!=='-');
}

/* ---------- units & ingredient normalisation ---------- */
const UNIT_CANON={
  teaspoon:'tsp',teaspoons:'tsp',tsp:'tsp',tsps:'tsp',
  tablespoon:'tbsp',tablespoons:'tbsp',tbsp:'tbsp',tbsps:'tbsp',tbs:'tbsp',
  cup:'cup',cups:'cup',c:'cup',
  ounce:'oz',ounces:'oz',oz:'oz',
  pound:'lb',pounds:'lb',lb:'lb',lbs:'lb',
  gram:'g',grams:'g',g:'g',kilogram:'kg',kilograms:'kg',kg:'kg',
  milliliter:'ml',milliliters:'ml',ml:'ml',liter:'l',liters:'l',l:'l',
  clove:'clove',cloves:'clove',can:'can',cans:'can',pinch:'pinch',pinches:'pinch',
  bunch:'bunch',bunches:'bunch',slice:'slice',slices:'slice',stick:'stick',sticks:'stick',
  quart:'qt',quarts:'qt',qt:'qt',pint:'pint',pints:'pint',head:'head',heads:'head',
  sprig:'sprig',sprigs:'sprig',piece:'piece',pieces:'piece',handful:'handful',
  dash:'dash',dashes:'dash',package:'pkg',packages:'pkg',pkg:'pkg',package_:'pkg'
};
const VULGAR={'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
function deVulgar(s){ return String(s).replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g,c=>' '+VULGAR[c]).replace(/\s+/g,' ').trim(); }

/* words that describe prep, not identity — dropped when matching */
const PREP=['fresh','freshly','chopped','finely','roughly','diced','minced','sliced','thinly','shredded',
 'grated','crushed','smashed','peeled','trimmed','rinsed','drained','packed','softened','melted','room',
 'temperature','large','small','medium','extra','ripe','optional','taste','cold','warm','hot','dry','dried?no',
 'boneless','bone-in','skin-on','skinless','whole','halved','quartered','cubed','julienned','beaten',
 'leftover','any','good','quality','plus','more','for','serving','garnish','divided','about','approximately'];
const SYN={
  'scallion':'green onion','scallions':'green onion','spring onion':'green onion',
  'coriander leaf':'cilantro','yellow onion':'onion','white onion':'onion','red onion':'onion',
  'all purpose flour':'flour','all-purpose flour':'flour','ap flour':'flour',
  'kosher salt':'salt','sea salt':'salt','table salt':'salt','flaky salt':'salt',
  'chicken thighs':'chicken thigh','chicken breasts':'chicken breast',
  'short rib':'short ribs','beef short rib':'short ribs','beef short ribs':'short ribs',
  'olive oil extra virgin':'olive oil','extra virgin olive oil':'olive oil',
  'garlic clove':'garlic','cloves garlic':'garlic','garlic cloves':'garlic',
  'chicken broth':'chicken stock','beef broth':'beef stock','vegetable broth':'vegetable stock',
  'tomatoes canned':'canned tomatoes','crushed tomatoes':'canned tomatoes','diced tomatoes':'canned tomatoes',
  'soy':'soy sauce','parmigiano reggiano':'parmesan','parmigiano':'parmesan'
};
function singular(w){
  if(/(ss|us|is)$/.test(w))return w;
  if(/ies$/.test(w))return w.slice(0,-3)+'y';
  if(/(ches|shes|xes|sses)$/.test(w))return w.slice(0,-2);
  if(/s$/.test(w)&&w.length>3)return w.slice(0,-1);
  return w;
}
/* the canonical key used for all matching */
function norm(s){
  let t=deVulgar(String(s||'')).toLowerCase();
  t=t.replace(/\([^)]*\)/g,' ');                       // drop parentheticals
  t=t.replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();
  if(SYN[t])t=SYN[t];
  let words=t.split(' ').filter(w=>w&&!PREP.includes(w));
  words=words.map(singular);
  t=words.join(' ').trim();
  if(SYN[t])t=SYN[t];
  return t;
}
/* words that make a different product, not just a described version of the same one.
   "green onion" is not "onion"; "sesame oil" is not "oil"; "chicken stock" is not "stock". */
const DISTINCT=new Set(['green','spring','sesame','olive','avocado','coconut','almond','soy','fish',
 'oyster','hoisin','tomato','chili','chilli','brown','powdered','confectioners','heavy','sour','rice',
 'apple','balsamic','red','white','peanut','sunflower','canola','vegetable','chicken','beef','pork',
 'lamb','wine','smoked','sweet','condensed','evaporated','buttermilk','almond','oat','goat','blue',
 'cream','corn','potato','sweet','bread','pastry','puff','self-raising','baking']);
/* do two ingredient names refer to the same thing? */
function sameThing(a,b){
  const x=norm(a),y=norm(b);
  if(!x||!y)return false;
  if(x===y)return true;
  const xs=x.split(' '),ys=y.split(' ');
  const [shortS,longS]=xs.length<=ys.length?[xs,ys]:[ys,xs];
  if(!longS.join(' ').includes(shortS.join(' ')))return false;
  if(shortS[shortS.length-1]!==longS[longS.length-1])return false;   // must share the head noun
  const extra=longS.filter(w=>!shortS.includes(w));
  if(extra.some(w=>DISTINCT.has(w)))return false;                    // "green" onion / "sesame" oil
  return true;
}

const QTY=/^\s*((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d+(?:\.\d+)?)(?:\s*[-–]\s*\d+(?:\.\d+)?)?)\s*/;
function parseIngredient(raw){
  const line=deVulgar(raw).trim();
  let rest=line, qty=null, unit=null;
  const m=QTY.exec(rest);
  if(m){ qty=m[1].trim(); rest=rest.slice(m[0].length); }
  const um=/^([a-zA-Z]+)\.?\s+/.exec(rest);
  if(um && UNIT_CANON[um[1].toLowerCase()]){ unit=UNIT_CANON[um[1].toLowerCase()]; rest=rest.slice(um[0].length); }
  rest=rest.replace(/^of\s+/i,'');                       // "3 cloves of garlic"
  let note=null;
  const ci=rest.indexOf(',');
  if(ci>0){ note=rest.slice(ci+1).trim(); rest=rest.slice(0,ci); }
  const item=rest.trim().replace(/\s+/g,' ');
  return {raw:line,qty,unit,item,note,key:norm(item)};
}
const PLURAL_UNITS=new Set(['cup','clove','slice','stick','can','sprig','piece','bunch','head','pinch','dash','pkg','pint','handful']);
function ingLine(i){
  let u=i.unit;
  if(u && PLURAL_UNITS.has(u)){ const n=fracToNum(i.qty); if(n&&n>1)u=u+'s'; }
  return [i.qty,u,i.item].filter(Boolean).join(' ') + (i.note?', '+i.note:'');
}

/* ---------- recipe file <-> object ---------- */
const META_KEYS=['tags','serves','time','active','source','status','rating','added','lastmade','times'];
function parseRecipe(text,file){
  const lines=String(text||'').split(/\r?\n/);
  let name='Untitled';
  const ti=lines.findIndex(l=>/^#\s+/.test(l));
  if(ti>=0) name=lines[ti].replace(/^#\s+/,'').trim();
  const S=sections(text);
  const meta={};
  (S._head||[]).forEach(l=>{
    const m=/^([A-Za-z ]+):\s*(.*)$/.exec(l.trim());
    if(m && META_KEYS.includes(m[1].trim().toLowerCase())) meta[m[1].trim().toLowerCase()]=m[2].trim();
  });
  const tags=(meta.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  const ingredients=bullets(S['ingredients']).map(parseIngredient);
  const steps=(S['steps']||[]).map(l=>l.trim())
      .filter(l=>/^(\d+[.)]\s+|[-*]\s+)/.test(l))
      .map(l=>l.replace(/^(\d+[.)]\s+|[-*]\s+)/,'').trim())
      .filter(Boolean);
  const notes=(S['notes']||[]).join('\n').trim();
  return {
    fileId:file&&file.id, fileName:file&&file.name, modifiedTime:file&&file.modifiedTime,
    name, meta, tags, ingredients, steps, notes, raw:text,
    slug:file&&file.name?file.name.replace(/\.md$/,''):slug(name)
  };
}
function serializeRecipe(r){
  const out=['# '+r.name,''];
  const meta=Object.assign({},r.meta);
  if(r.tags&&r.tags.length)meta.tags=r.tags.join(', ');
  META_KEYS.forEach(k=>{ if(meta[k]!=null&&meta[k]!=='') out.push(k+': '+meta[k]); });
  out.push('','## Ingredients');
  r.ingredients.forEach(i=>out.push('- '+(i.raw&&!i.dirty?i.raw:ingLine(i))));
  out.push('','## Steps');
  r.steps.forEach((s,n)=>out.push((n+1)+'. '+s));
  if(r.notes&&r.notes.trim()){ out.push('','## Notes',r.notes.trim()); }
  return out.join('\n')+'\n';
}

/* ---------- house rules ---------- */
function parseRules(text){
  const S=sections(text);
  const swap=bullets(S['swap']).map(l=>{
    const p=l.split(/\s*->\s*/); return p.length>1?{from:p[0].trim(),to:p.slice(1).join('->').trim()}:null;
  }).filter(Boolean);
  const always=bullets(S['always']).map(l=>{
    const m=/^when\s+(.+?)\s*->\s*(.+)$/i.exec(l);
    return m?{trigger:m[1].trim(),do:m[2].trim()}:{trigger:'',do:l};
  });
  const thaw={};
  bullets(S['thaw']).forEach(l=>{ const m=/^(.+?):\s*([\d.]+)/.exec(l); if(m)thaw[norm(m[1])]=parseFloat(m[2]); });
  const portions={};
  bullets(S['portions']).forEach(l=>{ const m=/^(.+?):\s*(.+)$/.exec(l); if(m)portions[m[1].trim().toLowerCase()]=m[2].trim(); });
  return {
    never:bullets(S['never']), swap, always,
    prefer:bullets(S['prefer']), thaw, portions,
    raw:text
  };
}

/* ---------- pantry ---------- */
function parsePantry(text){
  const S=sections(text);
  const groups=[];
  Object.keys(S).forEach(k=>{
    if(k==='_head')return;
    const items=bullets(S[k]).map(l=>{
      const out=/^!\s*/.test(l);
      return {name:l.replace(/^!\s*/,'').trim(), out, key:norm(l.replace(/^!\s*/,''))};
    }).filter(i=>i.name);
    if(items.length)groups.push({name:k,items});
  });
  return {groups,raw:text};
}
function pantryAll(p){ return p.groups.flatMap(g=>g.items.map(i=>Object.assign({group:g.name},i))); }
function pantryHave(p){ return pantryAll(p).filter(i=>!i.out); }
function serializePantry(p){
  const out=['# Pantry',''];
  out.push('Put a `!` at the front of a line when we are OUT of it.','');
  p.groups.forEach(g=>{
    out.push('## '+g.name.replace(/\b\w/g,c=>c.toUpperCase()));
    g.items.forEach(i=>out.push('- '+(i.out?'! ':'')+i.name));
    out.push('');
  });
  return out.join('\n');
}

/* ---------- steps library ---------- */
function parseSteps(text){
  const map={}; let cur=null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const h=/^###\s+(.+?)\s*$/.exec(line);
    if(h){ cur=h[1].trim(); map[cur]={name:cur,text:'',matches:[]}; return; }
    if(!cur)return;
    const m=/^match:\s*(.+)$/i.exec(line.trim());
    if(m){ map[cur].matches.push(m[1].trim().toLowerCase()); return; }
    if(/^#/.test(line))return;
    map[cur].text+=(map[cur].text?'\n':'')+line;
  });
  Object.values(map).forEach(s=>s.text=s.text.trim());
  return {map,raw:text};
}
function serializeSteps(lib){
  const out=['# Steps Library',''];
  Object.values(lib.map).forEach(s=>{
    out.push('### '+s.name, s.text);
    s.matches.forEach(m=>out.push('match: '+m));
    out.push('');
  });
  return out.join('\n');
}

/* ---------- meal plan ---------- */
function parsePlan(text){
  const S=sections(text);
  const away=bullets(S['away']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s*(?:to|-|–)\s*(\d{4}-\d{2}-\d{2})\s*(.*)$/.exec(l);
    return m?{from:m[1],to:m[2],label:m[3].trim()}:null;
  }).filter(Boolean);
  const skip=bullets(S['skip']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s+(\w+)\s*(.*)$/.exec(l);
    return m?{date:m[1],meal:m[2].toLowerCase(),reason:m[3].trim()}:null;
  }).filter(Boolean);
  const plan=bullets(S['plan']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s+(\w+)\s*:\s*(.*)$/.exec(l);
    return m?{date:m[1],meal:m[2].toLowerCase(),recipe:m[3].trim()}:null;
  }).filter(Boolean);
  return {away,skip,plan,raw:text};
}
function serializePlan(p,thaws){
  const out=['# Meal Plan','','## Away','Written as:  YYYY-MM-DD to YYYY-MM-DD  label',''];
  p.away.forEach(a=>out.push(`- ${a.from} to ${a.to}  ${a.label||''}`.trimEnd()));
  out.push('','## Skip','Written as:  YYYY-MM-DD meal  reason','');
  p.skip.forEach(s=>out.push(`- ${s.date} ${s.meal}  ${s.reason||''}`.trimEnd()));
  out.push('','## Plan','Written as:  YYYY-MM-DD meal: recipe name','');
  p.plan.slice().sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(s=>out.push(`- ${s.date} ${s.meal}: ${s.recipe}`));
  out.push('','## Thaw','Auto-generated from the plan.','');
  (thaws||[]).forEach(t=>out.push(`- ${t.when}  pull ${t.item} out for ${t.date} ${t.meal}`));
  return out.join('\n')+'\n';
}

/* ---------- grocery ---------- */
function parseGrocery(text){
  const S=sections(text);
  return {need:bullets(S['need']),manual:bullets(S['manual']),got:bullets(S['got']),raw:text};
}
function serializeGrocery(g){
  const out=['# Grocery List','','## Need',''];
  g.need.forEach(i=>out.push('- '+i));
  out.push('','## Manual','Things you add yourself. The app never touches this section.','');
  g.manual.forEach(i=>out.push('- '+i));
  out.push('','## Got','');
  g.got.forEach(i=>out.push('- '+i));
  return out.join('\n')+'\n';
}

const Drive = {
  token:null, tokenExp:0, client:null, ready:false,

  clientId(){ return LS.get('clientId','') || ''; },

  init(){
    const cid=this.clientId();
    if(!cid || !window.google || !google.accounts) return false;
    this.client = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive',
      callback: (resp)=>{
        if(resp && resp.access_token){
          Drive.token=resp.access_token;
          Drive.tokenExp=Date.now()+((resp.expires_in||3600)-120)*1000;
          LS.set('tok',{t:Drive.token,e:Drive.tokenExp});
          if(Drive._resolve){ Drive._resolve(resp.access_token); Drive._resolve=null; }
        }else if(Drive._reject){ Drive._reject(new Error('No token returned')); Drive._reject=null; }
      },
      error_callback: (e)=>{ if(Drive._reject){ Drive._reject(new Error(e&&e.type||'auth failed')); Drive._reject=null; } }
    });
    const cached=LS.get('tok',null);
    if(cached && cached.e>Date.now()){ this.token=cached.t; this.tokenExp=cached.e; }
    this.ready=true;
    return true;
  },

  signedIn(){ return !!this.token && this.tokenExp>Date.now(); },

  auth(interactive){
    if(this.signedIn()) return Promise.resolve(this.token);
    if(!this.client && !this.init()) return Promise.reject(new Error('Google sign-in not configured'));
    return new Promise((res,rej)=>{
      this._resolve=res; this._reject=rej;
      try{ this.client.requestAccessToken({prompt: interactive?'consent':''}); }
      catch(e){ rej(e); }
    });
  },

  async req(url,opts={}){
    const tok=await this.auth(false);
    const o=Object.assign({},opts);
    o.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
    let r=await fetch(url,o);
    if(r.status===401){
      this.token=null; LS.del('tok');
      const t2=await this.auth(true);
      o.headers.Authorization='Bearer '+t2;
      r=await fetch(url,o);
    }
    if(!r.ok){ const t=await r.text(); throw new Error('Drive '+r.status+': '+t.slice(0,300)); }
    return r;
  },

  async list(q,fields='files(id,name,mimeType,modifiedTime,size)'){
    const url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)
      +'&fields='+encodeURIComponent('nextPageToken,'+fields)+'&pageSize=200&orderBy=name';
    const r=await this.req(url); const j=await r.json(); return j.files||[];
  },

  async findFolder(name,parent){
    const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`
      + (parent?` and '${parent}' in parents`:'');
    const f=await this.list(q); return f[0]||null;
  },

  async makeFolder(name,parent){
    const r=await this.req('https://www.googleapis.com/drive/v3/files',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})
    });
    return r.json();
  },

  async ensureFolder(name,parent){
    return (await this.findFolder(name,parent)) || (await this.makeFolder(name,parent));
  },

  async readText(file){
    if(file.mimeType==='application/vnd.google-apps.document'){
      const r=await this.req(`https://www.googleapis.com/drive/v3/files/${file.id}/export?mimeType=text/plain`);
      return r.text();
    }
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
    return r.text();
  },

  async create(name,parent,text,mime='text/markdown'){
    const b='-----kitchen'+Math.random().toString(36).slice(2);
    const meta={name,parents:parent?[parent]:undefined};
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`
      +JSON.stringify(meta)+`\r\n--${b}\r\nContent-Type: ${mime}; charset=UTF-8\r\n\r\n`+text+`\r\n--${b}--`;
    const r=await this.req('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',
      {method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    return r.json();
  },

  async write(fileId,text,mime='text/markdown'){
    const r=await this.req(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,modifiedTime`,
      {method:'PATCH',headers:{'Content-Type':mime+'; charset=UTF-8'},body:text});
    return r.json();
  },

  async meta(fileId){
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,modifiedTime`);
    return r.json();
  },

  async move(fileId,addParent,removeParent){
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${addParent}&removeParents=${removeParent}&fields=id,parents`,
      {method:'PATCH'});
    return r.json();
  },

  async trash(fileId){
    return this.req(`https://www.googleapis.com/drive/v3/files/${fileId}`,
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});
  }
};

/* cache so the app opens instantly and works offline (read-only) */
function saveCache(){
  LS.set('cache',{
    at:Date.now(), ids:S.ids,
    files:Object.fromEntries(Object.entries(S.files).map(([k,v])=>[k,{id:v.id,modifiedTime:v.modifiedTime}])),

    },
    recipes:S.recipes.map(r=>({fileId:r.fileId,fileName:r.fileName,modifiedTime:r.modifiedTime,raw:r.raw}))
  });

function loadCache(){
  const c=LS.get('cache',null); if(!c)return false;

async function syncAll(){
  if(!Drive.clientId()){ status('Not configured — open Settings','err'); return false; }
  status('Syncing with Drive…','busy');
  try{
    await Drive.auth(false);
    S.ids.root=(await Drive.ensureFolder(LS.get('folderName',APP.FOLDER),null)).id;
    S.ids.library=(await Drive.ensureFolder('library',S.ids.root)).id;
    S.ids.inbox=(await Drive.ensureFolder('_inbox',S.ids.root)).id;
    S.ids.done=(await Drive.ensureFolder('done',S.ids.inbox)).id;

    const rootFiles=await Drive.list(`'${S.ids.root}' in parents and trashed=false`);
    for(const [name,apply] of CONFIG_FILES){
      let f=rootFiles.find(x=>x.name===name);
      if(!f) f=await Drive.create(name,S.ids.root,SEED[name]);
      S.files[name]=f;
      apply(await Drive.readText(f));
    }
    const libFiles=(await Drive.list(`'${S.ids.library}' in parents and trashed=false`))
      .filter(f=>/\.(md|txt)$/i.test(f.name));
    const recipes=[];
    for(const f of libFiles){ recipes.push(parseRecipe(await Drive.readText(f),f)); }
    S.recipes=recipes;

    S.inbox=(await Drive.list(`'${S.ids.inbox}' in parents and trashed=false`))
      .filter(f=>f.mimeType!=='application/vnd.google-apps.folder');

    S.loadedAt=Date.now(); S.offline=false;
    saveCache();
    status(`${S.recipes.length} recipes · synced ${niceTime(new Date())}`,'good');
    $('#statusMeta').textContent=S.inbox.length?`${S.inbox.length} in inbox`:'';
    return true;
  }catch(e){
    console.error(e);
    S.offline=true;
    status('Offline — showing last synced copy. '+(e.message||''),'err');
    return false;
  }
}

async function saveFile(name,text){
  const f=S.files[name];
  if(!f) throw new Error('Unknown file '+name);
  const m=await Drive.meta(f.id);
  if(f.modifiedTime && m.modifiedTime!==f.modifiedTime){
    const go=confirm(`${name} was changed in Drive since this app loaded it (probably the other computer).\n\nOK = overwrite with what's on this screen.\nCancel = stop, hit Sync, and redo your change.`);
    if(!go) throw new Error('save cancelled');
  }
  const res=await Drive.write(f.id,text);
  S.files[name]=Object.assign({},f,{modifiedTime:res.modifiedTime});
  saveCache();
  return res;
}
async function saveRecipe(r){
  const text=typeof r==='string'?r:serializeRecipe(r);
  if(r.fileId){
    const res=await Drive.write(r.fileId,text);
    r.modifiedTime=res.modifiedTime; r.raw=text;
  }else{
    const name=(r.slug||slug(r.name))+'.md';

/* ---------- what can we cook ---------- */
function haveKeys(extra){
  const keys=pantryHave(S.pantry).map(i=>i.key);
  return uniq(keys.concat(extra||[]));
}
function findSub(missingItem){
  // house rule says "their thing -> our thing"; if we have our thing, suggest it
  const have=pantryHave(S.pantry);
  for(const sw of S.rules.swap){
    if(sameThing(sw.from,missingItem)){
      const target=sw.to.split(',')[0];
      if(have.some(h=>sameThing(h.name,target))) return {to:sw.to,dir:'rule'};
    }
    if(sameThing(sw.to,missingItem) && have.some(h=>sameThing(h.name,sw.from))) return {to:sw.from,dir:'reverse'};
  }
  return null;
}
function scoreRecipe(r,selected,have){
  const hv=have||haveKeys();
  const sel=(selected||[]).map(norm).filter(Boolean);
  let matched=0,usedSel=0;
  const missing=[];
  r.ingredients.forEach(i=>{
    if(!i.key)return;
    const inSel=sel.some(s=>sameThing(s,i.item));
    const inPantry=hv.some(k=>sameThing(k,i.item));
    if(inSel)usedSel++;
    if(inSel||inPantry)matched++;
    else missing.push(i);
  });
  const total=r.ingredients.filter(i=>i.key).length||1;
  const selHits=sel.filter(s=>r.ingredients.some(i=>sameThing(s,i.item))).length;
  const coverage=matched/total;
  const rating=parseFloat(r.meta.rating||0)||0;
  const never=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
  const subs=missing.map(m=>({ing:m,sub:findSub(m.item)}));
  const shoppable=subs.filter(s=>!s.sub).length;
  let score = coverage*100 + selHits*40 - shoppable*7 + rating*2;
  if(sel.length && selHits<sel.length) score -= (sel.length-selHits)*35;
  return {recipe:r,coverage,matched,total,missing,subs,selHits,never,score};
}
function rankRecipes(selected,opts={}){
  const have=haveKeys();
  let list=S.recipes.map(r=>scoreRecipe(r,selected,have));
  if(opts.tag) list=list.filter(x=>x.recipe.tags.some(t=>t.toLowerCase().includes(opts.tag.toLowerCase())));
  if(opts.q){ const q=opts.q.toLowerCase();
    list=list.filter(x=>x.recipe.name.toLowerCase().includes(q)
      ||x.recipe.tags.join(' ').toLowerCase().includes(q)
      ||x.recipe.ingredients.some(i=>i.item.toLowerCase().includes(q))); }
  if(opts.maxMissing!=null) list=list.filter(x=>x.missing.filter(m=>!findSub(m.item)).length<=opts.maxMissing);
  list.sort((a,b)=>b.score-a.score);
  return list;
}

/* ---------- planner ---------- */
function isAway(iso){ return S.plan.away.some(a=>iso>=a.from&&iso<=a.to); }
function nextTrip(fromISO){
  const t=S.plan.away.filter(a=>a.from>=fromISO).sort((a,b)=>a.from.localeCompare(b.from));
  return t[0]||null;
}
function isSkipped(iso,meal){ return S.plan.skip.some(s=>s.date===iso&&s.meal===meal); }
function skipReason(iso,meal){ const s=S.plan.skip.find(s=>s.date===iso&&s.meal===meal); return s?s.reason:''; }
function recipeByName(name){
  if(!name)return null;
  const n=name.toLowerCase().trim();
  return S.recipes.find(r=>r.name.toLowerCase()===n)
      || S.recipes.find(r=>r.name.toLowerCase().includes(n)||n.includes(r.name.toLowerCase()))
      || null;
}
function perishScore(r){
  // how much of this recipe leans on stuff that goes bad — used to burn down the fridge before a trip
  const fridge=S.pantry.groups.filter(g=>/fridge|produce|veg/.test(g.name)).flatMap(g=>g.items);
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  let s=0;
  r.ingredients.forEach(i=>{
    if(fridge.some(f=>sameThing(f.name,i.item)))s+=2;
    if(freezer.some(f=>sameThing(f.name,i.item)))s+=1;
  });
  if(r.tags.some(t=>/use it up|flexible|clean/i.test(t)))s+=4;
  return s;
}
function buildPlan(startISO,days,opts={}){
  const out=[];
  const used=new Set();
  const trip=nextTrip(startISO);
  const have=haveKeys();
  for(let d=0;d<days;d++){
    const iso=fmtDate(addDays(parseDate(startISO),d));
    if(isAway(iso)){ out.push({date:iso,meal:'dinner',away:true,
      reason:(S.plan.away.find(a=>iso>=a.from&&iso<=a.to)||{}).label||'away'}); continue; }
    if(isSkipped(iso,'dinner')){ out.push({date:iso,meal:'dinner',skip:true,reason:skipReason(iso,'dinner')}); continue; }
    const existing=S.plan.plan.find(p=>p.date===iso&&p.meal==='dinner');
    if(existing && !opts.replace){
      out.push({date:iso,meal:'dinner',recipe:recipeByName(existing.recipe),name:existing.recipe,pinned:true});
      used.add((recipeByName(existing.recipe)||{}).fileId); continue;
    }
    const daysToTrip = trip?dayDiff(iso,trip.from):999;
    let pool=S.recipes.filter(r=>!used.has(r.fileId));
    if(!pool.length){ used.clear(); pool=S.recipes.slice(); }   // small library — start the rotation over
    const cands=pool.map(r=>{
      const sc=scoreRecipe(r,[],have);
      let s=sc.score;
      if(daysToTrip<=2 && daysToTrip>=0){ s+=perishScore(r)*6; s-=sc.missing.length*10; }   // burn the fridge down, buy nothing
      else if(daysToTrip<=4) s+=perishScore(r)*2;
      s+=Math.random()*3;                                            // a little shuffle so it isn't the same week forever
      return {r,s,sc,daysToTrip};
    }).sort((a,b)=>b.s-a.s);
    const pick=cands[0];
    out.push({date:iso,meal:'dinner',recipe:pick?pick.r:null,name:pick?pick.r.name:'',
      score:pick?pick.sc:null,
      reason: daysToTrip<=2&&daysToTrip>=0 ? `${daysToTrip===0?'leaving today':'before '+(trip.label||'the trip')} — uses what's here`:''});
    if(pick)used.add(pick.r.fileId);
  }
  return out;
}
function thawFor(planRows){
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  const out=[];
  planRows.forEach(row=>{
    if(!row.recipe)return;
    row.recipe.ingredients.forEach(i=>{
      const hit=freezer.find(f=>sameThing(f.name,i.item));
      if(!hit)return;
      let hours=null;
      Object.keys(S.rules.thaw).forEach(k=>{ if(sameThing(k,i.item)&&(hours==null||S.rules.thaw[k]>hours))hours=S.rules.thaw[k]; });
      if(hours==null)hours=12;
      const dinner=parseDate(row.date); dinner.setHours(APP.DINNER_HOUR,0,0,0);
      const when=new Date(dinner.getTime()-hours*3600e3);
      out.push({item:hit.name,recipeItem:i.item,date:row.date,meal:row.meal,hours,late:when<new Date(),
        when:fmtDate(when)+' '+String(when.getHours()).padStart(2,'0')+':00',
        whenD:when,recipe:row.recipe.name});
    });
  });
  out.sort((a,b)=>a.whenD-b.whenD);
  return out;
}

/* ---------- grocery ---------- */
function buildGrocery(planRows){
  const have=pantryHave(S.pantry);
  const bucket=new Map();
  planRows.forEach(row=>{
    if(!row.recipe)return;
    row.recipe.ingredients.forEach(i=>{
      if(!i.key)return;
      if(have.some(h=>sameThing(h.name,i.item)))return;
      const k=i.key;
      if(!bucket.has(k))bucket.set(k,{item:i.item,parts:[],forr:new Set()});
      const b=bucket.get(k);
      b.parts.push({qty:i.qty,unit:i.unit});
      b.forr.add(row.recipe.name);
    });
  });
  const list=[...bucket.values()].map(b=>{
    const byUnit={};
    let unparsed=false;
    b.parts.forEach(p=>{
      if(!p.qty){unparsed=true;return;}
      const n=fracToNum(p.qty); if(n==null){unparsed=true;return;}
      const u=p.unit||'';
      byUnit[u]=(byUnit[u]||0)+n;
    });
    const amt=Object.keys(byUnit).map(u=>trimNum(byUnit[u])+(u?' '+u:'')).join(' + ');
    return {text:(amt?amt+' ':'')+b.item, item:b.item, forr:[...b.forr]};
  });
  const outOf=pantryAll(S.pantry).filter(i=>i.out).map(i=>({text:i.name,item:i.name,forr:['out of it']}));
  return list.concat(outOf);
}
function fracToNum(q){
  const s=String(q).trim();
  let m=/^(\d+)\s+(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]+ +m[2]/+m[3];
  m=/^(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]/+m[2];
  m=/^(\d+(?:\.\d+)?)/.exec(s); if(m)return +m[1];
  return null;
}
function trimNum(n){ return Math.round(n*100)/100; }

/* ============================================================
   REFACTOR — the part that makes somebody else's recipe into ours
   ============================================================ */
const PASSES=[
  {id:'units', name:'Tidy units', desc:'½ becomes 1/2, "tablespoons" becomes tbsp, spacing cleaned up.'},
  {id:'swap',  name:'House swaps', desc:'Applies the Swap list in house-rules.md — shallot becomes yellow onion, and so on.'},
  {id:'steps', name:'Link step library', desc:'Recognises steps you already have a house method for and replaces them with @references, so fixing the method once fixes every recipe.'},
  {id:'always',name:'House technique', desc:'Adds the Always rules that apply to this recipe (salt the beef ahead, sear before braising…).'},
  {id:'never', name:'Flag no-go ingredients', desc:'Marks anything on the Never list and removes it when it is only a garnish.'},
  {id:'tags',  name:'Auto-tag', desc:'Adds protein / method / speed tags so the matcher and planner can find it.'},
  {id:'meta',  name:'Fill in the blanks', desc:'Default serves, added date, status.'}
];
function enabledPasses(){ return LS.get('passes',PASSES.map(p=>p.id)); }

function refactor(rec,passIds){
  const on=new Set(passIds||enabledPasses());
  const r=JSON.parse(JSON.stringify(rec));
  const changes=[];
  const push=(pass,before,after,why)=>{ if(before!==after)changes.push({pass,before,after,why}); };

  if(on.has('units')){
    r.ingredients.forEach((i,n)=>{
      const before=i.raw||ingLine(i);
      const p=parseIngredient(before);
      const after=ingLine(p);
      if(before!==after){ Object.assign(i,p,{raw:after,dirty:true}); push('units',before,after,'unit spelling / fractions'); }
    });
    r.steps.forEach((s,n)=>{ const a=deVulgar(s).replace(/\s+/g,' ').trim();
      if(a!==s){ push('units',s,a,'fractions'); r.steps[n]=a; } });
  }

  if(on.has('swap')){
    S.rules.swap.forEach(sw=>{
      const target=sw.to.split(',')[0].trim();
      r.ingredients.forEach(i=>{
        // already the house version — don't swap it twice and re-append the note
        if(norm(i.item)===norm(target) && norm(i.item)!==norm(sw.from))return;
        if(sameThing(i.item,sw.from)){
          const before=ingLine(i);
          const parts=sw.to.split(',');
          i.item=parts[0].trim();
          if(parts.length>1) i.note=[i.note,parts.slice(1).join(',').trim()].filter(Boolean).join(', ');
          i.key=norm(i.item); i.dirty=true; i.raw=ingLine(i);
          push('swap',before,i.raw,'house rule: '+sw.from+' -> '+sw.to);
        }
      });
      r.steps.forEach((s,n)=>{
        const re=new RegExp('\\b'+sw.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','ig');
        if(re.test(s)){ const a=s.replace(re,target);
          push('swap',s,a,'house rule in step text'); r.steps[n]=a; }
      });
    });
  }

  if(on.has('steps')){
    const lib=Object.values(S.steps.map);
    r.steps.forEach((s,n)=>{
      if(/^@/.test(s.trim()))return;
      const low=s.toLowerCase();
      const hit=lib.find(L=>L.matches.some(m=>m&&low.includes(m)));
      if(hit){ const a='@'+hit.name; push('steps',s,a,'we already have a house method for this'); r.steps[n]=a; }
    });
  }

  if(on.has('always')){
    const hay=(r.name+' '+r.tags.join(' ')+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    S.rules.always.forEach(a=>{
      if(!a.trigger)return;
      if(!hay.includes(a.trigger.toLowerCase()))return;
      const already=r.steps.some(s=>s.toLowerCase().includes(a.do.toLowerCase().slice(0,18)))
        || (r.notes||'').toLowerCase().includes(a.do.toLowerCase().slice(0,18));
      if(already)return;
      r.steps.unshift(a.do.charAt(0).toUpperCase()+a.do.slice(1)+'.');
      changes.push({pass:'always',before:'(nothing)',after:a.do,why:'house rule for '+a.trigger});
    });
  }

  if(on.has('never')){
    S.rules.never.forEach(n=>{
      const idx=r.ingredients.findIndex(i=>sameThing(i.item,n));
      if(idx<0)return;
      const line=ingLine(r.ingredients[idx]);
      const garnish=/garnish|to serve|topping|for serving/i.test(line+' '+(r.ingredients[idx].note||''));
      if(garnish){ r.ingredients.splice(idx,1); changes.push({pass:'never',before:line,after:'(removed)',why:n+' is on the Never list and was only a garnish'}); }
      else changes.push({pass:'never',before:line,after:line+'   <-- FLAG',why:n+' is on the Never list — decide what to do'});
    });
  }

  if(on.has('tags')){
    const hay=(r.name+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    const add=[];
    const PROTEIN={beef:['beef','short rib','steak','chuck','brisket','ground beef'],chicken:['chicken'],
      pork:['pork','bacon','sausage','ham'],fish:['salmon','cod','fish','halibut','tuna'],
      shrimp:['shrimp','prawn'],egg:['egg'],tofu:['tofu'],lamb:['lamb'],vegetarian:[]};
    Object.keys(PROTEIN).forEach(k=>{ if(PROTEIN[k].some(w=>hay.includes(w)))add.push(k); });
    const METHOD={braise:['braise','braised'],roast:['roast','oven'],grill:['grill'],fry:['fry','fried','wok'],
      soup:['soup','stew','broth'],'sheet pan':['sheet pan'],'slow':['slow cook','3 hour','4 hour'],'one pan':['one pan','same pan']};
    Object.keys(METHOD).forEach(k=>{ if(METHOD[k].some(w=>hay.includes(w)))add.push(k); });
    const t=(r.meta.time||'');
    const mins=(/(\d+)\s*h/.test(t)?parseInt(/(\d+)\s*h/.exec(t)[1])*60:0)+(/(\d+)\s*m/.test(t)?parseInt(/(\d+)\s*m/.exec(t)[1]):0);
    if(mins&&mins<=35)add.push('fast'); if(mins&&mins>=150)add.push('long');
    const before=r.tags.join(', ');
    r.tags=uniq(r.tags.concat(add.filter(x=>x)));
    push('tags',before,r.tags.join(', '),'derived from the ingredients and method');
  }

  if(on.has('meta')){
    if(!r.meta.serves){ r.meta.serves=(S.rules.portions.serves||'2'); changes.push({pass:'meta',before:'(no serves)',after:'serves: '+r.meta.serves,why:'house default'}); }
    if(!r.meta.added){ r.meta.added=todayISO(); changes.push({pass:'meta',before:'(no added date)',after:'added: '+r.meta.added,why:''}); }
    if(!r.meta.status){ r.meta.status='untested'; changes.push({pass:'meta',before:'(no status)',after:'status: untested',why:'mark it tested once it works'}); }
  }

  return {result:r,changes};
}

/* ---------- turn a pasted blob into a recipe ---------- */
const ING_HEAD=/^\s*#*\s*(ingredients|what you.ll need|shopping list)\s*:?\s*$/i;
const STEP_HEAD=/^\s*#*\s*(instructions|directions|steps|method|preparation|how to make.*)\s*:?\s*$/i;
const NOTE_HEAD=/^\s*#*\s*(notes?|tips?)\s*:?\s*$/i;
function looksIngredient(l){
  const s=l.trim();
  if(!s||s.length>90)return false;
  if(QTY.test(s))return true;
  const w=s.toLowerCase().split(/[\s,]+/);
  if(w.some(x=>UNIT_CANON[x]))return true;
  if(w.length<=5 && !/[.!?]$/.test(s) && !/^(then|next|add|heat|cook|stir|place|remove|serve|preheat)/i.test(s))return true;
  return false;
}
function captureParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  let name='', ing=[], steps=[], notes=[], mode='?';
  let firstReal=lines.findIndex(l=>l.trim());
  if(firstReal>=0) name=lines[firstReal].replace(/^#+\s*/,'').trim().slice(0,90);
  for(let n=(firstReal<0?0:firstReal+1);n<lines.length;n++){
    const l=lines[n], t=l.trim();
    if(!t)continue;
    if(ING_HEAD.test(t)){mode='i';continue;}
    if(STEP_HEAD.test(t)){mode='s';continue;}
    if(NOTE_HEAD.test(t)){mode='n';continue;}
    const clean=t.replace(/^([-*•▢]|\d+[.)])\s*/,'').trim();
    if(!clean)continue;
    if(mode==='i'){
      // "Kosher salt and freshly ground black pepper" is two ingredients, not one
      const sp=/^(.*\bsalt)\s+and\s+(.*\bpepper.*)$/i.exec(clean);
      if(sp){ ing.push(sp[1].trim()); ing.push(sp[2].trim()); } else ing.push(clean);
    }
    else if(mode==='s')steps.push(clean);
    else if(mode==='n')notes.push(clean);
    else { if(looksIngredient(clean))ing.push(clean); else steps.push(clean); }
  }
  // a pasted transcript often has no ingredient list at all — pull nouns out of the steps
  if(!ing.length && steps.length){
    const found=new Set();
    const vocab=uniq(pantryAll(S.pantry).map(i=>i.name)
      .concat(S.recipes.flatMap(r=>r.ingredients.map(i=>i.item))));
    vocab.forEach(v=>{ const re=new RegExp('\\b'+norm(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','i');
      if(re.test(steps.join(' ')))found.add(v); });
    ing=[...found];
  }
  const r={name:name||'Untitled',meta:{source:'pasted'},tags:[],
    ingredients:ing.map(parseIngredient),steps,notes:notes.join('\n'),raw:text};
  r.slug=slug(r.name);
  return r;
}

/* ---------- optional: let Claude do the adapting ---------- */
async function aiAdapt(rawText){
  const key=LS.get('anthropicKey','');
  if(!key) throw new Error('No API key set');
  const model=LS.get('anthropicModel','claude-sonnet-4-5');
  const stepNames=Object.keys(S.steps.map);
  const sys=`You convert recipes into one household's private recipe format. Output ONLY the markdown file, no preamble.

FORMAT (exactly this shape):
# Recipe Name

tags: comma, separated
serves: 2
time: 45m
source: where it came from
status: untested

## Ingredients
- 2 lb thing
- 1 tbsp other thing

## Steps
1. Step text.
2. @named-step

## Notes
Anything worth remembering.

RULES OF THIS HOUSE (apply them, do not just mention them):
${S.rules.raw}

STEP LIBRARY — if a step in the source recipe is one of these, replace the whole step with @name on its own line:
${stepNames.map(n=>'@'+n+' — '+(S.steps.map[n].text.split('\n')[0])).join('\n')}

WHAT THEY ALWAYS HAVE (do not add these to a shopping list, but do list them as ingredients):
${pantryHave(S.pantry).map(i=>i.name).join(', ')}

Rewrite quantities for the house serving size. Convert vague instructions into specific ones (temperatures, times, visual cues). Be concise and direct — these are notes for people who can cook, not a blog post.`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:3000,system:sys,
      messages:[{role:'user',content:'Convert this into our format:\n\n'+rawText.slice(0,20000)}]})
  });
  if(!r.ok) throw new Error('Claude API '+r.status+': '+(await r.text()).slice(0,200));
  const j=await r.json();
  let out=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
  out=out.replace(/^```(?:markdown|md)?\s*/,'').replace(/```\s*$/,'');
  return out;
}

async function adaptFlow(raw,opts={}){
  if(!raw||!raw.trim())return toast('Nothing to convert.');
  let rec;
  if(opts.ai){
    status('Asking Claude…','busy');
    try{
      const md=await aiAdapt(raw);
      rec=parseRecipe(md,null);
      rec.slug=slug(rec.name);
      status('','good');
    }catch(e){ toast('AI step failed: '+e.message+' — falling back to rules.'); status('','');
      rec=captureParse(raw); }
  } else rec=captureParse(raw);

  const {result,changes}=refactor(rec);
  showAdaptModal(result,changes,opts.source);
}

  wrap.append(h('div','card',

      el('span',{class:w.level==='bad'?'miss':'dim'},w.text))))));

function libraryWarnings(){
  const out=[];
  S.recipes.forEach(r=>{
    if(!r.ingredients.length)out.push({level:'bad',text:r.name+' — no ingredients section'});
    if(!r.steps.length)out.push({level:'bad',text:r.name+' — no steps'});
    if(!r.meta.serves)out.push({level:'warn',text:r.name+' — no serving size'});
    if(!r.tags.length)out.push({level:'warn',text:r.name+' — no tags, the planner will rarely pick it'});
    r.steps.forEach(s=>{ const m=/^@([a-z0-9-]+)/i.exec(s.trim());
      if(m&&!S.steps.map[m[1]])out.push({level:'bad',text:r.name+' — refers to @'+m[1]+' which is not in the step library'}); });
    const nv=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
    nv.forEach(n=>out.push({level:'bad',text:r.name+' — contains '+n+' (Never list)'}));
  });
  // repeated step text across recipes = candidate for the step library
  const counts={};
  S.recipes.forEach(r=>r.steps.forEach(s=>{ if(/^@/.test(s))return; const k=norm(s).slice(0,60);
    if(k.length<20)return; (counts[k]=counts[k]||{n:0,ex:s}).n++; }));
  Object.values(counts).filter(c=>c.n>=2).slice(0,6).forEach(c=>
    out.push({level:'warn',text:`"${c.ex.slice(0,60)}…" appears in ${c.n} recipes — worth naming in the step library`}));
  if(!out.length)out.push({level:'ok',text:'Everything looks clean.'});
  return out;
}
function runRefactorAll(){

  const picks=new Set(results.map(x=>x.r.fileId));

    h('div','row',h('h3','grow',results.length+' recipes would change'),
      el('button',{class:'btn pri',onclick:async()=>{

    el('div',{class:'row'},
      el('button',{class:'btn',onclick:async()=>{
        LS.set('anthropicKey',key.value.trim());
        try{ const ms=await aiModels(); modelSel.innerHTML='';
          ms.forEach(m=>modelSel.append(el('option',{value:m,selected:m===LS.get('anthropicModel','')?'selected':null},m)));
          modelSel.onchange=()=>LS.set('anthropicModel',modelSel.value);
          if(!ms.includes(LS.get('anthropicModel','')))LS.set('anthropicModel',ms[0]);
          toast('Key works — '+ms.length+' models available.');
        }catch(e){ toast('Key check failed: '+e.message); }
      }},'Save key and load models'))));

  wrap.append(h('div','card',
    h('h2',null,'This device'),
    h('div','kv',
      el('b',{},'Recipes'),el('span',{},String(S.recipes.length)),
      el('b',{},'Last sync'),el('span',{},S.loadedAt?new Date(S.loadedAt).toLocaleString():'never'),
      el('b',{},'Drive folder'),el('span',{},S.ids.root||'not found yet'),
      el('b',{},'Version'),el('span',{},APP.VER)),
    el('div',{class:'row',style:'margin-top:10px'},
      el('button',{class:'btn',onclick:()=>{LS.del('cache');location.reload();}},'Clear local cache'),
      el('button',{class:'btn danger',onclick:()=>{
        if(confirm('Forget the sign-in and API key on this computer? Your Drive data is untouched.')){
          LS.del('tok');LS.del('anthropicKey');LS.del('clientId');location.reload();}
      }},'Sign out of this device'))));
  return wrap;
}

/* ---------------- modal ---------------- */
function showModal(box){
  closeModal();
  const m=el('div',{class:'modal',onclick:e=>{ if(e.target===m)closeModal(); }},box);
  $('#modalHost').append(m);
  document.body.style.overflow='hidden';
}
function closeModal(){ $('#modalHost').innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* ---------------- boot ---------------- */
$('#btnSync').addEventListener('click',async()=>{ await syncAll(); render(); });
$('#btnSignin').addEventListener('click',async()=>{
  try{ await Drive.auth(true); await syncAll(); render(); }catch(e){ toast(e.message); }
});

async function boot(){
  renderNav();
  const cached=loadCache();
  render();
  if(cached) status('Showing the last synced copy…','');
  const url=new URL(location.href);
  if(url.searchParams.get('client_id')) LS.set('clientId',url.searchParams.get('client_id'));
  let tries=0;
  while(!(window.google&&google.accounts)&&tries<40){ await new Promise(r=>setTimeout(r,150)); tries++; }
  if(!Drive.clientId()){ status('Needs a one-time setup — open Settings','err'); $('#btnSignin').classList.remove('hide'); render(); return; }
  if(!Drive.init()){ status('Google sign-in did not load. Are you offline?','err'); return; }
  try{
    await Drive.auth(false);
    await syncAll();
  }catch(e){
    status('Tap Connect Drive to sign in','');
    $('#btnSignin').classList.remove('hide');
  }
  render();
}
boot();
</script>
