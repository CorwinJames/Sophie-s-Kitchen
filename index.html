/* ---------- the solver --------------------------------------------- */
function solveBake(inp){
  const st=styleById(inp.styleId);
  const blend=(inp.blend||[]).filter(b=>b.flour&&+b.pct>0);
  const hyd=hydrationPlan(blend,{anchorHydration:inp.anchorHydration,anchorProtein:inp.anchorProtein,
                                 scaldPct:inp.scaldPct,sourdough:inp.leaven!=='yeast'});
  const hydration=inp.hydrationLocked&&inp.hydration!=null?+inp.hydration:round1(hyd.target);
  const enrich=enrichFactor(st);
  const opt={hydration,optimum:hyd.target,enrich};

  const warn=[],note=[];
  let T=inp.doughTemp==null?24:+inp.doughTemp;
  let pff=inp.pff==null?st.pff:+inp.pff;
  const locks=inp.locks||{};

  /* the fixed steps that bracket fermentation */
  const benchMin=(st.bench==null?20:st.bench);
  const bench=benchMin/60;
  const mixTime=0.5;
  const bakeTime=inp.path==='freeze'?0:0.75;
  const coolTime=inp.path==='freeze'?0:2;    // ≥2 h before slicing — Vanin 2017 gummy-crumb result

  /* how much time is actually available for fermentation */
  let budget=null;
  if(locks.time&&inp.startAt&&inp.outAt){
    budget=(inp.outAt-inp.startAt)/3600000 - mixTime - bench - bakeTime;
    if(inp.path==='freeze')budget=(inp.outAt-inp.startAt)/3600000 - mixTime - bench;
  }

  /* retard consumes part of the rise budget before we solve anything */
  const retardH=inp.path==='retard'?(+inp.retardHours||12):(inp.path==='freeze'?0:0);
  const rTarget=matrixAt(T).rise;
  const shapingRise=T>=24?10:5;   // shaping alone adds this — Cucuzza [PRAC]
  const rRetard=retardRise(retardH,T);

  /* solve */
  let bulk,solvedFor=null;
  if(budget!=null){
    const proofShare=inp.path==='retard'?0:st.proofFrac;
    // bulk + proof + retard must fit the budget; proof is a fraction of an
    // equivalent bulk at the proofing temperature
    const proofT=inp.useProofBox?(+inp.proofBoxTemp||27):T;
    let avail=budget-(inp.path==='retard'?retardH:0);
    // iterate: proof length depends on the same rate model
    bulk=Math.max(0.25,avail);
    for(let i=0;i<40;i++){
      const proofH=proofShare>0?bulkHours(proofT,pff,opt)*proofShare:0;
      const nb=avail-proofH;
      if(Math.abs(nb-bulk)<0.01){ bulk=nb; break; }
      bulk=nb;
      if(!locks.pff) pff=clamp(pffForHours(T,Math.max(bulk,0.25),opt),0.1,80);
    }
    if(locks.pff&&!locks.temp){
      T=tempForHours(pff,Math.max(bulk,0.25),opt); solvedFor='temperature';
    }else if(!locks.pff){
      pff=pffForHours(T,Math.max(bulk,0.25),opt); solvedFor='levain';
    }else{
      solvedFor='nothing — you locked time, levain and temperature together';
    }
  }else{
    bulk=bulkHours(T,pff,opt);
  }

  const proofT=inp.useProofBox?(+inp.proofBoxTemp||27):T;
  const proofH=inp.path==='retard'?0.5:bulkHours(proofT,pff,opt)*st.proofFrac;

  /* ---- feasibility ---- */
  if(budget!=null&&!locks.pff){
    if(pff>PFF_MAX) warn.push({level:'hard',t:'Not enough time. Even at the practical ceiling of 35% prefermented flour this needs about '+hm(bulkHours(T,PFF_MAX,opt))+' of bulk, and you have allowed '+hm(bulk)+'. Push the bake later, warm the dough, or use commercial yeast instead of a levain.',c:'dumonceaux'});
    else if(pff>25) warn.push({level:'soft',t:'At '+fx(pff,1)+'% prefermented flour you are above the 10–25% range documented for sourdough levains. It will work, but the bread will be markedly more sour and the dough will slacken faster than you expect.',c:'dumonceaux'});
    if(pff<PFF_MIN) warn.push({level:'hard',t:'Too much time. This wants only '+fx(pff,2)+'% prefermented flour, which is below anything you can measure accurately. It will overferment: expect a flat spread loaf, no oven spring, and a score that closes flat instead of lifting. Start later, cool the bulk, or accept a longer, colder ferment.',c:'nodata'});
    else if(pff<3) warn.push({level:'soft',t:'Only '+fx(pff,1)+'% prefermented flour. That is a very small levain — weigh it on a scale that reads to 1 g, and expect the timing to be sensitive to a degree or two of dough temperature.',c:'nodata'});
  }
  if(T>30) warn.push({level:'soft',t:'Above 30 °C the temperature rule stops holding. The yeast optimum is 27 °C and its ceiling is 36 °C, while the bacteria peak at 32–33 °C — so every degree past 28 tilts the dough toward acid and away from gas. You will get sour bread with poor spring, not fast bread.',c:'ganzle'});
  if(T<15) warn.push({level:'soft',t:'Below 18 °C the published matrix runs out and this is an extrapolation from the yeast growth model. Treat the time as a rough bracket and go by the % rise.',c:'ganzle'});
  if(inp.path==='retard'&&rRetard>=rTarget) warn.push({level:'hard',t:'The retard alone overshoots. A '+fx(retardH,0)+' h fridge stay starting at '+fx(T,0)+' °C is worth about '+fx(rRetard,0)+'% rise on its own, and your whole target is '+fx(rTarget,0)+'%. Chill the dough before it goes in, shorten the retard, or cut the bulk to almost nothing.',c:'cucuzza'});
  if((+inp.saltPct||st.salt)>=4) warn.push({level:'hard',t:'At 4% salt the sourdough bacteria stop completely. The yeast tolerates up to 8%, so the dough will still rise — it just will not acidify, and rye in particular depends on that acid for structure.',c:'ganzle'});
  const p=hyd.props;
  if(p.rye>=20&&inp.leaven==='yeast') warn.push({level:'hard',t:'At '+fx(p.rye,0)+'% rye with commercial yeast and no sour, the α-amylase digests the starch during the bake and the crumb will be gummy and unsliceable. Acidify it — that is structural, not a flavour choice.',c:'ireks'});
  if(hydration>88&&p.protein<12) warn.push({level:'soft',t:'That is '+fx(hydration,0)+'% hydration on a '+fx(p.protein,1)+'% protein blend. Hold back the last 5% of the water and add it at the mixer only if the dough takes it.',c:'aaccfar'});
  if(p.einkorn>30) warn.push({level:'soft',t:'Einkorn ferments visibly faster than bread wheat — dough development in 120.8 min against 175.0 for a control. Cut the bulk and go by the dough, not the clock.',c:'brandolini'});

  /* ---- the formula ---- */
  const flourG=+inp.flourGrams||1000;
  const levainHyd=+inp.levainHydration||100;
  const FL=flourG*pff/100;
  const ML=FL*(1+levainHyd/100);
  const WL=ML-FL;
  const WT=flourG*hydration/100;
  const WD=WT-WL;
  const FD=flourG-FL;
  const salt=flourG*((+inp.saltPct||st.salt)/100);

  const rows=[];
  blend.forEach(b=>{
    const tot=blend.reduce((a,x)=>a+(+x.pct||0),0)||100;
    rows.push({name:b.flour,pct:(+b.pct||0)/tot*100,g:FD*((+b.pct||0)/tot),kind:'flour'});
  });
  rows.push({name:'Water (into the dough)',pct:WD/flourG*100,g:WD,kind:'water'});
  rows.push({name:'Levain at '+fx(levainHyd,0)+'% hydration',pct:ML/flourG*100,g:ML,kind:'levain',
             sub:fx(FL,0)+' g flour + '+fx(WL,0)+' g water — '+fx(pff,1)+'% of the total flour is prefermented'});
  rows.push({name:'Salt',pct:(+inp.saltPct||st.salt),g:salt,kind:'salt'});
  if(st.fat)   rows.push({name:'Fat / butter / oil',pct:st.fat,g:flourG*st.fat/100,kind:'enrich'});
  if(st.sugar) rows.push({name:'Sugar / honey',pct:st.sugar,g:flourG*st.sugar/100,kind:'enrich'});
  if(st.egg)   rows.push({name:'Egg',pct:st.egg,g:flourG*st.egg/100,kind:'enrich'});
  if(inp.scaldPct>0){
    const sf=flourG*inp.scaldPct/100;
    rows.push({name:'— of which scalded (tangzhong)',pct:inp.scaldPct,g:sf,kind:'note',
               sub:'Cook '+fx(sf,0)+' g of the flour with '+fx(sf*5,0)+' g of the water to 80 °C, cool, then mix in. At 1:5 that is the ratio in the published method.'});
  }
  const doughG=rows.filter(r=>r.kind!=='note'&&r.kind!=='enrich').reduce((a,r)=>a+r.g,0)
              +rows.filter(r=>r.kind==='enrich').reduce((a,r)=>a+r.g,0);

  /* ---- water temperature ---- */
  const ff=inp.frictionFactor==null?1:+inp.frictionFactor;
  const n=inp.levainTemp!=null?3:2;
  const known=(+inp.roomTemp||20)+(+inp.flourTemp||20)+(inp.levainTemp!=null?+inp.levainTemp:0);
  const waterTemp=(n+1)*T-known-ff;

  /* ---- schedule ---- */
  const steps=[];
  const add=(label,hours,detail)=>steps.push({label,hours,detail});
  add('Mix',mixTime,'Water at '+fx(waterTemp,0)+' °C to land the dough at '+fx(T,0)+' °C. Take the dough temperature after mixing — if it is off, your friction factor is wrong, not the arithmetic.');
  if(inp.path==='retard'){
    const bulkTarget=Math.max(5,rTarget-rRetard-shapingRise);
    add('Bulk at '+fx(T,0)+' °C',bulk,'Let the dough grow until it is '+risePhrase(bulkTarget)+' — that is +'+fx(bulkTarget,0)+'% in volume. Stop there, short of the +'+fx(rTarget,0)+'% this temperature would normally want, because the fridge will add roughly '+fx(rRetard,0)+'% more while it cools and shaping adds about '+fx(shapingRise,0)+'%.');
    add(benchMin?'Bench rest and shape':'Shape',bench,
        benchMin?('Preshape into a loose round, leave it '+fx(benchMin,0)+' minutes, then shape properly. The wait is not idle — it is the gluten letting go so the dough will take a shape without tearing.')
               :('This one does not need a bench rest — shape it straight away, it is slack enough to take it.'));
    add('Fridge at 3–4 °C',retardH,'Most of this is a cooling ramp, not storage. It takes 8–10 h for a domestic fridge to bring dough to 3 °C, and the first hour alone is worth up to 20% rise. Once it is actually cold, 24 h is worth at most 30 min of real fermentation.');
    add('Bake straight from cold',bakeTime,st.bake+'. Score it cold — it holds the cut.');
  }else if(inp.path==='freeze'){
    add('Bulk at '+fx(T,0)+' °C',bulk,'Stop short: let it grow to '+risePhrase(rTarget*0.75)+' rather than the full +'+fx(rTarget,0)+'%. It keeps working while it cools and again while it thaws.');
    add('Divide and ball',Math.max(bench,0.25),'Into individual portions, tight balls, lightly oiled.');
    add('30–60 min at room temperature',0.75,'Let them relax before they go in, or they freeze mid-tension and tear on stretch.');
    add('Freeze',0,'Wrapped individually. There is NO published data on yeast or bacterial survival through a freeze–thaw anywhere in this knowledge base — this schedule is craft, not evidence, and you should expect the first rise after thawing to be slower than a fresh dough. Calibrate it once and write the number down.');
    add('To use: fridge overnight',14,'12–18 h in the fridge, then 2–4 h at room temperature to finish. Do not thaw on the counter from frozen — the outside overproofs before the middle thaws.');
  }else{
    add('Bulk at '+fx(T,0)+' °C',bulk,'Let the dough grow until it is '+risePhrase(Math.max(5,rTarget-shapingRise))+' — that is +'+fx(Math.max(5,rTarget-shapingRise),0)+'% in volume. Shaping adds the last '+fx(shapingRise,0)+'%, bringing it to the +'+fx(rTarget,0)+'% this temperature wants. The time above is a prediction; the height is the measurement, so go by the height.');
    add(benchMin?'Bench rest and shape':'Shape',bench,
        benchMin?('Preshape into a loose round, leave it '+fx(benchMin,0)+' minutes, then shape properly. The wait is the gluten letting go so the dough will take a shape without tearing.')
               :('This one does not need a bench rest — shape it straight away.'));
    add('Final proof at '+fx(proofT,0)+' °C',proofH,'Grown by roughly half again is the usual look, but no published proof duration exists for any bread style, and the poke test has never been validated in any tier of evidence. This number is '+fx(st.proofFrac*100,0)+'% of an equivalent bulk — a starting point. Go by an aliquot in a straight-sided jar at the same temperature.');
    add('Bake',bakeTime,st.bake);
    add('Cool',coolTime,'At least 2 hours before slicing. Cutting hot bread is what makes it read as gummy, not underbaking.');
  }
  /* absolute times */
  let cursor=inp.startAt?new Date(inp.startAt):null;
  let outOfOven=null;
  if(cursor)steps.forEach(s=>{ s.at=new Date(cursor); cursor=new Date(cursor.getTime()+s.hours*3600000);
                               if(/^Bake|^Freeze/.test(s.label))outOfOven=new Date(cursor); });
  const finish=cursor;

  /* ---- oven and finish ---- */
  const oven=[
    {t:'Finish temperature',v:st.core,c:'vanin',
     n:'A lean crumb cannot exceed the local boiling point of its own water while free water remains, so 93–99 °C is a physical endpoint, not a preference. 88 °C measured gummy.'},
    {t:'Oven spring window',v:'roughly the first third of the bake',c:'tucker',
     n:'Fermentation actually restarts about 5 minutes in and runs hard for another 10 until the dough passes about 54 °C. Yeast death is a decimal reduction, not a switch: D = 18.73 min at 52 °C, 5.67 at 55 °C, 1.03 at 58 °C.'},
    {t:'Gelatinisation',v:'above 60 °C, moisture-limited',c:'tucker',
     n:'There is no single sharp temperature. The foam-to-sponge transition is usually placed near 70 °C but the mechanism is not settled.'}
  ];

  return {style:st,path:inp.path,blend,hyd,hydration,pff,doughTemp:T,bulk,proofH,proofT,retardH,rRetard,rTarget,shapingRise,
          rows,doughG,flourG,waterTemp,ff,benchMin,steps,finish,outOfOven,warn,note,oven,enrich,solvedFor,budget,
          limits:grainLimits(blend),mu:muYeast(T),muLab:muLab(T),matrix:matrixAt(T)};
}

/* ---------- reading somebody else's recipe --------------------------
   Keeps the recipe exactly as written and hangs tags off it. The tags
   come from a fixed vocabulary — no prose generation, no guessing.
   -------------------------------------------------------------------- */
const DOUGH_WORDS=/\b(flour|starter|levain|sourdough|yeast|dough|knead|proof|prove|bulk ferment|rise)\b/i;
function looksLikeDough(r){
  const txt=(r.ingredients||[]).map(i=>i.item).join(' ')+' '+(r.tags||[]).join(' ')+' '+(r.name||'');
  const hasFlour=/\bflour\b|\bsemolina\b|\brye\b/i.test(txt);
  const hasLeaven=/\bstarter\b|\blevain\b|\byeast\b|\bsourdough\b/i.test(txt);
  return hasFlour&&(hasLeaven||DOUGH_WORDS.test((r.steps||[]).join(' ')));
}
function readDough(r){
  const g=(item,unit)=>toBase(item,unit);
  let flour=0,water=0,salt=0,levain=0,fat=0,sugar=0,egg=0,yeast=0,rye=0,ww=0,unknown=[];
  (r.ingredients||[]).forEach(i=>{
    const n=norm(i.item);
    const grams=gramsOf(i);
    if(grams==null){ if(/flour|water|salt|starter|levain/.test(n))unknown.push(i.item); return; }
    if(/flour|semolina/.test(n)){ flour+=grams; if(/rye/.test(n))rye+=grams; if(/whole|wholemeal|graham/.test(n))ww+=grams; }
    else if(/^water$|warm water|cold water|ice water/.test(n))water+=grams;
    else if(/salt/.test(n))salt+=grams;
    else if(/starter|levain|poolish|biga|sponge/.test(n))levain+=grams;
    else if(/yeast/.test(n))yeast+=grams;
    else if(/butter|oil|lard|shortening/.test(n))fat+=grams;
    else if(/sugar|honey|malt|molasses|syrup/.test(n))sugar+=grams;
    else if(/^eggs?$/.test(n))egg+=grams;
  });
  if(!flour)return null;
  const FL=levain/2, WL=levain/2;         // assume 100% hydration levain unless told otherwise
  const FT=flour+FL, WT=water+WL;
  return {flourG:FT,hydration:WT/FT*100,salt:salt/FT*100,pff:FL/FT*100,
          fat:fat/FT*100,sugar:sugar/FT*100,egg:egg/FT*100,yeast:yeast>0,
          rye:rye/FT*100,ww:ww/FT*100,unknown:uniq(unknown),volEst:volumeMeasured(r)};
}
/* Volume-to-weight for the handful of things a dough recipe contains.
   Cup measures for flour are worth about ±20% depending on how you
   scoop, so anything converted this way gets flagged rather than
   quietly folded into the hydration figure. [craft] */
const DOUGH_DENSITY=[
  [/flour|semolina/, 0.53],      // ~125 g per US cup
  [/water|milk|buttermilk|juice/, 1.00],
  [/oil/, 0.92],
  [/butter|lard|shortening/, 0.911],
  [/honey|molasses|syrup/, 1.42],
  [/sugar/, 0.85],
  [/salt/, 1.15],                // table salt; kosher is roughly half — weigh it
  [/starter|levain|poolish|biga|sponge/, 1.05],
  [/yeast/, 0.68],
  [/egg/, 1.03]
];
function gramsOf(i){
  const b=toBase(i.qty,i.unit);
  if(!b)return null;
  if(b.fam==='weight')return b.n;
  if(b.fam==='volume'){
    const n=norm(i.item);
    for(const [re,d] of DOUGH_DENSITY) if(re.test(n))return {g:b.n*d,est:true}.g;
    return null;
  }
  if(b.fam==='count'&&/egg/.test(norm(i.item)))return b.n*50;   // large egg, in shell ~57 g
  return null;
}
function volumeMeasured(r){
  return (r.ingredients||[]).some(i=>{
    const b=toBase(i.qty,i.unit);
    return b&&b.fam==='volume'&&/flour|water/.test(norm(i.item));
  });
}

function bakeTags(d,cond){
  /* d from readDough, cond = {ambientC, doughTemp, statedBulkH} */
  const tags=[];
  const T=cond.doughTemp==null?(cond.ambientC==null?21:+cond.ambientC+1):+cond.doughTemp;
  const m=matrixAt(T);
  const enrich=enrichFactor({sugar:d.sugar,fat:d.fat,egg:d.egg});
  const mine=bulkHours(T,Math.max(d.pff,0.4),{hydration:d.hydration,optimum:d.hydration,enrich});

  tags.push({tag:'BULK → '+hm(mine),why:'At '+fx(T,0)+' °C with '+fx(d.pff,1)+'% prefermented flour. The published matrix puts a '+fx(T,0)+' °C bulk at '+hm(m.lo)+'–'+hm(m.hi)+' for a 20% starter; yours is '+(d.pff<PFF_REF?'smaller, so it needs longer':'larger, so it goes faster')+'.',c:'cucuzza'});
  tags.push({tag:'RISE TO +'+fx(m.rise,0)+'%',why:'That is the endpoint for '+fx(T,0)+' °C. Warmer dough needs LESS rise, not more — at 27 °C the target is +30%, at 18 °C it is +100%. Measure it, do not eyeball it.',c:'cucuzza'});

  if(cond.statedBulkH>0){
    const ratio=mine/cond.statedBulkH;
    if(ratio>1.6) tags.push({tag:'IT IS COLD — ROUGHLY '+(ratio>2.4?'TRIPLE':'DOUBLE')+' THE BULK',why:'The recipe says '+hm(cond.statedBulkH)+'. At '+fx(T,0)+' °C in your kitchen the same dough needs about '+hm(mine)+'. Recipes almost never state the temperature they were written at.',c:'cucuzza'});
    else if(ratio<0.65) tags.push({tag:'IT IS WARM — CUT THE BULK',why:'The recipe says '+hm(cond.statedBulkH)+'; at '+fx(T,0)+' °C this wants about '+hm(mine)+'. Going the full stated time will overferment it.',c:'cucuzza'});
  }
  if(d.hydration<58) tags.push({tag:'STIFF — EXPECT A LONGER FERMENT',why:fx(d.hydration,0)+'% hydration. Gas production measured about 11% lower at 51% water than at the farinograph optimum, so a dry dough is a slow dough as well as a tight one.',c:'codina'});
  if(d.hydration>85) tags.push({tag:'HOLD BACK 5% OF THE WATER',why:fx(d.hydration,0)+'% is high enough that a 3% error in either direction visibly degrades the mix. Add the last of it at the mixer only if the dough takes it.',c:'aaccfar'});
  if(d.salt<1.5) tags.push({tag:'LOW SALT — WATCH THE TIMING',why:'Only '+fx(d.salt,1)+'%. Convention is 1.8–2.2%. Less salt means a faster, slacker dough, so treat every time in the recipe as an upper bound.',c:'hamelman'});
  if(d.salt>=4) tags.push({tag:'SALT WILL STOP THE SOUR',why:fx(d.salt,1)+'% salt completely inhibits the sourdough bacteria. The yeast keeps going to 8%, so it will still rise — it just will not acidify.',c:'ganzle'});
  if(d.rye>=20) tags.push({tag:'ACIDIFY — STRUCTURAL',why:fx(d.rye,0)+'% rye. Rye α-amylase peaks at pH 5.0–5.5 and rye starch gelatinises right into that window during the bake. Without a sour the starch framework is digested and the crumb goes gummy. Put at least 30% of the flour through the rye sour.',c:'ireks'});
  if(d.ww>=54) tags.push({tag:'DENSE RISK — '+fx(d.ww,0)+'% WHOLE GRAIN',why:'That is about '+fx(d.ww*BRAN_PER_WG,1)+'% bran. Measured loaf volume was unchanged at 7.5% bran and down 11% at 15%. Also take the water up.',c:'campbell'});
  if(enrich>1.2) tags.push({tag:'ENRICHED — ALLOW '+fx((enrich-1)*100,0)+'% LONGER',why:'Butter, sugar and egg total '+fx(d.fat+d.sugar+d.egg,0)+'% of flour weight. There is NO published coefficient for how much enrichment slows fermentation — this multiplier is craft convention and you should calibrate it against your own bakes.',c:'craft'});
  if(d.yeast&&d.pff>0) tags.push({tag:'MIXED LEAVEN',why:'Both commercial yeast and a starter. The yeast will drive the gas and the bacteria the flavour, and the timing follows the yeast, not the matrix above.',c:'nodata'});
  if(d.volEst) tags.push({tag:'MEASURED BY VOLUME',why:'The flour or water is in cups, so the hydration figure above is an estimate — a cup of flour is worth about ±20% depending on how you scoop it. Weigh one batch and write the grams on the recipe; every number here gets sharper.',c:'craft'});
  if(d.unknown.length) tags.push({tag:'UNWEIGHED INGREDIENTS',why:'Could not convert: '+d.unknown.join(', ')+'. Baker’s percentages below ignore them, so treat the hydration figure as approximate.',c:'nodata'});
  return tags;
}

/* Percentage rise is the least intuitive number in baking, so never print
   it without saying what it means in plain height. */
function risePhrase(p){
  if(p>=95)return 'twice the height it started at';
  if(p>=85)return 'nearly twice the height it started at';
  if(p>=70)return 'about three-quarters taller than it started';
  if(p>=55)return 'about two-thirds taller than it started';
  if(p>=45)return 'half again as tall as it started';
  if(p>=29)return 'about a third taller than it started';
  if(p>=20)return 'about a quarter taller than it started';
  return 'about '+fx(p,0)+'% taller than it started';
}

/* ---------- small formatters ---------- */
function fx(n,d){ if(n==null||!isFinite(n))return '—'; return (+n).toFixed(d==null?0:d).replace(/\.0+$/,''); }
function round1(n){ return Math.round(n*10)/10; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function hm(hours){
  if(hours==null||!isFinite(hours))return '—';
  if(hours<=0)return '0 m';
  const h=Math.floor(hours), m=Math.round((hours-h)*60);
  if(m===60)return (h+1)+' h';
  if(!h)return m+' m';
  return h+' h'+(m?' '+m+' m':'');
}
function clockOf(d){
  if(!d)return '';
  return d.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
}

/* ---------- how much of this flour can I actually use? ----------------
   The single question the calculator was silent on. Answers come from the
   grain, not the brand: a ceiling where one has been published, a starting
   share that is comfortably inside it, and a plain reason. Where nothing
   has been published the ceiling is null and it says so rather than
   inventing one.
   -------------------------------------------------------------------- */
function flourGuide(name){
  const f=flourByName(name)||{};
  const g=(f.grain||'wheat').toLowerCase();
  const whole=+f.whole||0;
  const prot=f.protein==null?null:+f.protein;

  if(/salish/i.test(name))
    return {suggest:15,max:null,cite:'morgan23',ladder:true,
      why:'No baking data exists for this wheat at all. 15% is the first rung of a test ladder, not a recommendation — bake it, look at the crumb, then try 30%.'};
  if(g==='kernza')
    return {suggest:15,max:45,cite:'cetiner',
      why:'15% was the best-performing level in the one published trial; 45% is where that trial put the ceiling. A second source says 10–15% and flatbreads only.'};
  if(g==='rye')
    return {suggest:20,max:null,cite:'ireks',acidify:true,
      why:'No published % threshold exists for rye. Above about 20% the crumb changes character, and at any real level it must be acidified or the starch is digested during the bake.'};
  if(g==='einkorn')
    return {suggest:20,max:null,cite:'brandolini',
      why:'No published ceiling. It takes about 6 points less water and ferments visibly faster, so it changes the schedule as much as the crumb.'};
  if(g==='spelt')
    return {suggest:30,max:null,cite:'geisslitz',
      why:'No published maximum. Spelt has more gluten than common wheat but weaker — it slackens suddenly rather than gradually, so go up in steps.'};
  if(/durum|semolina/i.test(name))
    return {suggest:20,max:null,cite:'geisslitz',
      why:'High gliadin to glutenin, which costs elasticity. Traditionally supported in a pan or basket rather than free-standing.'};
  if(whole>=50)
    return {suggest:25,max:54,cite:'campbell',
      why:'Measured loaf volume was unchanged up to 7.5% bran and down 11% at 15%. That break point lands near 54% whole-grain flour; 25% is comfortably inside it.'};
  if(whole>0)
    return {suggest:Math.min(40,Math.round(54/Math.max(whole,1)*100)),max:Math.round(54/Math.max(whole,1)*100),cite:'campbell',
      why:'Partly whole grain, so it carries proportionally less bran — the 54% whole-grain break point stretches further with a flour like this.'};
  if(prot!=null&&prot<10)
    return {suggest:20,max:30,cite:'murphy',
      why:'At '+fx(prot,1)+'% protein this dilutes the gluten of whatever it is blended into. Keep it as a flavour grain in a strong base.'};
  return {suggest:null,max:null,cite:null,base:true,
    why:'A strong white flour — this is the base the others get blended into.'};
}
/* the strongest refined flour in the blend carries the remainder */
function baseFlourIndex(blend){
  let best=-1,bp=-1;
  blend.forEach((b,i)=>{
    const f=flourByName(b.flour)||{};
    const g=flourGuide(b.flour);
    const p=f.protein==null?11:+f.protein;
    if(g.base&&p>bp){ bp=p; best=i; }
  });
  if(best<0)blend.forEach((b,i)=>{
    const f=flourByName(b.flour)||{};
    const p=f.protein==null?11:+f.protein;
    if(p>bp){ bp=p; best=i; }
  });
  return best<0?0:best;
}
function suggestedBlend(blend){
  if(!blend.length)return blend.slice();
  const bi=baseFlourIndex(blend);
  const out=blend.map((b,i)=>({flour:b.flour,pct:b.pct}));
  let used=0;
  out.forEach((b,i)=>{
    if(i===bi)return;
    const g=flourGuide(b.flour);
    const s=g.suggest==null?10:g.suggest;
    b.pct=s; used+=s;
  });
  out[bi].pct=Math.max(0,Math.round((100-used)*10)/10);
  return out;
}
/* is the blend as it stands inside what has been published? */
function blendVerdict(blend){
  const notes=[];
  blend.forEach(b=>{
    const pct=+b.pct||0; if(!pct)return;
    const g=flourGuide(b.flour);
    if(g.max!=null&&pct>g.max)
      notes.push({level:'hard',t:b.flour+' at '+fx(pct,0)+'% is past the '+fx(g.max,0)+'% the evidence covers. '+g.why,c:g.cite});
    else if(g.suggest!=null&&pct>g.suggest*1.6)
      notes.push({level:'soft',t:b.flour+' at '+fx(pct,0)+'% is well above the '+fx(g.suggest,0)+'% starting point. Workable, but expect a denser, tighter crumb.',c:g.cite});
    if(g.acidify&&pct>=20)
      notes.push({level:'hard',t:'With '+fx(pct,0)+'% '+b.flour+', put at least 30% of your total flour through the sour. Rye needs the acid structurally, not for flavour.',c:'ginsberg'});
  });
  return notes;
}
/* ============================================================
   INGREDIENT CLASSES, SYNONYMS, AND SWAPS
   ------------------------------------------------------------
   Three different relations, kept separate on purpose, because
   conflating them is how a matcher starts lying to you.

     CLASS       one-way. "lean pork" is an ask, not a product.
                 Pork tenderloin answers it; "lean pork" does not
                 answer a recipe that specifically wants tenderloin.

     SAME THING  two-way identity. Beancurd IS tofu. Either word
                 satisfies either ask, and they never both appear
                 as separate things to buy.

     SWAP        two-way substitution between things that are NOT
                 the same. Ground pork is not ground beef, but one
                 will stand in for the other — and because they
                 measure the same way, crossing one off can move
                 its weight onto the other.

   All three live in classes.md in your Drive folder as plain text.
   ============================================================ */

function parseClasses(text){
  const S2=sections(text);
  const classes=[];
  bullets(S2['classes']).forEach(l=>{
    const m=/^(.+?)\s*:\s*(.+)$/.exec(l); if(!m)return;
    const members=m[2].split(',').map(x=>x.trim()).filter(Boolean);
    if(members.length)classes.push({name:m[1].trim(),members});
  });
  const same=[];
  bullets(S2['same thing']).forEach(l=>{
    const parts=l.split(/\s*=\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1)same.push(parts);
  });
  const distinct=bullets(S2['different product'])
    .flatMap(l=>l.split(/[,\s]+/)).map(x=>norm(x)).filter(Boolean);
  const swap=[];
  bullets(S2['interchangeable']).forEach(l=>{
    const parts=l.split(/\s*(?:<->|<>|~)\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1)swap.push(parts);
  });
  return {classes,same,swap,distinct,raw:text};
}
function serializeClasses(c){
  const out=['# Ingredient Classes','',
    'Three different relations. Keeping them apart is what stops the app',
    'telling you that you can cook something you cannot.',''];
  out.push('## Classes','',
    'A generic ask, then everything that answers it. One-way: having pork',
    'tenderloin satisfies a recipe asking for "lean pork", but a recipe that',
    'specifically wants tenderloin is not satisfied by just any lean pork.','');
  (c.classes||[]).forEach(x=>out.push('- '+x.name+': '+x.members.join(', ')));
  out.push('','## Same thing','',
    'Different words for one product. Works in every direction, and these',
    'never show up twice on a shopping list.','');
  (c.same||[]).forEach(g=>out.push('- '+g.join(' = ')));
  out.push('','## Interchangeable','',
    'Not the same thing, but either will do. Written with <->. On a recipe',
    'page you can cross one off and its amount moves onto the other.','');
  (c.swap||[]).forEach(g=>out.push('- '+g.join(' <-> ')));
  out.push('','## Different product','',
    'Words that change what a thing IS rather than just describing it. Quail',
    'eggs are not eggs; dried shrimp are not shrimp. One word per line or all',
    'on one line, separated by spaces or commas.','');
  if((c.distinct||[]).length)out.push('- '+c.distinct.join(', '));
  out.push('');
  return out.join('\n');
}

/* ---------- the matcher ----------
   Built once per classes.md, not once per question. Class members can be
   class names themselves, so the nesting is flattened up front and the loop
   guard runs here rather than on every lookup. Answers are remembered too:
   sweeping a 400-recipe library asks the same "does X answer Y" question
   tens of thousands of times. */
let _cx=null,_cxSrc=null;
function classIndex(){
  const src=(S.classes&&S.classes.classes)?S.classes:{classes:[],same:[],swap:[]};
  if(_cx&&_cxSrc===src)return _cx;
  const byName=new Map();
  src.classes.forEach(c=>byName.set(norm(c.name),c));
  const expand=(c,seen)=>{
    if(seen.has(c))return [];
    seen.add(c);
    let out=[];
    c.members.forEach(m=>{
      const sub=byName.get(norm(m));
      if(sub)out=out.concat(expand(sub,seen)); else out.push(m);
    });
    return out;
  };
  const flat=new Map();
  src.classes.forEach(c=>flat.set(norm(c.name),uniq(expand(c,new Set()))));
  const gid=new Map();
  src.same.forEach((g,i)=>g.forEach(x=>gid.set(norm(x),i)));
  const distinct=new Set((S.classes&&S.classes.distinct)||[]);
  const swapBy=new Map();
  src.swap.forEach(g=>g.forEach(x=>{
    const k=norm(x);
    swapBy.set(k,uniq((swapBy.get(k)||[]).concat(g.filter(y=>norm(y)!==k))));
  }));
  _cxSrc=src;
  _cx={src,byName,flat,gid,swapBy,distinct,ans:new Map()};
  return _cx;
}
function classByName(n){
  const cx=classIndex();
  return cx.byName.get(norm(n))||cx.src.classes.find(c=>sameThing(c.name,n))||null;
}
/* two names for one product */
function sameGroup(a,b){
  if(sameThing(a,b))return true;
  const cx=classIndex();
  const ga=cx.gid.get(norm(a));
  if(ga!=null&&ga===cx.gid.get(norm(b)))return true;
  return cx.src.same.some(g=>
    g.some(x=>sameThing(x,a)) && g.some(x=>sameThing(x,b)));
}
/* does `item` belong to `cls`? Members may themselves be class names,
   so this recurses — with a seen-set, because a data file written by a
   human will eventually contain a loop. */
function inClass(item,cls){
  if(!cls)return false;
  const members=classIndex().flat.get(norm(cls.name))||cls.members;
  return members.some(m=>sameGroup(m,item)||satisfies(item,m));
}
/* THE question: does having `haveItem` satisfy a recipe asking for `wantItem`?
   Everything that used to call satisfies() against the pantry calls this now. */
function answers(haveItem,wantItem){
  if(satisfies(haveItem,wantItem))return true;
  const cx=classIndex();
  const k=norm(haveItem)+'\u0000'+norm(wantItem);
  if(cx.ans.has(k))return cx.ans.get(k);
  let v=false;
  if(sameGroup(haveItem,wantItem))v=true;
  else { const cls=classByName(wantItem); v=!!(cls&&inClass(haveItem,cls)); }
  if(cx.ans.size<200000)cx.ans.set(k,v);
  return v;
}
/* everything that could stand in for this, for display */
function standIns(item){
  const cx=classIndex();
  const fast=cx.swapBy.get(norm(item));
  if(fast)return fast;
  const out=[];
  cx.src.swap.forEach(g=>{
    if(g.some(x=>sameGroup(x,item)))g.forEach(x=>{ if(!sameGroup(x,item))out.push(x); });
  });
  return uniq(out);
}
/* which class asks would this specific thing answer */
function classesFor(item){
  return (S.classes&&S.classes.classes||[]).filter(c=>inClass(item,c)).map(c=>c.name);
}

/* ---------- crossing one ingredient off onto another ----------
   "500 g ground beef and 250 g ground pork" — drop the pork, and the
   beef should read 750 g. Only ever between things listed as
   interchangeable, and only when the two amounts are in the same family
   of units, because 250 g cannot be added to 2 cups without a density
   nobody has measured. */
function absorbTarget(recipe,ing){
  const parts=standIns(ing.item);
  for(const p of parts){
    const t=(recipe.ingredients||[]).find(x=>x!==ing&&x.key&&sameGroup(x.item,p));
    if(t)return t;
  }
  return null;
}
function addBase(a,b){
  const A=toBase(a.qty,a.unit), B=toBase(b.qty,b.unit);
  if(!A||!B||A.fam!==B.fam)return null;
  return {fam:A.fam,n:A.n+B.n};
}
function fmtBase(base,unit){
  if(!base)return null;
  const u=(unit||'').toLowerCase();
  if(base.fam==='weight'&&UNIT_G[u])return trimNum(base.n/UNIT_G[u]);
  if(base.fam==='volume'&&UNIT_ML[u])return trimNum(base.n/UNIT_ML[u]);
  if(base.fam==='count')return trimNum(base.n);
  return null;
}
/* Returns the recipe's ingredients with the dropped ones removed and their
   amounts folded into their stand-ins. Never mutates the recipe. */
function withDropped(recipe,offKeys){
  const off=new Set((offKeys||[]).map(norm).filter(Boolean));
  const rows=(recipe.ingredients||[]).map(i=>Object.assign({},i));
  const dropped=[];
  rows.forEach(i=>{
    if(!i.key||!off.has(i.key))return;
    i._off=true;
    const t=absorbTarget({ingredients:rows.filter(x=>!x._off)},i);
    if(!t)return;
    const sum=addBase(t,i);
    const q=fmtBase(sum,t.unit);
    if(q==null)return;                       // units will not add — leave both alone
    t._absorbed=(t._absorbed||[]).concat([{from:i.item,qty:i.qty,unit:i.unit}]);
    t.qty=String(q); t.raw=ingLine(t);
    dropped.push({from:i.item,to:t.item});
  });
  return {rows,dropped};
}

/* ---------- what we could get ----------
   Everything the whole library asks for that is neither in the house nor
   already on the list. This is the shopping repertoire: the things that
   would unlock recipes if you picked them up. */
let _cgCache=null,_cgStamp='';
function couldGetStamp(){
  return (S.recipes||[]).length+'|'+S.pantry.groups.reduce((a,g)=>a+g.items.length,0)
    +'|'+pantryHave(S.pantry).length+'|'+((S.grocery.need||[]).length+(S.grocery.manual||[]).length)
    +'|'+((S.classes&&S.classes.raw)||'').length;
}
function couldGet(){
  const stamp=couldGetStamp();
  if(_cgCache&&_cgStamp===stamp)return _cgCache;
  /* Collect the distinct asks first, then decide about each one ONCE.
     Testing every occurrence separately meant asking the same question of
     the pantry five thousand times over a four-hundred-recipe library. */
  const map=new Map();
  (S.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>{
    if(!i.key||isFree(i.item))return;
    if(!map.has(i.key))map.set(i.key,{key:i.key,name:i.item,n:0,recipes:[]});
    const e=map.get(i.key);
    e.n++;
    if(e.recipes.length<8&&e.recipes.indexOf(r.name)<0)e.recipes.push(r.name);
    if(i.item.length<e.name.length)e.name=i.item;    // prefer the plainest wording
  }));
  const have=pantryHave(S.pantry);
  const known=new Set();
  S.pantry.groups.forEach(g=>g.items.forEach(i=>known.add(i.key)));
  const onList=new Set((S.grocery.need||[]).concat(S.grocery.manual||[]).map(norm));
  const out=[];
  map.forEach(e=>{
    if(known.has(e.key)||onList.has(e.key))return;
    if(have.some(h=>answers(h.name,e.name)))return;
    out.push(e);
  });
  out.sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  _cgCache=out; _cgStamp=stamp;
  return out;
}
/* grouped into the same shelf order as the sidebar */
function couldGetGrouped(){
  const list=couldGet();
  const order=(S.rules.shelf||CAT_DEFAULT);
  const by={};
  list.forEach(x=>{ const c=categoryOf(x.name); (by[c]=by[c]||[]).push(x); });
  return order.filter(c=>by[c]&&by[c].length).map(c=>({name:c,items:by[c]}))
    .concat(Object.keys(by).filter(c=>!order.includes(c)).map(c=>({name:c,items:by[c]})));
}

/* ============================================================

   One tap flips an item to out. It stops counting as available,

let _stockTimer=null,_stockDirty=false;
function setStock(item,out){ setStockLevel(item,out?'out':'plenty'); }
function setStockLevel(item,level){
  setLevel(item,level);
  const name=item.name;
  S.grocery.got=S.grocery.got.filter(t=>t!==name);
  if(level==='out'){ if(!S.grocery.need.includes(name)&&!S.grocery.manual.includes(name))S.grocery.need.push(name); }
  else { S.grocery.need=S.grocery.need.filter(t=>t!==name); }
  _stockDirty=true;
  status(level==='out'?`Out of ${name} — added to the list…`:`${name}: ${LEVEL_LABEL[level]}…`,'busy');
  renderStockHost(); renderPantrySide(); refreshMatches(); renderGrocHost();

}

async function flushStock(){
  if(!_stockDirty)return;
  _stockDirty=false;
  const pt=serializePantry(S.pantry); S.pantry.raw=pt;
  const gt=serializeGrocery(S.grocery); S.grocery.raw=gt;

}

/* press and hold — the touch equivalent of hovering to reveal the ×.
   Tolerant of a little finger drift, and swallows the click that follows. */
function longPress(node,ms,fn){
  let timer=null,fired=false,sx=0,sy=0;
  const cancel=()=>{ clearTimeout(timer); timer=null; node.classList.remove('pressing'); };
  node.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0)return;
    fired=false; sx=e.clientX; sy=e.clientY;
    node.classList.add('pressing');
    timer=setTimeout(()=>{ fired=true; node.classList.remove('pressing'); fn(); },ms);
  });
  node.addEventListener('pointermove',e=>{
    if(!timer)return;
    if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)cancel();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>node.addEventListener(ev,cancel));
  node.addEventListener('click',e=>{ if(fired){ e.preventDefault(); e.stopPropagation(); fired=false; } },true);
  node.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---- the sidebar: everything in the house, doubling as recipe filters ---- */
function renderPantrySide(){
  const side=document.getElementById('pantrySide');
  if(!side)return;
  side.innerHTML='';
  const all=S.pantry.groups.flatMap(g=>g.items);
  const out=all.filter(i=>i.out);
  const q=(UI.sideFind||'').trim().toLowerCase();

  side.append(el('div',{class:'sidehead'},
    h('h3',null,"What's in the house"),
    h('span','n tiny dim',(all.length-out.length)+' in')));
  side.append(el('input',{type:'text',class:'sidefind',placeholder:'find an ingredient',
    value:UI.sideFind||'',
    oninput:e=>{UI.sideFind=e.target.value;renderPantrySide();}}));
  side.append(h('p','tiny dim','Click to filter the recipes. Hover for the × — or press and hold — to say we have run out.'));

  if(UI.selected.length){
    side.append(el('div',{class:'row',style:'margin:8px 0'},
      el('button',{class:'btn sm',onclick:()=>{UI.selected=[];renderPantrySide();refreshMatches();}},
        'Clear '+UI.selected.length+' filter'+(UI.selected.length>1?'s':''))));
  }

  const row=(i,gone,group)=>{
    const on=UI.selected.some(s=>sameThing(s,i.name));
    const node=el('div',{class:'pitem'+(on?' on':'')+(gone?' gone':''),
      title:gone?'we are out — click to say we have it again'
                :(LEVEL_LABEL[i.level]+' · click to filter, × or hold to mark it gone')},
      el('span',{class:'nm'},i.name));
    if(!gone && /freezer/i.test(group||'')) node.append(el('span',{class:'frz',title:'in the freezer'},'\u2744'));
    if(!gone && i.level!=='plenty')
      node.append(el('span',{class:'lvl'},i.level==='low'?'LOW':'SOME'));
    if(!gone && i.qty)
      node.append(el('span',{class:'lvl'},[i.qty,i.unit].filter(Boolean).join(' ')));
    node.append(el('span',{class:'kill',title:gone?'we have it again':'we do not have this any more',
      onclick:e=>{ e.stopPropagation(); setStockLevel(i,gone?'plenty':'out'); }},gone?'↺':'×'));
    node.addEventListener('click',()=>{
      if(gone){ setStockLevel(i,'plenty'); return; }
      UI.selected = on ? UI.selected.filter(s=>!sameThing(s,i.name)) : UI.selected.concat(i.name);
      renderPantrySide(); refreshMatches();
    });
    longPress(node,500,()=>setStockLevel(i,gone?'plenty':'out'));
    return node;
  };

  /* grouped by what a thing is, not where it lives — order set in house-rules.md */
  const buckets={};
  S.pantry.groups.forEach(g=>g.items.forEach(i=>{
    if(i.out)return;
    if(q && !i.name.toLowerCase().includes(q))return;
    const c=categoryOf(i.name,g.name);
    (buckets[c]=buckets[c]||[]).push({item:i,group:g.name});
  }));
  let shown=0;
  (S.rules.shelf||CAT_DEFAULT).forEach(c=>{
    const items=buckets[c];
    if(!items||!items.length)return;
    side.append(el('div',{class:'pgroup'},CAT_LABEL[c]||c,
      el('span',{style:'float:right;opacity:.6;letter-spacing:0'},String(items.length))));
    items.sort((a,b)=>a.item.name.localeCompare(b.item.name));
    items.forEach(x=>{ side.append(row(x.item,false,x.group)); shown++; });
  });
  if(!shown) side.append(h('p','small dim',q?'Nothing matches “'+q+'”.':'Nothing in the house.'));

  const outShown=out.filter(i=>!q||i.name.toLowerCase().includes(q));
  if(outShown.length){
    side.append(h('div','pgroup','Out — click to put back'));
    outShown.forEach(i=>side.append(row(i,true)));
  }
}

/* re-draw only the recipe bands */
function refreshMatches(){
  const host=document.getElementById('matchHost');
  if(!host)return;
  host.innerHTML='';

  let ranked=rankRecipes(UI.selected,{q:UI.q});
  /* the sidebar is a filter, not a hint: everything ticked must be in the recipe */
  if(UI.selected.length)
    ranked=ranked.filter(x=>UI.selected.every(s=>x.recipe.ingredients.some(i=>sameThing(i.item,s))));

  const now=ranked.filter(x=>x.missing.length===0);
  const swap=ranked.filter(x=>x.missing.length>0
    && x.missing.every(m=>findSub(m.item)||isDroppable(m.item)));
  const near=ranked.filter(x=>!now.includes(x)&&!swap.includes(x)
    && x.missing.filter(m=>!findSub(m.item)&&!isDroppable(m.item)).length<=2);
  const rest=ranked.filter(x=>!now.includes(x)&&!swap.includes(x)&&!near.includes(x));

  if(UI.selected.length||UI.q){
    host.append(el('div',{class:'filterbar'},
      h('span','tiny dim','Showing'),
      UI.q?h('span','tag','“'+UI.q+'”'):null,
      UI.selected.map(s=>el('span',{class:'tag',style:'cursor:pointer',
        onclick:()=>{UI.selected=UI.selected.filter(x=>x!==s);renderPantrySide();refreshMatches();}},s+'  ×')),
      el('button',{class:'btn sm',onclick:()=>{
        UI.selected=[];UI.q='';const b=$('#searchBox');if(b)b.value='';
        renderPantrySide();refreshMatches();
      }},'Show everything')));
  }

  if(!ranked.length){
    host.append(h('div','card',h('p','muted',
      UI.selected.length?'Nothing uses '+UI.selected.join(' and ')+'.'
        :(UI.q?'Nothing matches “'+UI.q+'”.':'No recipes yet. Add one from the Add tab.'))));
    return;
  }

  const band=(title,sub,list,limit)=>{
    if(!list.length)return;
    host.append(el('div',{class:'sec'},h('h2',null,title),h('span','n',list.length+(sub?' · '+sub:''))));
    const grid=h('div','grid');
    list.slice(0,limit||12).forEach(x=>grid.append(recipeCard(x)));
    host.append(grid);
  };

  band('Make it right now','nothing to buy',now,12);
  band('One swap away','we have a stand-in for everything missing',swap,9);
  band('Nearly there','one or two things short',near,9);
  band(UI.q||UI.selected.length?'Other matches':'Everything else','',rest,9);
}

  const wrap=h('div',null);

async function saveAsVariant(orig,adapted,protein){

    h('div','row',h('h2','grow','Someone cooked here'),el('button',{class:'btn sm',onclick:closeModal},'Close')),

      el('div',{class:'chips'},g.items.filter(i=>!i.out).map(i=>

        }},i.name)))))),
    el('div',{class:'row',style:'margin-top:14px'},
      el('button',{class:'btn pri',onclick:()=>{

async function adaptFlow(raw,opts={}){
  if(!raw||!raw.trim())return toast('Nothing to convert.');
  let rec;
  if(opts.ai){
    status('Asking Claude…','busy');
    try{
      const md=await aiAdapt(raw);
      rec=parseRecipe(md,null);
      rec.slug=slug(rec.name);
      status('','good');
    }catch(e){ toast('AI step failed: '+e.message+' — falling back to rules.'); status('','');
      rec=captureParse(raw); }
  } else rec=captureParse(raw);

  const {result,changes}=refactor(rec);
  showAdaptModal(result,changes,opts.source);
}

    ta,
    el('div',{class:'row',style:'margin-top:10px'},

        try{
          status('Saving…','busy');
          const res=await Drive.create(nameIn.value.endsWith('.md')?nameIn.value:nameIn.value+'.md',S.ids.library,ta.value);
          const parsed=parseRecipe(ta.value,res); S.recipes.push(parsed); saveCache();

            S.inbox=S.inbox.filter(f=>f.id!==sourceFile.id); }catch(e){} }

/* ============================================================
   RECEIPTS — photograph now, read later
   The photo goes to Drive and gets logged in receipts-queue.md.
   Ask Claude to process the queue and it fills in the pantry and prices.
   ============================================================ */
function pickReceipt(onDone){
  const inp=el('input',{type:'file',accept:'image/*',capture:'environment',style:'display:none'});
  inp.addEventListener('change',async()=>{
    const f=inp.files&&inp.files[0];
    if(!f)return;
    try{ const res=await uploadReceipt(f); onDone&&onDone(null,res); }
    catch(e){ onDone&&onDone(e); }
    inp.remove();
  });
  document.body.append(inp);
  inp.click();
}
async function uploadReceipt(file){
  status('Uploading the receipt…','busy');
  if(!S.ids.receipts){ await syncAll(); }
  if(!S.ids.receipts) throw new Error('Not connected to Drive yet');
  const d=new Date();
  const stamp=fmtDate(d)+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  const ext=(file.name.match(/\.(jpe?g|png|heic|webp)$/i)||['.jpg'])[0];
  const name='receipt-'+stamp+ext.toLowerCase();
  const up=await Drive.createBinary(name,S.ids.receipts,file,file.type||'image/jpeg');
  S.receipts.rows.push({when:fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
    file:name,id:up.id,status:'new'});
  const text=serializeReceipts(S.receipts); S.receipts.raw=text;
  await saveFile('receipts-queue.md',text);
  saveCache();
  status('Receipt saved · '+S.receipts.rows.length+' waiting to be read','good');
  return {name,id:up.id};
}

  const waiting=(S.receipts&&S.receipts.rows||[]).filter(r=>r.status==='new');
  return h('div','card',

  wrap.append(h('div','card',

      el('span',{class:w.level==='bad'?'miss':'dim'},w.text))))));

function libraryWarnings(){
  const out=[];
  S.recipes.forEach(r=>{
    if(!r.ingredients.length)out.push({level:'bad',text:r.name+' — no ingredients section'});
    r.ingredients.filter(i=>ingredientCounts(i)&&!i.key).forEach(i=>
      out.push({level:'bad',text:r.name+' — could not read the ingredient "'+i.item+'". It is being counted as missing, so this recipe will never claim to be cookable until you reword it.'}));
    if(!r.steps.length)out.push({level:'bad',text:r.name+' — no steps'});
    if(!r.meta.serves)out.push({level:'warn',text:r.name+' — no serving size'});
    if(!r.tags.length)out.push({level:'warn',text:r.name+' — no tags, the planner will rarely pick it'});
    r.steps.forEach(s=>{ const m=/^@([a-z0-9-]+)/i.exec(s.trim());
      if(m&&!S.steps.map[m[1]])out.push({level:'bad',text:r.name+' — refers to @'+m[1]+' which is not in the step library'}); });
    const nv=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
    nv.forEach(n=>out.push({level:'bad',text:r.name+' — contains '+n+' (Never list)'}));
  });
  // repeated step text across recipes = candidate for the step library
  const counts={};
  S.recipes.forEach(r=>r.steps.forEach(s=>{ if(/^@/.test(s))return; const k=norm(s).slice(0,60);
    if(k.length<20)return; (counts[k]=counts[k]||{n:0,ex:s}).n++; }));
  Object.values(counts).filter(c=>c.n>=2).slice(0,6).forEach(c=>
    out.push({level:'warn',text:`"${c.ex.slice(0,60)}…" appears in ${c.n} recipes — worth naming in the step library`}));
  if(!out.length)out.push({level:'ok',text:'Everything looks clean.'});
  return out;
}
function runRefactorAll(){
  const host=$('#refOut'); host.innerHTML='';
  const results=S.recipes.map(r=>Object.assign({r},refactor(r))).filter(x=>x.changes.length);
  if(!results.length){ host.append(h('div','card',h('p','muted','Nothing to change — the library already matches the house rules.'))); return; }
  const picks=new Set(results.map(x=>x.r.fileId));
  const card=h('div','card',
    h('div','row',h('h3','grow',results.length+' recipes would change'),
      el('button',{class:'btn pri',onclick:async()=>{
        let n=0; status('Applying…','busy');
        for(const x of results){
          if(!picks.has(x.r.fileId))continue;
          try{ const text=serializeRecipe(x.result);
            await Drive.write(x.r.fileId,text);
            Object.assign(x.r,parseRecipe(text,{id:x.r.fileId,name:x.r.fileName}));
            n++; status('Applying… '+n+'/'+results.length,'busy');
          }catch(e){ toast(x.r.name+': '+e.message); }
        }
        saveCache(); status('Applied to '+n+' recipes','good'); toast('Done — '+n+' rewritten.'); render();
      }},'Apply selected')));
  results.forEach(x=>{
    card.append(el('div',{style:'border-top:1px solid #26221c;padding-top:10px;margin-top:10px'},
      el('label',{class:'row',style:'cursor:pointer'},
        el('input',{type:'checkbox',checked:'checked',style:'width:auto',
          onchange:e=>{ e.target.checked?picks.add(x.r.fileId):picks.delete(x.r.fileId); }}),
        el('b',{class:'grow'},x.r.name),
        el('span',{class:'tiny dim'},x.changes.length+' edits')),
      changeList(x.changes)));
  });
  host.append(card);
}
function refactorOne(r){
