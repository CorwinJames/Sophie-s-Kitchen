  return Object.assign({},BK,{saltPct:d.salt,pff:d.pff,doughTemp:d.temp,
    startAt:BK.startAt?new Date(BK.startAt):null, outAt:BK.outAt?new Date(BK.outAt):null});
}

/* ---------- tiny form bits ----------
   These wrappers are <div>, deliberately, not <label>. A <label> with no
   "for" adopts its first labelable descendant as its control — and a
   <button> is labelable. Wrapping the row in a label therefore made the
   minus button light up when the mouse crossed the empty space beside the
   text, and a click on that empty space would have fired it. The text is
   now its own <label for=…> pointing at the input, which is what we
   actually wanted: click the words, land in the box.
   ------------------------------------------------------------------- */
let _fldSeq=0;
const nextFldId=()=>'fld'+(++_fldSeq);

/* The shared stepper. The browser's own arrows sit on top of the digits
   and are a two-pixel target; these are ours. They repeat when held, and
   they survive a recalculation because the controls are never rebuilt. */
function stepper(inp,opts){
  opts=opts||{};
  const step=parseFloat(opts.step||'1')||1;
  const dec=(String(opts.step||'1').split('.')[1]||'').length;
  const bump=dir=>{
    let n=parseFloat(inp.value);
    if(!isFinite(n))n=parseFloat(opts.ph)||0;
    n=n+dir*step;
    if(opts.min!=null)n=Math.max(opts.min,n);
    if(opts.max!=null)n=Math.min(opts.max,n);
    n=parseFloat(n.toFixed(dec));
    if(String(n)===String(inp.value))return;
    inp.value=n;
    if(opts.onstep)opts.onstep(n);
  };
  const hold=(btn,dir)=>{
    let t=null,r=null;
    const stop=()=>{ clearTimeout(t); clearInterval(r); t=r=null; };
    btn.addEventListener('mousedown',e=>{ if(e.button!==0)return; e.preventDefault(); bump(dir);
      t=setTimeout(()=>{ r=setInterval(()=>bump(dir),90); },450); });
    ['mouseup','mouseleave','blur'].forEach(ev=>btn.addEventListener(ev,stop));
    btn.addEventListener('click',e=>e.preventDefault());
    btn.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); bump(dir); } });
    return btn;
  };
  const dn=hold(el('button',{class:'stp',type:'button',tabindex:'-1','aria-label':'decrease '+(opts.label||'value')},'−'),-1);
  const up=hold(el('button',{class:'stp',type:'button',tabindex:'-1','aria-label':'increase '+(opts.label||'value')},'+'),1);
  return h('div','numwrap'+(opts.tight?' tight':''),dn,inp,up);
}

function fieldNum(label,val,onch,opts){
  opts=opts||{};
  const id=opts.id||nextFldId();
  const inp=el('input',{type:'number',id:id,value:val==null?'':val,step:opts.step||'1',
    min:opts.min==null?null:opts.min,max:opts.max==null?null:opts.max,
    placeholder:opts.ph||'',
    onchange:e=>onch(e.target.value===''?null:parseFloat(e.target.value))});
  const wrap=stepper(inp,Object.assign({},opts,{label:label,onstep:onch}));
  return h('div','fld',el('label',{class:'fldl',for:id},label),wrap,
    opts.suffix?h('span','fldu',opts.suffix):null);
}
function fieldSel(label,val,options,onch){
  const id=nextFldId();
  const s=el('select',{id:id,onchange:e=>onch(e.target.value)});
  options.forEach(([v,t])=>s.append(el('option',{value:v,selected:v===val?'selected':null},t)));
  return h('div','fld',el('label',{class:'fldl',for:id},label),s);
}
function fieldTime(label,val,onch){
  const id=nextFldId();
  const v=val?isoLocal(new Date(val)):'';
  const inp=el('input',{type:'datetime-local',id:id,value:v,
    onchange:e=>onch(e.target.value?new Date(e.target.value).toISOString():null)});
  return h('div','fld',el('label',{class:'fldl',for:id},label),inp);
}
function isoLocal(d){
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function tierChip(key){
  const c=CITE[key]; if(!c)return null;
  const cls='tier t-'+c.k.replace(/[^a-z]/gi,'').toLowerCase();
  return el('span',{class:cls,title:c.s+(c.flag?' — '+c.flag:'')},c.k);
}
function why(key,text){
  const c=CITE[key];
  return h('div','why',text?h('span',null,text+' '):null,tierChip(key),
    c?h('div','src',c.s+(c.flag?'  ⚠ '+c.flag:'')):null);
}

/* ---------- the tab ---------- */
function viewBake(){
  const wrap=h('div');
  const subs=[['calc','Calculator'],['adapt','Someone else’s recipe'],['flours','Flours'],['evidence','What this is built on']];
  const bar=h('div','subbar');
  subs.forEach(([id,t])=>bar.append(el('button',{class:BK.sub===id?'on':'',onclick:()=>bkSet('sub',id)},t)));
  wrap.append(bar);
  if(BK.sub==='adapt')     wrap.append(viewBakeAdapt());
  else if(BK.sub==='flours')wrap.append(viewBakeFlours());
  else if(BK.sub==='evidence')wrap.append(viewBakeEvidence());
  else wrap.append(viewBakeCalc());
  return wrap;
}

function bkRender(){
  /* Full redraw, but do not throw the reader out of their place. Keeping
     the scroll position and the caret is the difference between a form
     you can nudge and a form that fights you. */
  const a=document.activeElement, id=a&&a.id?a.id:null;
  let pos=null; try{ pos=a&&a.selectionStart; }catch(e){}
  const y=window.scrollY;
  const side=document.querySelector('.bakeside'), sy=side?side.scrollTop:0;
  render();
  window.scrollTo(0,y);
  const s2=document.querySelector('.bakeside'); if(s2)s2.scrollTop=sy;
  if(id){ const n=document.getElementById(id);
    if(n){ n.focus(); if(pos!=null){ try{ n.setSelectionRange(pos,pos); }catch(e){} } } }
}
/* Nudging a number redraws only the answer. The controls are never
   rebuilt, so the spinner arrows keep working and nothing moves. */
function refreshBake(){
  const host=document.getElementById('bakeOut');
  if(!host){ bkRender(); return; }
  let R; try{ R=solveBake(bkInput()); }catch(e){ return; }
  const y=window.scrollY;
  host.innerHTML='';
  bakeAnswer(R).forEach(n=>host.append(n));
  window.scrollTo(0,y);
  const dt=document.getElementById('bkDoughTemp');
  if(dt&&BK.doughTempAuto)dt.value=fx(bkDefaults().temp,1);
  const af=document.getElementById('bkAmbF');
  if(af)af.textContent=fx((+BK.ambientC||20)*9/5+32,0)+' °F';
}
function bkNum(k,v){ BK[k]=v; bkSave(); refreshBake(); }
function hint(t){ return h('p','hint',t); }

function viewBakeCalc(){
  const wrap=h('div','bakelayout');
  const st=styleById(BK.styleId);
  let R;
  try{ R=solveBake(bkInput()); }
  catch(e){ return h('div','card',h('p','err','The calculator fell over: '+e.message)); }
  const d=bkDefaults();

  /* ================= left: the controls ================= */
  const side=h('div','bakeside');

  const c1=h('div','card');
  c1.append(h('h2',null,'What are you making'));
  c1.append(fieldSel('Bread',BK.styleId,STYLES.map(s=>[s.id,s.name]),v=>{
    BK.styleId=v; BK.saltPct=null; BK.pff=null; BK.hydration=null; BK.hydrationLocked=false; bkSave(); bkRender();
  }));
  c1.append(h('p','muted',st.blurb));
  c1.append(fieldSel('When',BK.path,PATHS.map(p=>[p.id,p.name]),v=>{ BK.path=v; bkSave(); bkRender(); }));
  c1.append(h('p','muted',(PATHS.find(p=>p.id===BK.path)||{}).blurb||''));
  if(BK.path==='retard')c1.append(fieldNum('Hours in the fridge',BK.retardHours,v=>bkNum('retardHours',v),{suffix:'h',min:1,max:72,id:'bkRetard'}));
  c1.append(fieldNum('Total flour',BK.flourGrams,v=>bkNum('flourGrams',v),{suffix:'g',step:'50',min:100,id:'bkFlourG'}));
  c1.append(hint('Everything else is worked out as a percentage of this, so this is the only number that sets the size of the batch. 900 g makes two good loaves.'));
  side.append(c1);

  /* flour blend */
  const c2=h('div','card');
  c2.append(h('h2',null,'Flour blend'));
  const names=(S.flours||[]).map(f=>f.name);
  BK.blend.forEach((b,i)=>{
    const row=h('div','blendrow');
    const sel=el('select',{class:'fname',onchange:e=>{ BK.blend[i].flour=e.target.value; bkSave(); bkRender(); }});
    const opts=names.includes(b.flour)?names:names.concat([b.flour]);
    opts.forEach(n=>sel.append(el('option',{value:n,selected:n===b.flour?'selected':null},n)));
    row.append(sel);
    const setPct=v=>{ BK.blend[i].pct=isFinite(v)?v:0; bkSave(); refreshBake(); pctNote(); };
    const inp=el('input',{type:'number',class:'pctin',value:b.pct,min:0,max:100,step:'5',
      onchange:e=>setPct(parseFloat(e.target.value))});
    const foot=h('div','blendfoot',
      stepper(inp,{step:'5',min:0,max:100,tight:true,label:b.flour+' share',onstep:setPct}),
      h('span','fldu','%'),
      el('button',{class:'x',title:'Remove '+b.flour,
        onclick:()=>{ BK.blend.splice(i,1); bkSave(); bkRender(); }},'×'));
    row.append(foot);
    const g=flourGuide(b.flour);
    if(!g.base){
      row.append(h('div','hint',
        (g.suggest!=null?('Try '+fx(g.suggest,0)+'%'+(g.max!=null?(', up to '+fx(g.max,0)+'%'):', no published ceiling')+'. '):'')
        +g.why));
    }
    c2.append(row);
  });
  /* the total updates in place so nudging a share never redraws the row
     you are still holding the mouse over */
  function pctNote(){
    const n=document.getElementById('bkBlendTot');
    if(!n)return;
    const t=BK.blend.reduce((a,b)=>a+(+b.pct||0),0);
    n.className=Math.round(t)===100?'muted':'warnline';
    n.textContent=Math.round(t)===100?'100% of the flour.'
      :'Adds up to '+fx(t,0)+'%. The shares get normalised, so it still works — 100 is just easier to read.';
  }
  const tot=BK.blend.reduce((a,b)=>a+(+b.pct||0),0);
  c2.append(el('p',{id:'bkBlendTot',class:Math.round(tot)===100?'muted':'warnline'},
    Math.round(tot)===100?'100% of the flour.'
      :'Adds up to '+fx(tot,0)+'%. The shares get normalised, so it still works — 100 is just easier to read.'));
  const sug=suggestedBlend(BK.blend);
  const differs=sug.some((s,i)=>Math.abs(s.pct-(+BK.blend[i].pct||0))>0.5);
  if(differs)c2.append(el('button',{class:'btn',onclick:()=>{
    BK.blend=suggestedBlend(BK.blend); bkSave(); bkRender();
  }},'Use suggested shares — '+sug.map(s=>fx(s.pct,0)+'%').join(' / ')));
  c2.append(el('button',{class:'btn',onclick:()=>{ BK.blend.push({flour:names[0]||'Bread flour',pct:10}); bkSave(); bkRender(); }},'Add a flour'));
  blendVerdict(BK.blend).forEach(n=>c2.append(h('div',n.level==='hard'?'alert hard':'alert soft',
    h('div',null,n.t), n.c?tierChip(n.c):null)));
  side.append(c2);

  /* conditions */
  const c3=h('div','card');
  c3.append(h('h2',null,'Your kitchen right now'));
  c3.append(fieldNum('Room temperature',BK.ambientC,v=>{
    BK.ambientC=v; bkSave(); refreshBake();
  },{suffix:'°C',step:'0.5',id:'bkAmbient'}));
  c3.append(h('p','muted',el('span',{id:'bkAmbF'},fx((+BK.ambientC||20)*9/5+32,0)+' °F'),
    ' — this is the single biggest lever in the whole calculator. Port Townsend indoors runs about 18–21 °C in August, nearer 15 in February.'));
  c3.append(fieldNum('Dough temperature',round1(d.temp),v=>{
    BK.doughTemp=v; BK.doughTempAuto=(v==null); bkSave(); bkRender();
  },{suffix:'°C',step:'0.5',id:'bkDoughTemp'}));
  c3.append(hint(BK.doughTempAuto
    ? 'Following your room temperature plus 2 °C, which is roughly where dough lands after mixing. Type over it if you measure something different — and you should measure, once, with a probe.'
    : 'You set this by hand. Clear the box to go back to following the room.'));
  const pbox=el('input',{type:'checkbox',checked:BK.useProofBox?'checked':null,
    onchange:e=>{ BK.useProofBox=e.target.checked; bkSave(); bkRender(); }});
  c3.append(h('label','chk',pbox,h('span',null,'Use the oven’s proof setting for the final proof')));
  if(BK.useProofBox){
    c3.append(fieldNum('Proof box temperature',BK.proofBoxTemp,v=>bkNum('proofBoxTemp',v),{suffix:'°C',step:'1',id:'bkProofT'}));
    if((+BK.proofBoxTemp||27)>30) c3.append(h('p','warnline','Most ovens hold their proof setting near 38 °C, which is past the yeast’s ceiling for useful work and well into the bacteria’s range — you get acid instead of lift. If yours runs that hot, prop the door open.'));
    c3.append(why('ganzle','Yeast peaks at 27 °C and stops at 36; the bacteria peak at 32–33 and run to 41. Warming the proof past 28 buys sourness, not rise.'));
  }
  side.append(c3);

  /* levain + salt */
  const c4=h('div','card');
  c4.append(h('h2',null,'Levain and salt'));
  c4.append(h('p','muted','If you are not sure, leave all four of these alone. They are already set to sensible values for '+st.name.toLowerCase()+'.'));
  c4.append(fieldSel('Leavening',BK.leaven,[['sourdough','Sourdough starter'],['yeast','Commercial yeast']],v=>{ BK.leaven=v; bkSave(); bkRender(); }));
  c4.append(fieldNum('Starter in the dough',round1(d.pff),v=>bkNum('pff',v),{suffix:'%',step:'1',id:'bkPff'}));
  c4.append(hint('The share of your flour that goes through the starter first — '+fx(d.pff,0)+'% of '+fx(BK.flourGrams,0)+' g is '+fx(BK.flourGrams*d.pff/100,0)+' g of flour in the levain, which at '+fx(BK.levainHydration,0)+'% hydration means '+fx(BK.flourGrams*d.pff/100*(1+BK.levainHydration/100),0)+' g of ripe starter. More is faster and more sour, less is slower and milder. Tick “Lock the schedule” below and the calculator picks this for you.'));
  c4.append(fieldNum('Starter hydration',BK.levainHydration,v=>bkNum('levainHydration',v),{suffix:'%',step:'10',id:'bkLevHyd'}));
  c4.append(hint('How wet your starter is. Feed it equal weights of flour and water and it is 100% — that is the usual, and the right answer if you have never thought about it.'));
  c4.append(fieldNum('Salt',round1(d.salt),v=>bkNum('saltPct',v),{suffix:'%',step:'0.1',id:'bkSalt'}));
  c4.append(hint('2% of the flour weight is the convention, and it is only a convention — there is no published optimum. Below about 1.5% the dough goes slack and ferments faster than you expect; above 2.5% it drags and tastes salty. '+fx(BK.flourGrams*d.salt/100,0)+' g here.'));
  c4.append(fieldNum('Flour cooked into a scald',BK.scaldPct,v=>bkNum('scaldPct',v),{suffix:'%',step:'1',min:0,max:30,id:'bkScald'}));
  c4.append(hint('Leave at 0 unless you are doing tangzhong. Cooking a little of the flour with water first lets the dough carry more water and stay soft — measured +20% loaf volume and −35% crumb hardness at 6%.'));
  side.append(c4);

  /* anchor */
  const c5=h('div','card');
  c5.append(h('h2',null,'Your hydration anchor'));
  c5.append(h('p','muted','This is the one thing the calculator genuinely cannot work out for you. No conversion from lab water-absorption to real sourdough hydration has ever been published, so an absolute number would be invented. Instead it starts from a hydration you already know and adjusts from there.'));
  c5.append(fieldNum('A hydration that works for you',BK.anchorHydration,v=>bkNum('anchorHydration',v),{suffix:'%',step:'1',id:'bkAnchorH'}));
  c5.append(fieldNum('…on flour of this protein',BK.anchorProtein,v=>bkNum('anchorProtein',v),{suffix:'%',step:'0.1',id:'bkAnchorP'}));
  c5.append(hint('Not sure? Leave them. 70% water on 11.3% protein bread flour is an ordinary loaf at a hydration most hands can manage. After a bake you liked, come back and enter what you actually used and the protein off that bag — from then on every prediction here is calibrated to your flour, your kitchen and your hands.'));
  side.append(c5);

  /* timing + locks */
  const c6=h('div','card');
  c6.append(h('h2',null,'Timing'));
  c6.append(fieldTime('Start mixing',BK.startAt,v=>{ BK.startAt=v; bkSave(); bkRender(); }));
  c6.append(fieldTime(BK.path==='freeze'?'Into the freezer by':'Out of the oven by',BK.outAt,v=>{ BK.outAt=v; bkSave(); bkRender(); }));
  const lockrow=h('div','lockrow');
  const mk=(k,label,note)=>{
    const cb=el('input',{type:'checkbox',checked:BK.locks[k]?'checked':null,
      onchange:e=>{ BK.locks[k]=e.target.checked; bkSave(); bkRender(); }});
    return h('label','chk',cb,h('span',null,label,note?h('em','dim',' '+note):null));
  };
  lockrow.append(mk('time','Lock the schedule','— work everything else around those two times'));
  lockrow.append(mk('pff','Lock the starter','— then the dough temperature moves instead'));
  lockrow.append(mk('temp','Lock the dough temperature',''));
  c6.append(lockrow);
  if(!BK.startAt||!BK.outAt) c6.append(h('p','muted','Fill in both times and tick “Lock the schedule”, and it will tell you how much starter to use to hit them.'));
  c6.append(el('button',{class:'btn',onclick:()=>{
    const now=new Date();
    BK.startAt=new Date(Math.ceil(now.getTime()/900000)*900000).toISOString();
    BK.outAt=new Date(new Date(BK.startAt).getTime()+(BK.path==='retard'?26:9)*3600000).toISOString();
    BK.locks.time=true; bkSave(); bkRender();
  }},'Start now, bake '+(BK.path==='retard'?'tomorrow':'today')));
  side.append(c6);

  /* the temperatures that feed the water sum */
  const c7=h('div','card');
  c7.append(h('h2',null,'For the water temperature'));
  c7.append(h('p','muted','You do not choose the water temperature — it gets worked out from these, and the answer is on the right. Everything the dough touches at mixing shares its heat with it.'));
  c7.append(fieldNum('Room',BK.roomTemp,v=>bkNum('roomTemp',v),{suffix:'°C',step:'0.5',id:'bkRoomT'}));
  c7.append(fieldNum('Flour',BK.flourTemp,v=>bkNum('flourTemp',v),{suffix:'°C',step:'0.5',id:'bkFlourT'}));
  c7.append(fieldNum('Starter',BK.levainTemp,v=>bkNum('levainTemp',v),{suffix:'°C',step:'0.5',id:'bkLevT'}));
  c7.append(hint('Flour sitting in the cupboard is at room temperature. Starter that has been out overnight is a degree or two warmer. If you have not measured, room temperature for all three is a fine first guess.'));
  c7.append(fieldNum('Friction factor',BK.frictionFactor,v=>bkNum('frictionFactor',v),{suffix:'°C',step:'0.5',id:'bkFF'}));
  c7.append(hint('How much your mixing warms the dough: about 1 °C by hand, 3 °C in a stand mixer. Measure your own once — mix a batch, probe the dough at the end, and if it came out 2 °C warmer than planned, add 2 to this number. It is a residual, not a constant, so it changes if you change mixer, batch size or mixing time.'));
  side.append(c7);

  wrap.append(side);

  /* ================= right: the answer ================= */
  const out=el('div',{id:'bakeOut',class:'bakemain'});
  bakeAnswer(R).forEach(n=>out.append(n));
  wrap.append(out);
  return wrap;
}

/* Everything that gets recomputed. Returns an array of cards so it can be
   dropped back into #bakeOut without touching the controls. */
function bakeAnswer(R){
  const st=R.style, out=[];

  if(R.warn.length){
    const w=h('div','card');
    R.warn.forEach(x=>{
      w.append(h('div',x.level==='hard'?'alert hard':'alert soft',
        h('div',null,x.t), tierChip(x.c),
        CITE[x.c]?h('div','src',CITE[x.c].s+(CITE[x.c].flag?'  ⚠ '+CITE[x.c].flag:'')):null));
    });
    out.push(w);
  }

  /* THE RECIPE — proportions on the left, method on the right, so you can
     look from one to the other without scrolling. The water temperature is
     part of the recipe, not a topic of its own. */
  const f=h('div','card');
  f.append(h('h2',null,st.name));
  const split=h('div','bakesplit');

  const left=h('div','bkcol');
  const tbl=h('table','formula');
  tbl.append(h('thead',null,h('tr',null,h('th',null,'Ingredient'),h('th','r','Baker\u2019s %'),h('th','r','Grams'))));
  const tb=h('tbody');
  R.rows.forEach(r2=>{
    tb.append(h('tr','k-'+r2.kind,h('td',null,r2.name),h('td','r',fx(r2.pct,1)+'%'),h('td','r',fx(r2.g,0)+' g')));
    if(r2.sub)tb.append(h('tr','subrow',el('td',{colspan:3},r2.sub)));
  });
  tbl.append(tb);
  tbl.append(h('tfoot',null,h('tr',null,h('td',null,'Dough'),h('td','r',''),h('td','r',fx(R.doughG,0)+' g'))));
  left.append(tbl);
  left.append(h('p','big',fx(R.hydration,1)+'% hydration'));
  left.append(h('p','tiny dim','Baker\u2019s percentages are all relative to the total flour, which is why they add up to past 100.'));
  left.append(h('div','watrow',
    h('div',null,h('div','tiny dim','Mix with water at'),
      h('div','wat',fx(R.waterTemp,0)+' \u00b0C  /  '+fx(R.waterTemp*9/5+32,0)+' \u00b0F')),
    h('div','tiny dim','to land the dough at '+fx(R.doughTemp,1)+' \u00b0C, which every time on the right assumes. Take its temperature after mixing — if it missed, the friction factor is wrong, not the arithmetic.')));
  if(R.waterTemp<4)left.append(h('div','alert soft','Below what a cold tap gives you — use ice water, or accept a warmer dough and let it re-time itself.'));
  if(R.waterTemp>50)left.append(h('div','alert soft','Water above about 50 \u00b0C kills yeast on contact. Warm the flour instead, or mix cooler and give it longer.'));

  const right=h('div','bkcol');
  right.append(h('h3',null,'Method'));
  if(R.solvedFor)right.append(h('p','tiny dim','You locked the clock, so the calculator solved for '+R.solvedFor+'.'));
  const timeline=h('div','timeline');
  R.steps.forEach(s=>{
    timeline.append(h('div','tstep',
      h('div','twhen',s.at?clockOf(s.at):''),
      h('div','tbody',
        h('div','tlabel',s.label,s.hours?h('span','tdur',hm(s.hours)):null),
        h('div','tdetail',s.detail))));
  });
  right.append(timeline);
  if(R.outOfOven)right.append(h('p','big',(R.path==='freeze'?'In the freezer ':'Out of the oven ')+clockOf(R.outOfOven)));
  if(R.finish&&R.outOfOven&&R.finish>R.outOfOven)right.append(h('p','tiny dim','Cool enough to cut at '+clockOf(R.finish)+'. Slicing it before then is what makes bread read as gummy.'));
  right.append(h('div','ovenline',h('b',null,'Oven: '),st.bake,h('div','tiny dim','Done at '+st.core+'.')));

  split.append(left,right);
  f.append(split);
  f.append(h('div','howto',
    h('h3',null,'What \u201c+'+fx(R.rTarget,0)+'%\u201d actually means'),
    h('p',null,'It is how much bigger the dough gets, by volume, during the bulk. +50% means half again as tall as when you mixed it; +100% means twice as tall. It is not a percentage of time, and it is not the same as \u201cdoubled\u201d unless it says 100.'),
    h('p',null,'Put the dough in a straight-sided container and mark the top of it the moment you finish mixing. A bowl will lie to you, because the sides slope. Or pull a small piece into a narrow jar and watch that instead.'),
    h('p',null,'The clock times are a prediction from your temperature. The mark on the jar is a measurement. When they disagree, believe the jar.'),
    h('p','muted','And note which way it runs: colder dough needs MORE rise, not less. At 27 \u00b0C you stop at +30%; at 18 \u00b0C you go to +100%.')));
  out.push(f);

  /* hydration reasoning */
  const hy=h('div','card');
  hy.append(h('h2',null,'Where that water number comes from'));
  hy.append(h('p','muted','Your anchor plus a delta for each thing about this blend that differs from it. Every line is a published coefficient; the chip says how much weight it will bear.'));
  const ht=h('table','deltas');
  ht.append(h('tbody',null,
    h('tr','anchor',h('td',null,'Your anchor'),h('td','r',fx(R.hyd.anchor,1)+'%'),h('td',null,'')),
    ...R.hyd.deltas.map(dd=>h('tr',null,
      h('td',null,dd.label),
      h('td','r',(dd.lo>=0?'+':'')+fx(dd.lo,1)+(Math.abs(dd.hi-dd.lo)>0.05?' to '+(dd.hi>=0?'+':'')+fx(dd.hi,1):'')+' pp'),
      h('td',null,tierChip(dd.cite)))),
    h('tr','tot',h('td',null,'Predicted'),h('td','r',fx(R.hyd.lo,1)+'–'+fx(R.hyd.hi,1)+'%'),h('td',null,''))
  ));
  hy.append(ht);
  hy.append(h('p','hint','“pp” is percentage points — a change to the hydration number itself, not a percentage of it.'));
  R.hyd.deltas.filter(dd=>dd.note).forEach(dd=>hy.append(h('p','muted',dd.note)));
  hy.append(h('div','alert soft','These deltas get added together because that is the only thing to do with them, but nobody has tested whether they really are additive. Treat the top of the range as a ceiling: hold back the last 3–5% of the water and add it at the mixer only if the dough takes it.'));
  hy.append(why('aaccfar','Lab absorption is measured with no salt, no leaven, no acid and no rest — none of which describes your dough. A ±3% error either way visibly degrades the mix, which is why the hold-back matters.'));
  const lockH=el('input',{type:'checkbox',checked:BK.hydrationLocked?'checked':null,
    onchange:e=>{ BK.hydrationLocked=e.target.checked; if(e.target.checked&&BK.hydration==null)BK.hydration=round1(R.hyd.target); bkSave(); bkRender(); }});
  hy.append(h('label','chk',lockH,h('span',null,'Ignore that and use my own hydration')));
  if(BK.hydrationLocked)hy.append(fieldNum('Hydration',BK.hydration,v=>bkNum('hydration',v),{suffix:'%',step:'1',id:'bkHydOverride'}));
  out.push(hy);

  /* fermentation reasoning */
  const fm=h('div','card');
  fm.append(h('h2',null,'Where the times come from'));
  fm.append(h('table','deltas',h('tbody',null,
    h('tr',null,h('td',null,'Dough temperature'),h('td','r',fx(R.doughTemp,1)+' °C'),h('td',null,'')),
    h('tr',null,h('td',null,'Published bulk window at that temperature'),h('td','r',hm(R.matrix.lo)+'–'+hm(R.matrix.hi)),h('td',null,tierChip('cucuzza'))),
    h('tr',null,h('td',null,'Rise target at that temperature'),h('td','r','+'+fx(R.rTarget,0)+'% volume'),h('td',null,tierChip('cucuzza'))),
    h('tr',null,h('td',null,'Your starter vs the calibration’s 9.1%'),h('td','r',fx(R.pff,1)+'%'),h('td',null,tierChip('ganzle'))),
    h('tr',null,h('td',null,'Hydration effect on gas'),h('td','r','×'+fx(hydrationRateFactor(R.hydration,R.hyd.target),2)),h('td',null,tierChip('codina'))),
    h('tr',null,h('td',null,'Enrichment'),h('td','r','×'+fx(R.enrich,2)),h('td',null,tierChip('craft'))),
    R.retardH?h('tr',null,h('td',null,'Rise the fridge adds by itself'),h('td','r','+'+fx(R.rRetard,0)+'%'),h('td',null,tierChip('cucuzza'))):null,
    h('tr','tot',h('td',null,'Bulk'),h('td','r',hm(R.bulk)),h('td',null,''))
  )));
  fm.append(h('div','alert soft','That temperature-to-rise table is one practitioner’s data from one calibration formula: 90% bread flour with 10% whole wheat, 75% hydration, 20% starter, 2% salt. No controlled peer-reviewed trial of % rise as a bulk endpoint exists at all. It is still the best published thing, and far better than a recipe saying “2 hours” without saying at what temperature — but it is a single source, so recalibrate it against your own bakes.'));
  fm.append(why('cucuzza','27 °C → +30% in 3–5½ h. 24 °C → +50% in 5–7 h. 21 °C → +75% in 8–12 h. 18 °C → +100% in 12–18 h.'));
  fm.append(why('ganzle','Moving off that 20% starter uses the yeast’s published growth rate through a cardinal-temperature model — halving the starter costs about ln(2)/µ hours. That inference is mine, from their measured constants; it has not been validated against actual dough rise.'));
  fm.append(why('codina','Gas production measured 1270 cm³ at 51.4% water, 1410 at the lab optimum, 1433 above it. A drier dough really is a slower dough — about 1.7% less gas per point of water below optimum, and almost nothing gained above.'));
  out.push(fm);

  /* grain ceilings */
  if(R.limits.length){
    const gl=h('div','card');
    gl.append(h('h2',null,'How far you can push these grains'));
    R.limits.forEach(l=>{
      const box=h('div','limit'+(l.warn==='hard'?' hard':l.warn==='soft'?' soft':''));
      box.append(h('div','lhead',l.grain+(l.pct?' — '+fx(l.pct,0)+'%':''),tierChip(l.cite)));
      box.append(h('p',null,l.text));
      if(l.caveat)box.append(h('p','muted',l.caveat));
      if(l.protocol){ const ol=h('ol','proto'); l.protocol.forEach(s=>ol.append(h('li',null,s))); box.append(ol); }
      if(CITE[l.cite])box.append(h('div','src',CITE[l.cite].s+(CITE[l.cite].flag?'  ⚠ '+CITE[l.cite].flag:'')));
      gl.append(box);
    });
    out.push(gl);
  }

  /* the oven */
  const ov=h('div','card');
  ov.append(h('h2',null,'The oven'));
  ov.append(h('p',null,st.bake));
  R.oven.forEach(o=>ov.append(h('div','ovrow',h('div','lhead',o.t,tierChip(o.c)),h('div','ovv',o.v),h('p','muted',o.n))));
  ov.append(h('div','alert soft','There is no published oven temperature for any bread style anywhere in the evidence base — not one. The setting above is convention. The finish temperature is not: 93–99 °C is a physical endpoint, because the crumb cannot get past the boiling point of its own water while free water is still in there.'));
  out.push(ov);

  /* save */
  const sv=h('div','card');
  sv.append(h('h2',null,'Keep this one'));
  sv.append(h('p','muted','Saves to bakes.md in your Drive folder as plain text, so you can edit it there or pull it up on the other computer.'));
  const nm=el('input',{type:'text',class:'wide',placeholder:'e.g. Tuesday 30% Salish'});
  sv.append(nm);
  sv.append(el('button',{class:'btn pri',onclick:async()=>{
    const name=(nm.value||'').trim(); if(!name){ toast('Give it a name first.'); return; }
    const rec={name,style:BK.styleId,blend:BK.blend.slice(),flour:BK.flourGrams,
      hydration:round1(R.hydration),salt:R.rows.filter(x=>x.kind==='salt')[0].pct,
      pff:round1(R.pff),temp:round1(R.doughTemp),levainhyd:BK.levainHydration,
      anchor:BK.anchorHydration,anchorprotein:BK.anchorProtein,friction:BK.frictionFactor,
      path:BK.path,notes:''};
    S.bakes=(S.bakes||[]).filter(b=>norm(b.name)!==norm(name)).concat([rec]);
    bkRender();
    try{ await saveFile('bakes.md',serializeBakes(S.bakes)); toast('Saved.'); }
    catch(e){ toast('Saved here, but Drive said: '+e.message); }
  }},'Save this bake'));
  if((S.bakes||[]).length){
    const list=h('div','saved');
    S.bakes.forEach(b=>{
      list.append(h('div','savedrow',
        el('button',{class:'link',onclick:()=>{
          BK.styleId=b.style||BK.styleId;
          if(b.blend&&b.blend.length)BK.blend=b.blend.slice();
          if(b.flour)BK.flourGrams=b.flour;
          if(b.hydration){BK.hydration=b.hydration;BK.hydrationLocked=true;}
          if(b.salt)BK.saltPct=b.salt;
          if(b.pff)BK.pff=b.pff;
          if(b.temp){BK.doughTemp=b.temp;BK.doughTempAuto=false;}
          if(b.levainhyd)BK.levainHydration=b.levainhyd;
          if(b.anchor)BK.anchorHydration=b.anchor;
          if(b.anchorprotein)BK.anchorProtein=b.anchorprotein;
          if(b.path)BK.path=b.path;
          bkSave(); bkRender();
        }},b.name),
        h('span','muted',(b.blend||[]).map(x=>x.flour+' '+x.pct+'%').join(' · '))));
    });
    sv.append(list);
  }
  out.push(sv);
  return out;
}

  )));

      h('div','btaghead',h('code',null,t.tag),tierChip(t.c)),

      CITE[t.c]?h('div','src',CITE[t.c].s+(CITE[t.c].flag?'  ⚠ '+CITE[t.c].flag:'')):null));

  wrap.append(tg);
  return wrap;
}

/* ---------------- the evidence ---------------- */
function viewBakeEvidence(){
  const wrap=h('div');
  const c=h('div','card');
  c.append(h('h2',null,'What this calculator is built on'));
  c.append(h('p',null,'Every number in the bake tab traces to something published. The chips tell you which kind of something. That matters more than it sounds: a vendor spec sheet is a product target, a practitioner blog post is one person’s kitchen, and a peer-reviewed measurement is a measurement. The calculator will not pretend they weigh the same.'));
  const key=h('div','tierkey');
  [['PR','Peer-reviewed journal article. Strongest thing here.'],
   ['PR, derived','Computed from published data, not reported directly. The arithmetic is mine.'],
   ['STD','A standard method or official specification.'],
   ['BK','A published book.'],
   ['IND','An industry or institutional lab publication.'],
   ['PRAC','A named practitioner with data behind them.'],
   ['craft','Convention. Nobody has published a coefficient. Edit it freely.'],
   ['no data','The evidence base is silent. Said so rather than invented a number.']
  ].forEach(([k,t])=>key.append(h('div','tkrow',el('span',{class:'tier t-'+k.replace(/[^a-z]/gi,'').toLowerCase()},k),h('span',null,t))));
  c.append(key);
  wrap.append(c);

  const hon=h('div','card');
  hon.append(h('h2',null,'Where it is thin, and where the field disagrees'));
  [['The bulk matrix is one source.','The temperature-to-% rise table is Cucuzza’s, from a single calibration formula, and no controlled peer-reviewed trial of % rise as a bulk endpoint exists in any tier. It is still the best published thing that maps a dough temperature to a real bulk time.'],
   ['The bran coefficient rests on a paywalled chapter.','+0.55 hydration points per 1% bran is the most-reused number in the whole knowledge base, and its tables were never independently retrieved. Everything about whole-grain hydration and the whole-wheat ceiling leans on it.'],
   ['Bran per whole grain is disputed.','This uses 0.14. Roller-mill stream yields imply 0.21–0.27. Nothing reconciles them. At the higher figure your whole-wheat ceiling drops from about 54% to about 31%.'],
   ['Fine bran breaks the obvious explanation.','Alzuwaid 2021 found fine bran needed 1.0–1.4% LESS water while doing MORE volume damage — which falsifies "bran hurts by competing for water". Jacobs 2015 found absorption flat at 68.3 ± 0.4% across the whole particle-size range. Two peer-reviewed studies, opposite implications. Both are shown; neither is averaged away.'],
   ['Deltas are assumed additive.','Nobody has tested that. The sum is a ceiling, not a prediction.'],
   ['There is no data on enrichment.','No published coefficient exists for how butter, sugar, egg or milk change fermentation rate. The one study that would have covered it could not have its authorship confirmed and was dropped from the base. The enrichment multiplier here is craft convention with a plausible mechanism and nothing else.'],
   ['There is no data on freezing dough.','Nothing on yeast or bacterial survival through a freeze–thaw, nothing on thaw times, nothing on the effect on the first rise. The freeze schedule is entirely craft. Calibrate it once and write the number down.'],
   ['There is no proof-time data either.','No published final-proof duration for any style, and the poke test has never been validated in any tier. The proof number here is a fraction of an equivalent bulk.'],
   ['Salish Blue has no dataset at all.','No protein, ash, falling number, absorption, or loaf volume figure has ever been published for it. Its parent is tall wheatgrass, not intermediate wheatgrass, so Kernza data do not transfer. The test-bake ladder in the calculator is mine, not evidence.'],
   ['Kernza has two ceilings that do not agree.','45% with 15% optimal (peer-reviewed) versus 10–15% and flatbreads only (institutional). Both are shown.']
  ].forEach(([t,b])=>hon.append(h('div','honest',h('h3',null,t),h('p',null,b))));
  wrap.append(hon);

  const myth=h('div','card');
  myth.append(h('h2',null,'Four things everyone says that the data does not support'));
  [['“Warm fermentation makes it more sour.”','Acetate formation actually FELL at 35 °C. Warmth shifts the ratio of acid to gas, which is a different claim from raising total acid.'],
   ['“The fridge favours the bacteria, so a retard gets sourer.”','Below 26 °C the bacteria and the yeast grow at similar rates, and a domestic fridge takes 8–10 hours just to bring dough to 3 °C. What a retard mostly gives you is time, not selection.'],
   ['“Technique X opens the crumb.”','Gas cells cannot be created after mixing. Handling redistributes a population that already exists.'],
   ['“Modern wheat has more gluten than heritage wheat.”','A 120-year German cultivar series found protein and gliadin went DOWN while glutenin went up. Spelt has more gluten than common wheat, 111.6 vs 80.4 mg/g — what ancient wheats have is weaker gluten, not less of it.']
  ].forEach(([t,b])=>myth.append(h('div','honest',h('h3',null,t),h('p',null,b))));
  myth.append(h('p','muted','One that is NOT a myth: stiff levain really does read as more acetic. What is not established is why — firm and liquid propagation select different dominant species, so it may be species selection rather than water activity doing the work.'));
  wrap.append(myth);

  const src=h('div','card');
  src.append(h('h2',null,'Sources'));
  const ul=h('ul','srclist');
  Object.keys(CITE).filter(k=>k!=='craft'&&k!=='nodata').forEach(k=>{
    ul.append(h('li',null,tierChip(k),' ',CITE[k].s,CITE[k].flag?h('em','muted',' — '+CITE[k].flag):null));
  });
  src.append(ul);
  src.append(h('p','muted','Compiled August 2026. Where a figure could not be pulled from full text, it says so on the chip.'));
  wrap.append(src);
  return wrap;
}

/* Which ingredients you have crossed off, per recipe. Kept on this machine
   only — it never touches the recipe file in Drive, because "I am leaving
   the pork out tonight" is a decision about tonight, not about the recipe. */
let RX=LS.get('crossedOff',{});
const rxKey=r=>String(r.slug||r.name||'');
function rxOff(r){ return RX[rxKey(r)]||[]; }
function rxToggle(r,key){
  const k=rxKey(r); const cur=new Set(RX[k]||[]);
  cur.has(key)?cur.delete(key):cur.add(key);
  RX[k]=[...cur];
  if(!RX[k].length)delete RX[k];
  LS.set('crossedOff',RX);
}
function rxClear(r){ delete RX[rxKey(r)]; LS.set('crossedOff',RX); }

/* ---------- putting things on the list, and into the house ---------- */
function onList(name){
  return (S.grocery.need||[]).concat(S.grocery.manual||[]).some(x=>sameThing(x,name));
}
async function addToList(name){
  const n=String(name||'').trim(); if(!n)return;
  if(onList(n)){ toast(n+' is already on the list.'); return; }
  S.grocery.manual=(S.grocery.manual||[]).concat([n]);
  toast(n+' → shopping list');
  try{ await saveFile('grocery-list.md',serializeGrocery(S.grocery)); }
  catch(e){ toast('On the list here, but Drive said: '+e.message); }
}
async function markHave(name){
  const n=String(name||'').trim(); if(!n)return;
  const cat=categoryOf(n);
  let g=S.pantry.groups.find(x=>norm(x.name)===norm(cat))||S.pantry.groups.find(x=>/pantry|cupboard|staple/i.test(x.name))||S.pantry.groups[0];
  if(!g){ toast('No pantry sections yet — add one on the Groceries tab.'); return; }
  if(g.items.some(i=>sameThing(i.name,n))){ toast('Already in the house.'); return; }
  g.items.push({name:n,key:norm(n),level:'plenty',out:false,raw:'- '+n});
  S.grocery.manual=(S.grocery.manual||[]).filter(x=>!sameThing(x,n));
  toast(n+' → '+g.name);
  try{ await saveFile('pantry.md',serializePantry(S.pantry)); }
  catch(e){ toast('Saved here, but Drive said: '+e.message); }
}

/* ---------- the ingredient list on an open recipe ----------
   Hovering a line reveals two things you can do with it: put it on the
   shopping list, or cross it off. Crossing off is the interesting one —
   if the recipe also calls for something interchangeable, the amount moves
   there instead of just disappearing. */
function ingredientList(r,redraw){
  const off=rxOff(r);
  const {rows}=withDropped(r,off);
  const have=pantryHave(S.pantry);
  const ul=el('ul',{class:'clean ings'});
  rows.forEach(i=>{
    const free=isFree(i.item);
    const got=free||have.some(hh=>answers(hh.name,i.item));
    const li=el('li',{class:'ingrow'+(i._off?' dropped':'')});
    const label=el('span',{class:i.forScratch?'scratch':(i.sub?'subbed':(got||i._off?'':'miss'))},ingLine(i));
    li.append(label);

    if(i._off){
      li.append(el('span',{class:'tiny dim'},'  left out'));
    }else if(free){
      li.append(el('span',{class:'tiny dim'},'  from the tap'));
    }else if(got){
      /* say WHY we count it as had, when it is not the obvious reason */
      const exact=have.find(hh=>sameThing(hh.name,i.item));
      const via=exact?null:have.find(hh=>answers(hh.name,i.item));
      li.append(el('span',{class:'tiny dim'},via?'  have '+via.name:'  have'));
    }
    if(i._absorbed&&i._absorbed.length){
      li.append(el('span',{class:'tiny rolled'},'  +'+i._absorbed.map(a=>(a.qty?a.qty+' ':'')+(a.unit||'')+' of the '+a.from).join(', ')));
    }
    if(!i._off&&!got&&!free){
      const cls=classesFor(i.item);
      if(cls.length)li.append(el('span',{class:'tiny dim'},'  counts as '+cls[0]));
    }

    /* the hover controls. The shopping button is on EVERY line, not just the
       ones we are short of — leaving something out of tonight's cooking is
       the moment you most want to buy it for next time, and "we have it but
       barely" is just as good a reason. Only water and its like are exempt,
       since you are never going to buy those. */
    const acts=el('span',{class:'ingacts'});
    if(!free){
      if(onList(i.item)){
        acts.append(el('span',{class:'ia listed',title:i.item+' is already on the shopping list'},'on list'));
      }else{
        acts.append(el('button',{class:'ia',
          title:i._off?'Leaving it out tonight — put '+i.item+' on the list for next time'
                      :'Put '+i.item+' on the shopping list',
          onclick:async e=>{ e.stopPropagation(); await addToList(i.item); redraw&&redraw(); }},'+ list'));
      }
    }
    if(i.key){
      const partner=i._off?null:absorbTarget({ingredients:rows.filter(x=>!x._off&&!x._absorbedFrom)},i);
      acts.append(el('button',{class:'ia',
        title:i._off?'Put '+i.item+' back'
             :(partner?'Leave it out — its '+(i.qty||'amount')+' '+(i.unit||'')+' goes onto the '+partner.item
                      :'Leave '+i.item+' out'),
        onclick:e=>{ e.stopPropagation(); rxToggle(r,i.key); redraw&&redraw(); }},
        i._off?'put back':(partner?'× → '+partner.item:'×')));
    }
    li.append(acts);
    ul.append(li);
  });
  return ul;
}
function ingredientPanel(r,redraw){
  const box=h('div',null,h('h3',null,'Ingredients'),ingredientList(r,redraw));
  const off=rxOff(r);
  if(off.length){
    box.append(el('div',{class:'tiny dim rxnote'},
      off.length+' left out. ',
      el('button',{class:'link',onclick:()=>{ rxClear(r); redraw&&redraw(); }},'put everything back')));
  }
  return box;
}

/* ---------- the shopping repertoire in the Cook sidebar ---------- */
function renderCouldGet(){
  const host=document.getElementById('couldGet');
  if(!host)return;
  host.innerHTML='';
  const groups=couldGetGrouped();
  const total=groups.reduce((a,g)=>a+g.items.length,0);
  const q=(UI.getFind||'').trim().toLowerCase();

  host.append(el('div',{class:'sidehead'},
    el('button',{class:'disc'+(UI.getOpen?' on':''),onclick:()=>{ UI.getOpen=!UI.getOpen; LS.set('getOpen',UI.getOpen); renderCouldGet(); }},
      (UI.getOpen?'▾ ':'▸ ')+'Could get'),
    h('span','n tiny dim',total+'')));
  if(!UI.getOpen){
    host.append(h('p','tiny dim','Everything your recipes call for that is neither in the house nor on the list.'));
    return;
  }
  host.append(el('input',{type:'text',class:'sidefind',placeholder:'find something to buy',
    value:UI.getFind||'',
    oninput:e=>{UI.getFind=e.target.value;renderCouldGet();}}));
  host.append(h('p','tiny dim','Sorted the same way as the house. Click to put it on the list; the tick says you already have it.'));

  let shown=0;
  groups.forEach(g=>{
    const items=g.items.filter(x=>!q||x.name.toLowerCase().includes(q));
    if(!items.length)return;
    const box=h('div','pgroup');
    box.append(h('div','glabel tiny dim',g.name));
    items.slice(0,q?200:40).forEach(x=>{
      shown++;
      const row=el('div',{class:'pitem getitem',title:x.n+' recipe'+(x.n===1?'':'s')+': '+x.recipes.slice(0,5).join(', ')+(x.n>5?'…':'')});
      row.append(el('span',{class:'nm'},x.name));
      row.append(el('span',{class:'tiny dim ct'},x.n>1?String(x.n):''));
      row.append(el('button',{class:'ia',title:'Put '+x.name+' on the shopping list',
        onclick:async e=>{ e.stopPropagation(); await addToList(x.name); renderCouldGet(); renderPantrySide(); refreshMatches(); }},'+'));
      row.append(el('button',{class:'ia',title:'We actually have '+x.name,
        onclick:async e=>{ e.stopPropagation(); await markHave(x.name); renderCouldGet(); renderPantrySide(); refreshMatches(); }},'✓'));
      box.append(row);
    });
    if(!q&&g.items.length>40)box.append(h('div','tiny dim','…and '+(g.items.length-40)+' more — use the find box'));
    host.append(box);
  });
  if(!shown)host.append(h('p','tiny dim','Nothing matches.'));
}
/* ---------------- boot ---------------- */
$('#btnSync').addEventListener('click',async()=>{ await syncAll(); render(); });
$('#btnSignin').addEventListener('click',async()=>{
  try{ await Drive.auth(true); await syncAll(); render(); }catch(e){ toast(e.message); }
});

async function boot(){
  renderNav();
  seedBakeData();
  if(UI.scanMode)document.querySelector('header').classList.add('hide');
  const cached=loadCache();
  render();
  if(cached) status('Showing the last synced copy…','');
  const url=new URL(location.href);
  if(url.searchParams.get('client_id')) LS.set('clientId',url.searchParams.get('client_id'));
  let tries=0;
  while(!(window.google&&google.accounts)&&tries<40){ await new Promise(r=>setTimeout(r,150)); tries++; }
  if(!Drive.clientId()){ status('Needs a one-time setup — open Settings','err'); $('#btnSignin').classList.remove('hide'); render(); return; }
  if(!Drive.init()){ status('Google sign-in did not load. Are you offline?','err'); return; }
  try{
    await Drive.auth(false);
    await syncAll();
  }catch(e){
    status('Tap Connect Drive to sign in','');
    $('#btnSignin').classList.remove('hide');
  }
  render();
}
boot();
