/* ---------- what can we cook ---------- */
function haveKeys(extra){
  const keys=pantryHave(S.pantry).map(i=>i.key);
  return uniq(keys.concat(extra||[]));
}
function findSub(missingItem){
  // house rule says "their thing -> our thing"; if we have our thing, suggest it
  const have=pantryHave(S.pantry);
  for(const sw of S.rules.swap){
    if(sameThing(sw.from,missingItem)){
      const target=sw.to.split(',')[0];
      if(have.some(h=>sameThing(h.name,target))) return {to:sw.to,dir:'rule'};
    }
    if(sameThing(sw.to,missingItem) && have.some(h=>sameThing(h.name,sw.from))) return {to:sw.from,dir:'reverse'};
  }
  return null;
}
/* ============================================================
   THINGS WE MAKE RATHER THAN BUY
   A recipe with "makes: chicken stock" in its header doesn't just feed you —
   it produces a pantry ingredient. So having the bones counts as having the
   stock, and any recipe calling for stock can fold the stock-making into it.
   Never a rule, always a fallback: if the jar is in the cupboard, use the jar.
   ============================================================ */
function componentFor(item){
  if(!item)return null;
  return S.recipes.find(r=>r.meta.makes && sameThing(r.meta.makes,item))||null;
}
function inPantry(item){ return pantryHave(S.pantry).some(h=>satisfies(h.name,item)); }
/* can we produce this from what is in the house right now? depth-limited, so
   two recipes that quote each other cannot spin forever */
function canMake(item,depth,seen){
  depth = depth==null?2:depth;
  seen = seen||new Set();
  if(depth<0)return null;
  const key=norm(item);
  if(seen.has(key))return null;
  seen.add(key);
  const c=componentFor(item);
  if(!c)return null;
  for(const i of c.ingredients){
    if(!i.key||negligible(i))continue;
    if(inPantry(i.item))continue;
    if(canMake(i.item,depth-1,new Set(seen)))continue;
    return null;
  }
  return {recipe:c,item};
}
/* everything this recipe needs that we would have to make first */
function scratchPlan(r){
  const out=[];
  r.ingredients.forEach(i=>{
    if(!i.key||negligible(i)||inPantry(i.item))return;
    const c=canMake(i.item);
    if(c && !out.some(x=>sameThing(x.item,i.item)))out.push(c);
  });
  return out;
}

function scoreRecipe(r,selected,have){
  const hv=have||haveKeys();
  const sel=(selected||[]).map(norm).filter(Boolean);
  let matched=0,usedSel=0;
  const missing=[];
  const scratch=[];
  r.ingredients.forEach(i=>{
    if(!i.key)return;
    const inSel=sel.some(s=>satisfies(s,i.item));
    const held=hv.some(k=>satisfies(k,i.item));
    if(inSel)usedSel++;
    if(inSel||held){ matched++; return; }
    const mk=canMake(i.item);          // don't have it, but could make it
    if(mk){ matched++; scratch.push(mk); return; }
    missing.push(i);
  });
  const total=r.ingredients.filter(i=>i.key).length||1;
  const selHits=sel.filter(s=>r.ingredients.some(i=>sameThing(s,i.item))).length;
  const coverage=matched/total;
  const rating=parseFloat(r.meta.rating||0)||0;
  const never=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
  const subs=missing.map(m=>({ing:m,sub:findSub(m.item)}));
  const shoppable=subs.filter(s=>!s.sub).length;
  let score = coverage*100 + selHits*40 - shoppable*7 + rating*2 - scratch.length*4;
  if(sel.length && selHits<sel.length) score -= (sel.length-selHits)*35;
  return {recipe:r,coverage,matched,total,missing,subs,selHits,never,scratch,score};
}
/* ---------- search ----------
   "beef" should find the short ribs. "short ribs" should not find every
   beef recipe. So: exact and substring matches always count, and a
   family name additionally matches anything in that family. */
function searchScore(r,q){
  const raw=String(q||'').trim().toLowerCase();
  if(!raw)return 1;
  const nq=norm(raw);
  let s=0;
  const name=r.name.toLowerCase();
  if(name===raw)s+=100;
  else if(name.includes(raw))s+=60;
  if(r.tags.some(t=>t.toLowerCase()===raw))s+=40;
  else if(r.tags.some(t=>t.toLowerCase().includes(raw)))s+=15;
  r.ingredients.forEach(i=>{
    if(sameThing(i.item,raw))s+=45;                       // "short ribs" -> the short rib recipe
    else if(i.item.toLowerCase().includes(raw))s+=25;
    else if(nq && norm(i.item).includes(nq))s+=20;
  });
  if(FAMILY[nq]){                                          // "beef" -> chuck, short ribs, brisket…
    const hit=r.ingredients.some(i=>familyOf(i.item)===nq);
    if(hit)s+=35;
    if(r.tags.some(t=>norm(t)===nq))s+=10;
  }
  if(r.steps.join(' ').toLowerCase().includes(raw))s+=5;
  if((r.notes||'').toLowerCase().includes(raw))s+=3;
  return s;
}
function rankRecipes(selected,opts={}){
  const have=haveKeys();
  let list=S.recipes.map(r=>scoreRecipe(r,selected,have));
  if(opts.tag) list=list.filter(x=>x.recipe.tags.some(t=>t.toLowerCase().includes(opts.tag.toLowerCase())));
  if(opts.q && opts.q.trim()){
    list=list.map(x=>Object.assign(x,{search:searchScore(x.recipe,opts.q)}))
             .filter(x=>x.search>0)
             .map(x=>Object.assign(x,{score:x.score+x.search*3}));
  }
  if(opts.maxMissing!=null) list=list.filter(x=>x.missing.filter(m=>!findSub(m.item)).length<=opts.maxMissing);
  list.sort((a,b)=>b.score-a.score);
  return list;
}
/* recipes we could put on the table right now with nothing bought */
function cookableNow(){ return rankRecipes([]).filter(x=>x.missing.length===0); }
/* …and the ones a house substitution would rescue */
function cookableWithSwaps(){
  return rankRecipes([]).filter(x=>x.missing.length>0
    && x.missing.every(m=>findSub(m.item)||isDroppable(m.item)));
}
function isDroppable(item){
  const raw=String(item||'').toLowerCase().trim();
  const n=norm(item);
  if(!raw)return false;
  return (S.rules.drop||[]).some(d=>{
    const dr=String(d).toLowerCase().trim();
    if(!dr)return false;
    if(raw.includes(dr))return true;                 // "garnish" normalises to nothing, so match raw too
    const dn=norm(d);
    return !!dn && (sameThing(d,item)||(!!n&&n.includes(dn)));
  });
}

/* ============================================================
   COST — what a meal actually costs, from what we actually paid
   It refuses to guess. If we have never bought a thing, or bought it
   in units that cannot be converted, it says so rather than inventing
   a number and quietly making every total wrong.
   ============================================================ */
function priceHistory(item){
  return (S.prices.buy||[]).filter(b=>sameThing(b.item,item))
    .slice().sort((a,b)=>b.date.localeCompare(a.date));
}
/* the most recent price, expressed per base unit (per g, per ml, per one) */
function unitPrice(item){
  const hist=priceHistory(item);
  for(const b of hist){
    const base=toBase(b.qty||'1',b.unit||'');
    if(!base||!base.n)continue;
    return {per:b.price/base.n,fam:base.fam,paid:b.price,on:b.date,store:b.store,
      amount:[b.qty,b.unit].filter(Boolean).join(' ')||'1'};
  }
  return null;
}
function bestPrice(item){
  const hist=priceHistory(item);
  let best=null;
  hist.forEach(b=>{
    const base=toBase(b.qty||'1',b.unit||'');
    if(!base||!base.n)return;
    const per=b.price/base.n;
    if(!best||per<best.per)best={per,fam:base.fam,paid:b.price,on:b.date,store:b.store};
  });
  return best;
}
/* seasonings used by the pinch are not worth pricing and should not
   make the total look uncertain */
function negligible(ing){
  const n=norm(ing.item);
  if(n==='water'||n==='ice'||n==='tap water')return true;   // it comes out of the wall
  const seasonings=S.pantry.groups.filter(g=>/seasoning|spice/.test(g.name)).flatMap(g=>g.items);
  if(seasonings.some(x=>sameThing(x.name,ing.item)))return true;
  if(!ing.qty && /salt|pepper|oil|water/.test(norm(ing.item)))return true;
  return false;
}
/* what one of a thing weighs, in grams, if we have been told */
function typicalWeight(item){
  const W=(S.prices&&S.prices.weights)||{};
  for(const k of Object.keys(W)) if(sameThing(W[k].item,item))return W[k].g;
  return null;
}
/* recipes count things; shops sell them by weight. Bridge the two, but only
   with an assumption we can point at, and always flag it as an estimate. */
function crossConvert(item,base,targetFam){
  if(!base)return null;
  if(base.fam===targetFam)return {n:base.n,est:false};
  const w=typicalWeight(item);
  if(base.fam==='count'&&targetFam==='weight'&&w!=null)return {n:base.n*w,est:true};
  if(base.fam==='weight'&&targetFam==='count'&&w)return {n:base.n/w,est:true};
  if(base.fam==='count'&&targetFam==='volume'&&w!=null)return {n:base.n*w,est:true};
  /* for anything wet, a millilitre weighs about a gram. Wrong for flour,
     close enough for stock, milk, paste and sauce. */
  if((base.fam==='volume'&&targetFam==='weight')||(base.fam==='weight'&&targetFam==='volume'))
    return {n:base.n,est:true};
  return null;
}
function recipeCost(recipe,servingsMultiplier){
  const mult=servingsMultiplier||1;
  let total=0;
  const priced=[],unpriced=[],skipped=[],estimated=[];
  recipe.ingredients.forEach(i=>{
    if(!i.key)return;
    if(negligible(i)){ skipped.push(i.item); return; }
    const up=unitPrice(i.item);
    if(!up){ unpriced.push(i.item); return; }
    const conv=crossConvert(i.item,toBase(i.qty||'1',i.unit||''),up.fam);
    if(!conv){ unpriced.push(i.item); return; }
    const c=up.per*conv.n*mult;
    total+=c;
    if(conv.est)estimated.push(i.item);
    priced.push({item:i.item,cost:c,on:up.on,store:up.store,est:conv.est});
  });
  return {total,priced,unpriced,skipped,estimated,
    complete:unpriced.length===0,
    confidence: priced.length+unpriced.length ? priced.length/(priced.length+unpriced.length) : 0};
}
function costLabel(c){
  if(!c.priced.length)return null;
  if(!c.complete)return 'from '+money(c.total);
  return (c.estimated.length?'about ':'')+money(c.total);
}
/* spending, by month and in total */
function spending(){
  const rows=[];
  (S.prices.buy||[]).forEach(b=>rows.push({date:b.date,price:b.price,store:b.store,what:b.item}));
  (S.prices.other||[]).forEach(o=>rows.push({date:o.date,price:o.price,store:o.store,what:o.what,other:true}));
  const byMonth={};
  rows.forEach(r=>{ const m=(r.date||'').slice(0,7); if(!m)return;
    byMonth[m]=(byMonth[m]||0)+r.price; });
  const byStore={};
  rows.forEach(r=>{ const s=r.store||'unknown'; byStore[s]=(byStore[s]||0)+r.price; });
  return {rows,byMonth,byStore,total:rows.reduce((a,r)=>a+r.price,0)};
}
/* record a shop — used by the manual form and by receipt processing */
function recordPurchase({date,store,items,other}){
  const d=date||todayISO();
  (items||[]).forEach(it=>{
    S.prices.buy.push({date:d,item:it.item,qty:it.qty||'1',unit:it.unit||'',
      price:parseFloat(it.price)||0,store:store||'',key:norm(it.item)});
    /* bought it, so we have it again */
    S.pantry.groups.forEach(g=>g.items.forEach(p=>{
      if(!sameThing(p.name,it.item))return;
      setLevel(p,'plenty');
      if(it.qty){ p.qty=it.qty; p.unit=it.unit||null; }
      p.bought=d;
      S.grocery.need=S.grocery.need.filter(t=>t!==p.name);
    }));
  });
  (other||[]).forEach(o=>S.prices.other.push({date:d,what:o.what,price:parseFloat(o.price)||0,store:store||''}));
  return true;
}

/* ============================================================
   WHERE TO SHOP
   ============================================================ */
function storeFor(item){
  const month=new Date().getMonth()+1;
  /* an explicit rule wins */
  for(const k of Object.keys(S.stores.best||{})){
    const b=S.stores.best[k];
    if(sameThing(b.item,item)||norm(item).includes(norm(b.item)))
      return {store:b.store,why:'we always get it there'};
  }
  /* in season and someone sells seasonal produce */
  const seasonal=inSeason(item,month);
  if(seasonal){
    const farm=(S.stores.list||[]).find(s=>s.good.some(g=>/season|produce|vegetable|farm/i.test(g)));
    if(farm)return {store:farm.name,why:'in season right now'};
  }
  /* a store that lists this category as a speciality */
  const cat=familyOf(item);
  const byCat=(S.stores.list||[]).find(s=>s.good.some(g=>
    sameThing(g,item)||(cat&&norm(g)===cat)||norm(item).includes(norm(g))));
  if(byCat)return {store:byCat.name,why:'they are good for '+item};
  /* otherwise, wherever it was cheapest */
  const best=bestPrice(item);
  if(best&&best.store)return {store:best.store,why:'cheapest we have paid, '+money(best.paid)+' on '+best.on};
  const dflt=(S.stores.list||[]).find(s=>s.good.some(g=>/everything|default/i.test(g)));
  return dflt?{store:dflt.name,why:'default'}:null;
}
function shoppingRoute(items){
  const by={};
  items.forEach(t=>{
    const name=typeof t==='string'?t:t.item||t.text;
    const s=storeFor(name)||{store:'anywhere',why:''};
    (by[s.store]=by[s.store]||{store:s.store,items:[],why:{}}).items.push(name);
    by[s.store].why[name]=s.why;
  });
  return Object.values(by).sort((a,b)=>b.items.length-a.items.length);
}

/* ---------- planner ---------- */
function guestsOn(iso){ return (S.plan.guests||[]).find(g=>iso>=g.from&&iso<=g.to)||null; }
function houseSize(){ return parseInt((S.rules.portions||{}).serves||'2')||2; }
/* how many portions to cook on a given day */
function portionsOn(iso){ const g=guestsOn(iso); return houseSize()+(g?g.extra:0); }
function isFavourite(r){ return (S.plan.favourites||[]).some(f=>sameThing(f,r.name)||f.toLowerCase()===r.name.toLowerCase()); }
function isAway(iso){ return S.plan.away.some(a=>iso>=a.from&&iso<=a.to); }
function nextTrip(fromISO){
  const t=S.plan.away.filter(a=>a.from>=fromISO).sort((a,b)=>a.from.localeCompare(b.from));
  return t[0]||null;
}
function isSkipped(iso,meal){ return S.plan.skip.some(s=>s.date===iso&&s.meal===meal); }
function skipReason(iso,meal){ const s=S.plan.skip.find(s=>s.date===iso&&s.meal===meal); return s?s.reason:''; }
function recipeByName(name){
  if(!name)return null;
  const n=name.toLowerCase().trim();
  return S.recipes.find(r=>r.name.toLowerCase()===n)
      || S.recipes.find(r=>r.name.toLowerCase().includes(n)||n.includes(r.name.toLowerCase()))
      || null;
}
function perishScore(r){
  // how much of this recipe leans on stuff that goes bad — used to burn down the fridge before a trip
  const fridge=S.pantry.groups.filter(g=>/fridge|produce|veg/.test(g.name)).flatMap(g=>g.items);
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  let s=0;
  r.ingredients.forEach(i=>{
    if(fridge.some(f=>sameThing(f.name,i.item)))s+=2;
    if(freezer.some(f=>sameThing(f.name,i.item)))s+=1;
  });
  if(r.tags.some(t=>/use it up|flexible|clean/i.test(t)))s+=4;
  return s;
}
function buildPlan(startISO,days,opts={}){
  const out=[];
  const used=new Set();
  const trip=nextTrip(startISO);
  const have=haveKeys();
  for(let d=0;d<days;d++){
    const iso=fmtDate(addDays(parseDate(startISO),d));
    if(isAway(iso)){ out.push({date:iso,meal:'dinner',away:true,
      reason:(S.plan.away.find(a=>iso>=a.from&&iso<=a.to)||{}).label||'away'}); continue; }
    if(isSkipped(iso,'dinner')){ out.push({date:iso,meal:'dinner',skip:true,reason:skipReason(iso,'dinner')}); continue; }
    const existing=S.plan.plan.find(p=>p.date===iso&&p.meal==='dinner');
    if(existing && !opts.replace){
      out.push({date:iso,meal:'dinner',recipe:recipeByName(existing.recipe),name:existing.recipe,pinned:true,
        guest:guestsOn(iso),portions:portionsOn(iso),
        reason:guestsOn(iso)?`${guestsOn(iso).who} staying — cooking for ${portionsOn(iso)}`:''});
      used.add((recipeByName(existing.recipe)||{}).fileId); continue;
    }
    const daysToTrip = trip?dayDiff(iso,trip.from):999;
    const guest=guestsOn(iso);
    let pool=S.recipes.filter(r=>!used.has(r.fileId));
    if(!pool.length){ used.clear(); pool=S.recipes.slice(); }   // small library — start the rotation over
    const cands=pool.map(r=>{
      const sc=scoreRecipe(r,[],have);
      let s=sc.score;
      if(daysToTrip<=2 && daysToTrip>=0){ s+=perishScore(r)*6; s-=sc.missing.length*10; }   // burn the fridge down, buy nothing
      else if(daysToTrip<=4) s+=perishScore(r)*2;
      if(guest && isFavourite(r)) s+=80;                             // people are staying — cook the good stuff
      s+=Math.random()*3;                                            // a little shuffle so it isn't the same week forever
      return {r,s,sc,daysToTrip};
    }).sort((a,b)=>b.s-a.s);
    const pick=cands[0];
    out.push({date:iso,meal:'dinner',recipe:pick?pick.r:null,name:pick?pick.r.name:'',
      score:pick?pick.sc:null,guest,portions:portionsOn(iso),
      reason: guest ? `${guest.who} staying — cooking for ${portionsOn(iso)}`
        : (daysToTrip<=2&&daysToTrip>=0 ? `${daysToTrip===0?'leaving today':'before '+(trip.label||'the trip')} — uses what's here`:'')});
    if(pick)used.add(pick.r.fileId);
  }
  return out;
}
function thawFor(planRows){
  const freezer=S.pantry.groups.filter(g=>/freezer/.test(g.name)).flatMap(g=>g.items);
  const out=[];
  planRows.forEach(row=>{
    if(!row.recipe)return;
    row.recipe.ingredients.forEach(i=>{
      const hit=freezer.find(f=>sameThing(f.name,i.item));
      if(!hit)return;
      let hours=null;
      Object.keys(S.rules.thaw).forEach(k=>{ if(sameThing(k,i.item)&&(hours==null||S.rules.thaw[k]>hours))hours=S.rules.thaw[k]; });
      if(hours==null)hours=12;
      const dinner=parseDate(row.date); dinner.setHours(APP.DINNER_HOUR,0,0,0);
      const when=new Date(dinner.getTime()-hours*3600e3);
      out.push({item:hit.name,recipeItem:i.item,date:row.date,meal:row.meal,hours,late:when<new Date(),
        when:fmtDate(when)+' '+String(when.getHours()).padStart(2,'0')+':00',
        whenD:when,recipe:row.recipe.name});
    });
  });
  out.sort((a,b)=>a.whenD-b.whenD);
  return out;
}

/* ---------- grocery ---------- */
function buildGrocery(planRows){
  const have=pantryHave(S.pantry);
  const bucket=new Map();
  planRows.forEach(row=>{
    if(!row.recipe)return;
    const serves=parseInt(row.recipe.meta.serves||houseSize())||houseSize();
    const mult=row.portions?Math.max(1,row.portions/serves):1;
    row.recipe.ingredients.forEach(i=>{
      if(!i.key)return;
      if(have.some(h=>satisfies(h.name,i.item)))return;
      if(canMake(i.item))return;                       // we can make this from what's here
      const comp=componentFor(i.item);
      if(comp){                                        // we make this, but are short an input
        comp.ingredients.forEach(ci=>{
          if(!ci.key||negligible(ci))return;
          if(have.some(h=>satisfies(h.name,ci.item)))return;
          const ck=ci.key;
          if(!bucket.has(ck))bucket.set(ck,{item:ci.item,parts:[],forr:new Set()});
          const cb=bucket.get(ck);
          cb.parts.push({qty:ci.qty,unit:ci.unit});
          cb.forr.add('to make '+comp.meta.makes);
        });
        return;
      }
      const k=i.key;
      if(!bucket.has(k))bucket.set(k,{item:i.item,parts:[],forr:new Set()});
      const b=bucket.get(k);
      const n=fracToNum(i.qty);
      b.parts.push({qty:n!=null?String(trimNum(n*mult)):i.qty,unit:i.unit});
      b.forr.add(row.recipe.name+(mult>1?' (for '+row.portions+')':''));
    });
  });
  const list=[...bucket.values()].map(b=>{
    const byUnit={};
    let unparsed=false;
    b.parts.forEach(p=>{
      if(!p.qty){unparsed=true;return;}
      const n=fracToNum(p.qty); if(n==null){unparsed=true;return;}
      const u=p.unit||'';
      byUnit[u]=(byUnit[u]||0)+n;
    });
    const amt=Object.keys(byUnit).map(u=>trimNum(byUnit[u])+(u?' '+u:'')).join(' + ');
    return {text:(amt?amt+' ':'')+b.item, item:b.item, forr:[...b.forr]};
  });
  /* being out of something we make ourselves is not a shopping problem —
     the inputs are already on the list above if we are short of them */
  const outOf=pantryAll(S.pantry)
    .filter(i=>i.out && !componentFor(i.name))
    .map(i=>({text:i.name,item:i.name,forr:['out of it']}));
  return list.concat(outOf);
}
function fracToNum(q){
  const s=String(q).trim();
  let m=/^(\d+)\s+(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]+ +m[2]/+m[3];
  m=/^(\d+)\/(\d+)$/.exec(s); if(m)return +m[1]/+m[2];
  m=/^(\d+(?:\.\d+)?)/.exec(s); if(m)return +m[1];
  return null;
}
function trimNum(n){ return Math.round(n*100)/100; }

/* ============================================================
   REFACTOR — the part that makes somebody else's recipe into ours
   ============================================================ */
const PASSES=[
  {id:'units', name:'Tidy units', desc:'½ becomes 1/2, "tablespoons" becomes tbsp, spacing cleaned up.'},
  {id:'swap',  name:'House swaps', desc:'Applies the Swap list in house-rules.md — shallot becomes yellow onion, and so on.'},
  {id:'steps', name:'Link step library', desc:'Recognises steps you already have a house method for and replaces them with @references, so fixing the method once fixes every recipe.'},
  {id:'always',name:'House technique', desc:'Adds the Always rules that apply to this recipe (salt the beef ahead, sear before braising…).'},
  {id:'never', name:'Flag no-go ingredients', desc:'Marks anything on the Never list and removes it when it is only a garnish.'},
  {id:'tags',  name:'Auto-tag', desc:'Adds protein / method / speed tags so the matcher and planner can find it.'},
  {id:'meta',  name:'Fill in the blanks', desc:'Default serves, added date, status.'}
];
function enabledPasses(){ return LS.get('passes',PASSES.map(p=>p.id)); }

function refactor(rec,passIds){
  const on=new Set(passIds||enabledPasses());
  const r=JSON.parse(JSON.stringify(rec));
  const changes=[];
  const push=(pass,before,after,why)=>{ if(before!==after)changes.push({pass,before,after,why}); };

  if(on.has('units')){
    r.ingredients.forEach((i,n)=>{
      const before=i.raw||ingLine(i);
      const p=parseIngredient(before);
      const after=ingLine(p);
      if(before!==after){ Object.assign(i,p,{raw:after,dirty:true}); push('units',before,after,'unit spelling / fractions'); }
    });
    r.steps.forEach((s,n)=>{ const a=deVulgar(s).replace(/\s+/g,' ').trim();
      if(a!==s){ push('units',s,a,'fractions'); r.steps[n]=a; } });
  }

  if(on.has('swap')){
    S.rules.swap.forEach(sw=>{
      const target=sw.to.split(',')[0].trim();
      r.ingredients.forEach(i=>{
        // already the house version — don't swap it twice and re-append the note
        if(norm(i.item)===norm(target) && norm(i.item)!==norm(sw.from))return;
        if(sameThing(i.item,sw.from)){
          const before=ingLine(i);
          const parts=sw.to.split(',');
          i.item=parts[0].trim();
          if(parts.length>1) i.note=[i.note,parts.slice(1).join(',').trim()].filter(Boolean).join(', ');
          i.key=norm(i.item); i.dirty=true; i.raw=ingLine(i);
          push('swap',before,i.raw,'house rule: '+sw.from+' -> '+sw.to);
        }
      });
      r.steps.forEach((s,n)=>{
        const re=new RegExp('\\b'+sw.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','ig');
        if(re.test(s)){ const a=s.replace(re,target);
          push('swap',s,a,'house rule in step text'); r.steps[n]=a; }
      });
    });
  }

  if(on.has('steps')){
    const lib=Object.values(S.steps.map);
    r.steps.forEach((s,n)=>{
      if(/^@/.test(s.trim()))return;
      const low=s.toLowerCase();
      const hit=lib.find(L=>L.matches.some(m=>m&&low.includes(m)));
      if(hit){ const a='@'+hit.name; push('steps',s,a,'we already have a house method for this'); r.steps[n]=a; }
    });
  }

  if(on.has('always')){
    const hay=(r.name+' '+r.tags.join(' ')+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    S.rules.always.forEach(a=>{
      if(!a.trigger)return;
      if(!hay.includes(a.trigger.toLowerCase()))return;
      const already=r.steps.some(s=>s.toLowerCase().includes(a.do.toLowerCase().slice(0,18)))
        || (r.notes||'').toLowerCase().includes(a.do.toLowerCase().slice(0,18));
      if(already)return;
      r.steps.unshift(a.do.charAt(0).toUpperCase()+a.do.slice(1)+'.');
      changes.push({pass:'always',before:'(nothing)',after:a.do,why:'house rule for '+a.trigger});
    });
  }

  if(on.has('never')){
    S.rules.never.forEach(n=>{
      const idx=r.ingredients.findIndex(i=>sameThing(i.item,n));
      if(idx<0)return;
      const line=ingLine(r.ingredients[idx]);
      const garnish=/garnish|to serve|topping|for serving/i.test(line+' '+(r.ingredients[idx].note||''));
      if(garnish){ r.ingredients.splice(idx,1); changes.push({pass:'never',before:line,after:'(removed)',why:n+' is on the Never list and was only a garnish'}); }
      else changes.push({pass:'never',before:line,after:line+'   <-- FLAG',why:n+' is on the Never list — decide what to do'});
    });
  }

  if(on.has('tags')){
    const hay=(r.name+' '+r.ingredients.map(i=>i.item).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    const add=[];
    const PROTEIN={beef:['beef','short rib','steak','chuck','brisket','ground beef'],chicken:['chicken'],
      pork:['pork','bacon','sausage','ham'],fish:['salmon','cod','fish','halibut','tuna'],
      shrimp:['shrimp','prawn'],egg:['egg'],tofu:['tofu'],lamb:['lamb'],vegetarian:[]};
    Object.keys(PROTEIN).forEach(k=>{ if(PROTEIN[k].some(w=>hay.includes(w)))add.push(k); });
    const METHOD={braise:['braise','braised'],roast:['roast','oven'],grill:['grill'],fry:['fry','fried','wok'],
      soup:['soup','stew','broth'],'sheet pan':['sheet pan'],'slow':['slow cook','3 hour','4 hour'],'one pan':['one pan','same pan']};
    Object.keys(METHOD).forEach(k=>{ if(METHOD[k].some(w=>hay.includes(w)))add.push(k); });
    const t=(r.meta.time||'');
    const mins=(/(\d+)\s*h/.test(t)?parseInt(/(\d+)\s*h/.exec(t)[1])*60:0)+(/(\d+)\s*m/.test(t)?parseInt(/(\d+)\s*m/.exec(t)[1]):0);
    if(mins&&mins<=35)add.push('fast'); if(mins&&mins>=150)add.push('long');
    const before=r.tags.join(', ');
    r.tags=uniq(r.tags.concat(add.filter(x=>x)));
    push('tags',before,r.tags.join(', '),'derived from the ingredients and method');
  }

  if(on.has('meta')){
    if(!r.meta.serves){ r.meta.serves=(S.rules.portions.serves||'2'); changes.push({pass:'meta',before:'(no serves)',after:'serves: '+r.meta.serves,why:'house default'}); }
    if(!r.meta.added){ r.meta.added=todayISO(); changes.push({pass:'meta',before:'(no added date)',after:'added: '+r.meta.added,why:''}); }
    if(!r.meta.status){ r.meta.status='untested'; changes.push({pass:'meta',before:'(no status)',after:'status: untested',why:'mark it tested once it works'}); }
  }

  return {result:r,changes};
}

/* ============================================================
   MAKE IT — adapt a recipe to what is actually in the house
   Substitute what we can, drop what doesn't matter, swap the protein
   if you want to, and be loud about every change.
   ============================================================ */
function makeIt(recipe,opts={}){
  const r=JSON.parse(JSON.stringify(recipe));
  const changes=[];
  const have=pantryHave(S.pantry);
  const hasIt=n=>have.some(h=>satisfies(h.name,n));
  const note=(kind,text,was)=>changes.push({kind,text,was:was||null});

  /* 1 — swap the whole protein, if asked */
  if(opts.protein){
    const target=opts.protein;
    const rule=S.rules.proteins[norm(target)]||null;
    const oldIdx=r.ingredients.findIndex(i=>isProtein(i.item));
    const oldName=oldIdx>=0?r.ingredients[oldIdx].item:null;
    const oldFam=oldName?isProtein(oldName):null;

    /* strip out everything that was only there because of the old protein */
    if(oldFam){
      const oldRule=S.rules.proteins[norm(oldFam)]||null;
      const before=r.steps.length;
      r.steps=r.steps.filter(s=>{
        const low=s.toLowerCase();
        if(oldRule&&oldRule.technique&&low.includes(oldRule.technique.toLowerCase().slice(0,20)))return false;
        return !S.rules.always.some(a=>a.trigger
          && (norm(a.trigger)===norm(oldFam)||isProtein(a.trigger)===oldFam)
          && low.includes(a.do.toLowerCase().slice(0,16)));
      });
      if(r.steps.length<before)note('technique','dropped the '+oldFam+' method');
      /* drop the old protein's pairings too, so fish doesn't inherit bay leaf */
      if(oldRule){
        oldRule.add.forEach(a=>{
          const n=r.ingredients.findIndex(i=>sameThing(i.item,a));
          if(n>=0 && !(rule&&rule.add.some(x=>sameThing(x,a)))){
            r.ingredients.splice(n,1);
            note('drop',`${a} — that was there for the ${oldFam}`);
          }
        });
      }
    }

    if(oldIdx>=0){
      const ing=r.ingredients.find(i=>isProtein(i.item));
      if(ing){ ing.item=target; ing.key=norm(target); ing.dirty=true; ing.chosen=true; ing.raw=ingLine(ing); }
      note('protein',`${target} instead of ${oldName}`,oldName);
      /* reword the written steps so they stop talking about ribs */
      const words=uniq(String(oldName).toLowerCase().split(/\s+/).concat(norm(oldName).split(' ')))
        .filter(w=>w.length>3);
      if(words.length){
        const re=new RegExp('\\b('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(s|es)?\\b','ig');
        const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
        r.steps=r.steps.map(s=>cap(s.replace(re,target)));
        r.notes=(r.notes||'').replace(re,target);
      }
    }else{
      r.ingredients.unshift(Object.assign(parseIngredient(target),{dirty:true,chosen:true}));
      note('protein',`added ${target}`);
    }

    if(rule){
      rule.add.forEach(a=>{
        if(r.ingredients.some(i=>sameThing(i.item,a)))return;
        r.ingredients.push(Object.assign(parseIngredient(a),{dirty:true}));
        note('add',`${a} — goes with ${target}`);
      });
      if(rule.technique){
        r.steps.unshift('With '+target+': '+rule.technique+'.');
        note('technique',rule.technique);
      }
      if(rule.time){ r.meta.time=rule.time; note('technique','timing: '+rule.time); }
    }
    /* apply the house Always rules that belong to the NEW protein only —
       the recipe's own tags still say "braise", and they are no longer true */
    S.rules.always.forEach(a=>{
      if(!a.trigger||!target.toLowerCase().includes(a.trigger.toLowerCase()))return;
      if(r.steps.some(s=>s.toLowerCase().includes(a.do.toLowerCase().slice(0,18))))return;
      r.steps.splice(1,0,a.do.charAt(0).toUpperCase()+a.do.slice(1)+'.');
      note('technique',a.do+' — house rule for '+a.trigger);
    });
    if(oldFam){
      r.tags=r.tags.filter(t=>norm(t)!==norm(oldFam));
      if(!r.tags.includes(target))r.tags.unshift(target);
      note('warn','the written steps below were composed for '+oldFam+
        ' — the method line at the top wins where they disagree');
    }
  }

  /* 2 — anything we don't have: make it, substitute, drop, or flag */
  const missing=[];
  const scratchUsed=[];
  for(let n=r.ingredients.length-1;n>=0;n--){
    const i=r.ingredients[n];
    if(!i.key||hasIt(i.item))continue;
    if(i.chosen){ missing.push(i.item); continue; }   // you asked for this one — never drop it
    if(!opts.noScratch){
      const mk=canMake(i.item);
      if(mk){
        i.scratch=mk.recipe.name;
        scratchUsed.push(mk);
        note('scratch',`${i.item} — we don't have it, but we can make it: ${mk.recipe.name}`);
        continue;
      }
    }
    const sub=findSub(i.item);
    if(sub){
      const was=i.item;
      i.item=sub.to.split(',')[0].trim(); i.key=norm(i.item); i.dirty=true; i.sub=was; i.raw=ingLine(i);
      note('sub',`${i.item} instead of ${was}`,was);
      continue;
    }
    if(isDroppable(i.item)){
      note('drop',`left out the ${i.item}`,i.item);
      r.ingredients.splice(n,1);
      continue;
    }
    missing.push(i.item);
  }
  missing.reverse();

  /* 3 — splice the making-of into the top of the method, and bring its
     shopping along, so the page you cook from is complete */
  if(scratchUsed.length){
    scratchUsed.reverse();
    const pre=[];
    scratchUsed.forEach(mk=>{
      const t=mk.recipe.meta.time?' — '+mk.recipe.meta.time:'';
      pre.push('First, the '+mk.item+''+t+':');
      mk.recipe.steps.forEach(st=>pre.push(st));
      mk.recipe.ingredients.forEach(ing=>{
        if(negligible(ing))return;
        if(r.ingredients.some(x=>sameThing(x.item,ing.item)))return;
        const copy=Object.assign({},ing,{forScratch:mk.item,dirty:true});
        r.ingredients.push(copy);
      });
    });
    r.steps=pre.concat(r.steps);
  }

  if(missing.length)note('missing','still need: '+missing.join(', '));
  return {recipe:r,changes,missing,scratch:scratchUsed};
}
/* proteins we could swap in, given what's in the house */
function availableProteins(){
  const out=[];
  pantryHave(S.pantry).forEach(i=>{ if(isProtein(i.name))out.push(i.name); });
  return uniq(out);
}

/* ============================================================
   COOKING SOMETHING USES IT UP
   Perishables step down a level; a seasoning is not "used up" by a
   pinch of it. Everything is a suggestion you can override in one tap.
   ============================================================ */
function deductPlan(recipe){
  const rows=[];
  S.pantry.groups.forEach(g=>g.items.forEach(i=>{
    if(i.out)return;
    const used=recipe.ingredients.find(x=>satisfies(i.name,x.item));
    if(!used)return;
    const perishable=/fridge|freezer|produce|veg|meat/.test(g.name);
    let suggestion='keep';
    if(i.level==='low')suggestion='out';
    else if(perishable)suggestion='down';
    rows.push({item:i,group:g.name,used:ingLine(used),suggestion,choice:suggestion});
  }));
  return rows;
}
/* "leaves: chicken bones" — roast a chicken, gain the makings of stock */
function applyLeaves(recipe){
  const list=String((recipe.meta||{}).leaves||'').split(',').map(x=>x.trim()).filter(Boolean);
  const added=[];
  list.forEach(name=>{
    let found=null;
    S.pantry.groups.forEach(g=>g.items.forEach(i=>{ if(sameThing(i.name,name))found=i; }));
    if(found){ setLevel(found,'plenty'); found.bought=todayISO(); }
    else{
      const g=S.pantry.groups.find(x=>/freezer/.test(x.name))||S.pantry.groups[0];
      g.items.push({name,level:'plenty',out:false,qty:null,unit:null,bought:todayISO(),key:norm(name)});
    }
    S.grocery.need=S.grocery.need.filter(t=>t!==name);
    added.push(name);
  });
  return added;
}
function applyDeduct(rows){
  const nowOut=[];
  rows.forEach(r=>{
    if(r.choice==='keep')return;
    if(r.choice==='out'){ setLevel(r.item,'out'); nowOut.push(r.item.name); }
    else { stepDown(r.item); if(r.item.out)nowOut.push(r.item.name); }
  });
  nowOut.forEach(name=>{
    if(!S.grocery.need.includes(name)&&!S.grocery.manual.includes(name))S.grocery.need.push(name);
    S.grocery.got=S.grocery.got.filter(t=>t!==name);
  });
  return nowOut;
}

/* ---------- turn a pasted blob into a recipe ---------- */
const ING_HEAD=/^\s*#*\s*(ingredients|what you.ll need|shopping list)\s*:?\s*$/i;
const STEP_HEAD=/^\s*#*\s*(instructions|directions|steps|method|preparation|how to make.*)\s*:?\s*$/i;
const NOTE_HEAD=/^\s*#*\s*(notes?|tips?)\s*:?\s*$/i;
function looksIngredient(l){
  const s=l.trim();
  if(!s||s.length>90)return false;
  if(QTY.test(s))return true;
  const w=s.toLowerCase().split(/[\s,]+/);
  if(w.some(x=>UNIT_CANON[x]))return true;
  if(w.length<=5 && !/[.!?]$/.test(s) && !/^(then|next|add|heat|cook|stir|place|remove|serve|preheat)/i.test(s))return true;
  return false;
}
function captureParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  let name='', ing=[], steps=[], notes=[], mode='?';
  let firstReal=lines.findIndex(l=>l.trim());
  if(firstReal>=0) name=lines[firstReal].replace(/^#+\s*/,'').trim().slice(0,90);
  for(let n=(firstReal<0?0:firstReal+1);n<lines.length;n++){
    const l=lines[n], t=l.trim();
    if(!t)continue;
    if(ING_HEAD.test(t)){mode='i';continue;}
    if(STEP_HEAD.test(t)){mode='s';continue;}
    if(NOTE_HEAD.test(t)){mode='n';continue;}
    const clean=t.replace(/^([-*•▢]|\d+[.)])\s*/,'').trim();
    if(!clean)continue;
    if(mode==='i'){
      // "Kosher salt and freshly ground black pepper" is two ingredients, not one
      const sp=/^(.*\bsalt)\s+and\s+(.*\bpepper.*)$/i.exec(clean);
      if(sp){ ing.push(sp[1].trim()); ing.push(sp[2].trim()); } else ing.push(clean);
    }
    else if(mode==='s')steps.push(clean);
    else if(mode==='n')notes.push(clean);
    else { if(looksIngredient(clean))ing.push(clean); else steps.push(clean); }
  }
  // a pasted transcript often has no ingredient list at all — pull nouns out of the steps
  if(!ing.length && steps.length){
    const found=new Set();
    const vocab=uniq(pantryAll(S.pantry).map(i=>i.name)
      .concat(S.recipes.flatMap(r=>r.ingredients.map(i=>i.item))));
    vocab.forEach(v=>{ const re=new RegExp('\\b'+norm(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?\\b','i');
      if(re.test(steps.join(' ')))found.add(v); });
    ing=[...found];
  }
  const r={name:name||'Untitled',meta:{source:'pasted'},tags:[],
    ingredients:ing.map(parseIngredient),steps,notes:notes.join('\n'),raw:text};
  r.slug=slug(r.name);
  return r;
}

/* ---------- optional: let Claude do the adapting ---------- */
async function aiAdapt(rawText){
  const key=LS.get('anthropicKey','');
  if(!key) throw new Error('No API key set');
  const model=LS.get('anthropicModel','claude-sonnet-4-5');
  const stepNames=Object.keys(S.steps.map);
  const sys=`You convert recipes into one household's private recipe format. Output ONLY the markdown file, no preamble.

FORMAT (exactly this shape):
# Recipe Name

tags: comma, separated
serves: 2
time: 45m
source: where it came from
status: untested

## Ingredients
- 2 lb thing
- 1 tbsp other thing

## Steps
1. Step text.
2. @named-step

## Notes
Anything worth remembering.

RULES OF THIS HOUSE (apply them, do not just mention them):
${S.rules.raw}

STEP LIBRARY — if a step in the source recipe is one of these, replace the whole step with @name on its own line:
${stepNames.map(n=>'@'+n+' — '+(S.steps.map[n].text.split('\n')[0])).join('\n')}

WHAT THEY ALWAYS HAVE (do not add these to a shopping list, but do list them as ingredients):
${pantryHave(S.pantry).map(i=>i.name).join(', ')}

Rewrite quantities for the house serving size. Convert vague instructions into specific ones (temperatures, times, visual cues). Be concise and direct — these are notes for people who can cook, not a blog post.`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:3000,system:sys,
      messages:[{role:'user',content:'Convert this into our format:\n\n'+rawText.slice(0,20000)}]})
  });
  if(!r.ok) throw new Error('Claude API '+r.status+': '+(await r.text()).slice(0,200));
  const j=await r.json();
  let out=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
  out=out.replace(/^```(?:markdown|md)?\s*/,'').replace(/```\s*$/,'');
  return out;
}

/* ============================================================
   STOCK — "we've run out of that"
   One tap flips an item to out. It stops counting as available,
   goes on the grocery list, and stays in the pantry so putting it
   back is one tap too. Saves itself to Drive a moment later.
   ============================================================ */
let _stockTimer=null,_stockDirty=false;
function setStock(item,out){ setStockLevel(item,out?'out':'plenty'); }
function setStockLevel(item,level){
  setLevel(item,level);
  const name=item.name;
  S.grocery.got=S.grocery.got.filter(t=>t!==name);
  if(level==='out'){ if(!S.grocery.need.includes(name)&&!S.grocery.manual.includes(name))S.grocery.need.push(name); }
  else { S.grocery.need=S.grocery.need.filter(t=>t!==name); }
  _stockDirty=true;
  status(level==='out'?`Out of ${name} — added to the list…`:`${name}: ${LEVEL_LABEL[level]}…`,'busy');
  renderStockHost(); renderPantrySide(); refreshMatches(); renderGrocHost();
  clearTimeout(_stockTimer); _stockTimer=setTimeout(flushStock,900);
}
function markStockDirty(){ _stockDirty=true; clearTimeout(_stockTimer); _stockTimer=setTimeout(flushStock,700); }
async function flushStock(){
  if(!_stockDirty)return;
  _stockDirty=false;
  const pt=serializePantry(S.pantry); S.pantry.raw=pt;
  const gt=serializeGrocery(S.grocery); S.grocery.raw=gt;
  try{
    await saveFile('pantry.md',pt);
    await saveFile('grocery-list.md',gt);
    saveCache();
    status('Saved to Drive · '+niceTime(new Date()),'good');
  }catch(e){
    _stockDirty=true;
    status('Not saved yet — '+e.message,'err');
    toast('Could not reach Drive. Press Sync when you are back online.');
  }
}

/* press and hold — the touch equivalent of hovering to reveal the ×.
   Tolerant of a little finger drift, and swallows the click that follows. */
function longPress(node,ms,fn){
  let timer=null,fired=false,sx=0,sy=0;
  const cancel=()=>{ clearTimeout(timer); timer=null; node.classList.remove('pressing'); };
  node.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0)return;
    fired=false; sx=e.clientX; sy=e.clientY;
    node.classList.add('pressing');
    timer=setTimeout(()=>{ fired=true; node.classList.remove('pressing'); fn(); },ms);
  });
  node.addEventListener('pointermove',e=>{
    if(!timer)return;
    if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)cancel();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>node.addEventListener(ev,cancel));
  node.addEventListener('click',e=>{ if(fired){ e.preventDefault(); e.stopPropagation(); fired=false; } },true);
  node.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---- the sidebar: everything in the house, doubling as recipe filters ---- */
function renderPantrySide(){
  const side=document.getElementById('pantrySide');
  if(!side)return;
  side.innerHTML='';
  const all=S.pantry.groups.flatMap(g=>g.items);
  const out=all.filter(i=>i.out);
  const q=(UI.sideFind||'').trim().toLowerCase();

  side.append(el('div',{class:'sidehead'},
    h('h3',null,"What's in the house"),
    h('span','n tiny dim',(all.length-out.length)+' in')));
  side.append(el('input',{type:'text',class:'sidefind',placeholder:'find an ingredient',
    value:UI.sideFind||'',
    oninput:e=>{UI.sideFind=e.target.value;renderPantrySide();}}));
  side.append(h('p','tiny dim','Click to filter the recipes. Hover for the × — or press and hold — to say we have run out.'));

  if(UI.selected.length){
    side.append(el('div',{class:'row',style:'margin:8px 0'},
      el('button',{class:'btn sm',onclick:()=>{UI.selected=[];renderPantrySide();refreshMatches();}},
        'Clear '+UI.selected.length+' filter'+(UI.selected.length>1?'s':''))));
  }

  const row=(i,gone)=>{
    const on=UI.selected.some(s=>sameThing(s,i.name));
    const node=el('div',{class:'pitem'+(on?' on':'')+(gone?' gone':''),
      title:gone?'we are out — click to say we have it again'
                :(LEVEL_LABEL[i.level]+' · click to filter, × or hold to mark it gone')},
      el('span',{class:'nm'},i.name));
    if(!gone && i.level!=='plenty')
      node.append(el('span',{class:'lvl'},i.level==='low'?'LOW':'SOME'));
    if(!gone && i.qty)
      node.append(el('span',{class:'lvl'},[i.qty,i.unit].filter(Boolean).join(' ')));
    node.append(el('span',{class:'kill',title:gone?'we have it again':'we do not have this any more',
      onclick:e=>{ e.stopPropagation(); setStockLevel(i,gone?'plenty':'out'); }},gone?'↺':'×'));
    node.addEventListener('click',()=>{
      if(gone){ setStockLevel(i,'plenty'); return; }
      UI.selected = on ? UI.selected.filter(s=>!sameThing(s,i.name)) : UI.selected.concat(i.name);
      renderPantrySide(); refreshMatches();
    });
    longPress(node,500,()=>setStockLevel(i,gone?'plenty':'out'));
    return node;
  };

  let shown=0;
  S.pantry.groups.forEach(g=>{
    const items=g.items.filter(i=>!i.out && (!q||i.name.toLowerCase().includes(q)));
    if(!items.length)return;
    side.append(h('div','pgroup',g.name));
    items.forEach(i=>{ side.append(row(i,false)); shown++; });
  });
  if(!shown) side.append(h('p','small dim',q?'Nothing matches “'+q+'”.':'Nothing in the house.'));

  const outShown=out.filter(i=>!q||i.name.toLowerCase().includes(q));
  if(outShown.length){
    side.append(h('div','pgroup','Out — click to put back'));
    outShown.forEach(i=>side.append(row(i,true)));
  }
}

/* re-draw only the recipe bands */
function refreshMatches(){
  const host=document.getElementById('matchHost');
  if(!host)return;
  host.innerHTML='';

  let ranked=rankRecipes(UI.selected,{q:UI.q});
  /* the sidebar is a filter, not a hint: everything ticked must be in the recipe */
  if(UI.selected.length)
    ranked=ranked.filter(x=>UI.selected.every(s=>x.recipe.ingredients.some(i=>sameThing(i.item,s))));

  const now=ranked.filter(x=>x.missing.length===0);
  const swap=ranked.filter(x=>x.missing.length>0
    && x.missing.every(m=>findSub(m.item)||isDroppable(m.item)));
  const near=ranked.filter(x=>!now.includes(x)&&!swap.includes(x)
    && x.missing.filter(m=>!findSub(m.item)&&!isDroppable(m.item)).length<=2);
  const rest=ranked.filter(x=>!now.includes(x)&&!swap.includes(x)&&!near.includes(x));

  if(UI.selected.length||UI.q){
    host.append(el('div',{class:'filterbar'},
      h('span','tiny dim','Showing'),
      UI.q?h('span','tag','“'+UI.q+'”'):null,
      UI.selected.map(s=>el('span',{class:'tag',style:'cursor:pointer',
        onclick:()=>{UI.selected=UI.selected.filter(x=>x!==s);renderPantrySide();refreshMatches();}},s+'  ×')),
      el('button',{class:'btn sm',onclick:()=>{
        UI.selected=[];UI.q='';const b=$('#searchBox');if(b)b.value='';
        renderPantrySide();refreshMatches();
      }},'Show everything')));
  }

  if(!ranked.length){
    host.append(h('div','card',h('p','muted',
      UI.selected.length?'Nothing uses '+UI.selected.join(' and ')+'.'
        :(UI.q?'Nothing matches “'+UI.q+'”.':'No recipes yet. Add one from the Add tab.'))));
    return;
  }

  const band=(title,sub,list,limit)=>{
    if(!list.length)return;
    host.append(el('div',{class:'sec'},h('h2',null,title),h('span','n',list.length+(sub?' · '+sub:''))));
    const grid=h('div','grid');
    list.slice(0,limit||12).forEach(x=>grid.append(recipeCard(x)));
    host.append(grid);
  };

  band('Make it right now','nothing to buy',now,12);
  band('One swap away','we have a stand-in for everything missing',swap,9);
  band('Nearly there','one or two things short',near,9);
  band(UI.q||UI.selected.length?'Other matches':'Everything else','',rest,9);
}
function recipeCard(x){
  const r=x.recipe;
  const shoppable=x.missing.filter(m=>!findSub(m.item));
  const pct=Math.round(x.coverage*100);
  return h('div','card',
    el('div',{class:'row',style:'align-items:flex-start'},
      el('div',{class:'grow',style:'cursor:pointer',onclick:()=>openRecipe(r)},
        h('h3',null,r.name),
        h('div','tiny dim',[r.meta.time,r.meta.serves?'serves '+r.meta.serves:null,
          r.meta.rating?'★'+r.meta.rating:null,
          (()=>{const c=recipeCost(r);return c.priced.length?costLabel(c):null;})()].filter(Boolean).join(' · '))),
      x.never.length?h('span','pill bad','contains '+x.never[0]):
        (shoppable.length===0
          ? h('span','pill '+(x.scratch&&x.scratch.length?'scratch':'ok'),
              x.scratch&&x.scratch.length?'make the '+x.scratch[0].item+' first':'can make now')
          : h('span','pill '+(shoppable.length<=2?'warn':'bad'),'need '+shoppable.length))),
    el('div',{class:'bar',style:'margin:8px 0'},el('i',{style:'width:'+pct+'%'})),
    r.tags.slice(0,5).map(t=>h('span','tag',t)),
    x.scratch&&x.scratch.length?h('div','small',
      h('span','scratch','From scratch: '),
      x.scratch.map((c,n)=>(n?', ':'')+c.item+' ('+c.recipe.name+')').join('')):null,
    x.missing.length?h('div','small',
      h('span','miss','Missing: '),
      x.missing.map((m,n)=>{
        const s=findSub(m.item);
        return el('span',{},(n?', ':''), m.item, s?el('span',{class:'sub'},' → use '+s.to):'');
      })):null,
    el('div',{class:'row',style:'margin-top:8px'},
      el('button',{class:'btn sm',onclick:()=>openRecipe(r)},'Open'),
      el('button',{class:'btn sm pri',onclick:()=>openMakeIt(r)},'Make it'),
      el('button',{class:'btn sm',onclick:()=>{tonight(r);}},'Plan it'))
  );
}

/* ---------------- MAKE IT ---------------- */

  const {recipe:r,changes,missing}=makeIt(recipe,{protein});
  const proteins=uniq(availableProteins().concat(Object.values(S.rules.proteins).map(p=>p.name)));
  const cur=recipe.ingredients.find(i=>isProtein(i.item));
  const expand=s=>{
    const m=/^@([a-z0-9-]+)/i.exec(s.trim());
    if(m&&S.steps.map[m[1]])return el('span',{},
      el('span',{class:'step-ref'},'@'+m[1]),' — ',S.steps.map[m[1]].text);
    return document.createTextNode(s);
  };
  const box=h('div','box',
    h('div','row',h('h1','grow',r.name),el('button',{class:'btn sm',onclick:closeModal},'Close')),
    h('p','small dim','Adapted to what is actually in the house right now. Everything that changed is listed below and marked in the ingredients.'),

    el('div',{class:'row'},h('span','small muted','Make it with:'),
      el('select',{style:'width:auto',onchange:e=>openMakeIt(recipe,e.target.value||undefined)},
        el('option',{value:''},cur?'as written ('+cur.item+')':'as written'),
        proteins.map(p=>el('option',{value:p,selected:protein===p?'selected':null},p)))),

    changes.length?h('div',{},h('h3',null,'What changed'),
      el('div',{class:'card',style:'padding:10px'},changes.map(c=>
        el('span',{class:'chg '+c.kind},
          el('b',{},{sub:'SWAP',protein:'PROTEIN',drop:'LEFT OUT',add:'ADDED',technique:'METHOD',missing:'MISSING',warn:'HEADS UP',scratch:'FROM SCRATCH'}[c.kind]||c.kind),
          ' ',c.text)))):h('p','muted','Nothing needed changing — we have everything.'),

    h('div','split',
      h('div',null,h('h3',null,'Ingredients'),
        el('ul',{class:'clean'},r.ingredients.map(i=>{
          const got=pantryHave(S.pantry).some(hh=>satisfies(hh.name,i.item));
          return el('li',{},
            el('span',{class:i.forScratch?'scratch':(i.sub?'subbed':(got?'':'miss'))},ingLine(i)),
            i.forScratch?el('span',{class:'tiny scratch'},'  for the '+i.forScratch):null,
            i.sub?el('span',{class:'tiny'},'  ',el('span',{class:'was'},i.sub)):null,
            i.scratch?el('span',{class:'tiny scratch'},'  making our own'):null,
            !got&&!i.sub&&!i.forScratch&&!i.scratch?el('span',{class:'tiny miss'},'  need this'):null);
        }))),
      h('div',null,h('h3',null,'Steps'),
        el('ol',{style:'padding-left:20px;margin:0'},r.steps.map(s=>
          el('li',{class:/^First, the /.test(s)?'steps-scratch':'',style:'margin-bottom:7px'},expand(s)))))),
    r.notes?h('div',null,h('h3',null,'Notes'),h('div','muted',r.notes)):null,
    (()=>{
      const was=recipeCost(recipe), now=recipeCost(r);
      if(!was.priced.length && !now.priced.length)
        return h('p','small dim','No prices logged yet, so there is nothing to compare. Log a shop on the Money tab and this will show what each version costs.');
      const d=now.total-was.total;
      return h('div','card',
        el('div',{class:'row'},
          el('div',{},h('div','tiny dim','AS WRITTEN'),h('h3',null,costLabel(was)||'—')),
          el('div',{},h('div','tiny dim','THIS VERSION'),h('h3',null,costLabel(now)||'—')),
          Math.abs(d)>0.005?el('div',{},h('div','tiny dim','DIFFERENCE'),
            el('h3',{class:d<0?'sub':'miss'},(d<0?'saves ':'costs ')+money(Math.abs(d)))):null),
        (was.unpriced.length||now.unpriced.length)
          ? h('p','tiny dim','Not counted, never bought: '+uniq(was.unpriced.concat(now.unpriced)).join(', '))
          : null);
    })(),
    el('div',{class:'row',style:'margin-top:14px'},
      el('button',{class:'btn pri',onclick:()=>{closeModal();openCooked(recipe,r);}},'Cooked it — use up the ingredients'),
      el('button',{class:'btn',onclick:()=>saveAsVariant(recipe,r,protein)},'Save this as its own recipe')));
  showModal(box);
}
async function saveAsVariant(orig,adapted,protein){
  const name=adapted.name+(protein?', '+protein:' (our way)');
  const rec=Object.assign({},adapted,{name,slug:slug(name),fileId:null,fileName:null,
    meta:Object.assign({},adapted.meta,{source:'adapted from '+orig.name,status:'untested',added:todayISO()})});
  try{ status('Saving…','busy'); await saveRecipe(rec); status('Saved','good'); toast('Saved as “'+name+'”.'); closeModal(); render(); }
  catch(e){ status('Save failed','err'); toast(e.message); }
}

/* ============================================================
   RECEIPTS — photograph now, read later
   The photo goes to Drive and gets logged in receipts-queue.md.
   Ask Claude to process the queue and it fills in the pantry and prices.
   ============================================================ */
function pickReceipt(onDone){
  const inp=el('input',{type:'file',accept:'image/*',capture:'environment',style:'display:none'});
  inp.addEventListener('change',async()=>{
    const f=inp.files&&inp.files[0];
    if(!f)return;
    try{ const res=await uploadReceipt(f); onDone&&onDone(null,res); }
    catch(e){ onDone&&onDone(e); }
    inp.remove();
  });
  document.body.append(inp);
  inp.click();
}
async function uploadReceipt(file){
  status('Uploading the receipt…','busy');
  if(!S.ids.receipts){ await syncAll(); }
  if(!S.ids.receipts) throw new Error('Not connected to Drive yet');
  const d=new Date();
  const stamp=fmtDate(d)+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  const ext=(file.name.match(/\.(jpe?g|png|heic|webp)$/i)||['.jpg'])[0];
  const name='receipt-'+stamp+ext.toLowerCase();
  const up=await Drive.createBinary(name,S.ids.receipts,file,file.type||'image/jpeg');
  S.receipts.rows.push({when:fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
    file:name,id:up.id,status:'new'});
  const text=serializeReceipts(S.receipts); S.receipts.raw=text;
  await saveFile('receipts-queue.md',text);
  saveCache();
  status('Receipt saved · '+S.receipts.rows.length+' waiting to be read','good');
  return {name,id:up.id};
}

function libraryWarnings(){
  const out=[];
  S.recipes.forEach(r=>{
    if(!r.ingredients.length)out.push({level:'bad',text:r.name+' — no ingredients section'});
    if(!r.steps.length)out.push({level:'bad',text:r.name+' — no steps'});
    if(!r.meta.serves)out.push({level:'warn',text:r.name+' — no serving size'});
    if(!r.tags.length)out.push({level:'warn',text:r.name+' — no tags, the planner will rarely pick it'});
    r.steps.forEach(s=>{ const m=/^@([a-z0-9-]+)/i.exec(s.trim());
      if(m&&!S.steps.map[m[1]])out.push({level:'bad',text:r.name+' — refers to @'+m[1]+' which is not in the step library'}); });
    const nv=S.rules.never.filter(n=>r.ingredients.some(i=>sameThing(n,i.item)));
    nv.forEach(n=>out.push({level:'bad',text:r.name+' — contains '+n+' (Never list)'}));
  });
  // repeated step text across recipes = candidate for the step library
  const counts={};
  S.recipes.forEach(r=>r.steps.forEach(s=>{ if(/^@/.test(s))return; const k=norm(s).slice(0,60);
    if(k.length<20)return; (counts[k]=counts[k]||{n:0,ex:s}).n++; }));
  Object.values(counts).filter(c=>c.n>=2).slice(0,6).forEach(c=>
    out.push({level:'warn',text:`"${c.ex.slice(0,60)}…" appears in ${c.n} recipes — worth naming in the step library`}));
  if(!out.length)out.push({level:'ok',text:'Everything looks clean.'});
  return out;
}
function runRefactorAll(){
  const host=$('#refOut'); host.innerHTML='';
  const results=S.recipes.map(r=>Object.assign({r},refactor(r))).filter(x=>x.changes.length);
  if(!results.length){ host.append(h('div','card',h('p','muted','Nothing to change — the library already matches the house rules.'))); return; }
  const picks=new Set(results.map(x=>x.r.fileId));
  const card=h('div','card',
    h('div','row',h('h3','grow',results.length+' recipes would change'),
      el('button',{class:'btn pri',onclick:async()=>{
        let n=0; status('Applying…','busy');
        for(const x of results){
          if(!picks.has(x.r.fileId))continue;
          try{ const text=serializeRecipe(x.result);
            await Drive.write(x.r.fileId,text);
            Object.assign(x.r,parseRecipe(text,{id:x.r.fileId,name:x.r.fileName}));
            n++; status('Applying… '+n+'/'+results.length,'busy');
          }catch(e){ toast(x.r.name+': '+e.message); }
        }
        saveCache(); status('Applied to '+n+' recipes','good'); toast('Done — '+n+' rewritten.'); render();
      }},'Apply selected')));
  results.forEach(x=>{
    card.append(el('div',{style:'border-top:1px solid #26221c;padding-top:10px;margin-top:10px'},
      el('label',{class:'row',style:'cursor:pointer'},
        el('input',{type:'checkbox',checked:'checked',style:'width:auto',
          onchange:e=>{ e.target.checked?picks.add(x.r.fileId):picks.delete(x.r.fileId); }}),
        el('b',{class:'grow'},x.r.name),
        el('span',{class:'tiny dim'},x.changes.length+' edits')),
      changeList(x.changes)));
  });
  host.append(card);
}
function refactorOne(r){
  const {result,changes}=refactor(r);
  const ta=el('textarea',{rows:20,class:'mono'},serializeRecipe(result));
  showModal(h('div','box',
    h('div','row',h('h2','grow','Refactor: '+r.name),el('button',{class:'btn sm',onclick:closeModal},'Close')),
    changes.length?changeList(changes):h('p','muted','Nothing to change.'),
    ta,
    el('div',{class:'row',style:'margin-top:10px'},
      el('button',{class:'btn pri',onclick:async()=>{
        try{ await Drive.write(r.fileId,ta.value);
          Object.assign(r,parseRecipe(ta.value,{id:r.fileId,name:r.fileName}));
          saveCache(); closeModal(); toast('Saved.'); render();
        }catch(e){ toast(e.message); }
      }},'Save'))));
}

/* ---------------- FILES (raw text editing) ---------------- */
const EDITABLE=[
  ['house-rules.md','The brain. Swaps, never-eat list, house technique, protein swaps, thaw times.'],
  ['pantry.md','What we keep in the house. ! means we are out.'],
  ['steps-library.md','Named methods. Fix one here, every recipe improves.'],
  ['meal-plan.md','Trips, nights out, the plan itself.'],
  ['grocery-list.md','The shopping list.'],
  ['prices.md','Everything we have paid, and where. Append-only.'],
  ['stores.md','Which shop for what, and what is in season.'],
  ['receipts-queue.md','Photos waiting to be read.']
];
function viewFiles(){
  const wrap=h('div');
  wrap.append(h('div','card',h('h2',null,'The actual files'),
    h('p','small dim','Everything the app knows is in these files, in plain text, in your Drive. Edit them here or in any text editor — the app just reads whatever is there.'),
    S.ids.root?el('a',{class:'btn sm',target:'_blank',href:'https://drive.google.com/drive/folders/'+S.ids.root},'Open the folder in Drive'):null));
  EDITABLE.forEach(([name,desc])=>{
    wrap.append(h('div','card',
      h('div','row',h('h3','grow',name),
        el('button',{class:'btn sm',onclick:()=>editConfig(name)},'Edit')),
      h('div','small dim',desc)));
  });
  return wrap;
}
function editConfig(name){
  const cur={'house-rules.md':S.rules.raw,'pantry.md':S.pantry.raw,'steps-library.md':S.steps.raw,
    'meal-plan.md':S.plan.raw,'grocery-list.md':S.grocery.raw,
    'prices.md':S.prices.raw,'stores.md':S.stores.raw,'receipts-queue.md':S.receipts.raw}[name]||'';
  const ta=el('textarea',{rows:26,class:'mono'},cur);
  showModal(h('div','box',
    h('div','row',h('h2','grow',name),el('button',{class:'btn sm',onclick:closeModal},'Close')),
    ta,
    el('div',{class:'row',style:'margin-top:10px'},
      el('button',{class:'btn pri',onclick:async()=>{
        try{ status('Saving…','busy'); await saveFile(name,ta.value);
          const apply=(CONFIG_FILES.find(c=>c[0]===name)||[])[1]; if(apply)apply(ta.value);
          saveCache(); closeModal(); status('Saved','good'); toast('Saved.'); render();
        }catch(e){ status('Save failed','err'); toast(e.message); }
      }},'Save to Drive'))));
}

/* ---------------- MONEY ---------------- */
async function persistPrices(){
  const text=serializePrices(S.prices); S.prices.raw=text;
  try{ await saveFile('prices.md',text); saveCache(); }catch(e){ toast('Could not save: '+e.message); }
}
function viewMoney(){
  const wrap=h('div');
  const sp=spending();
  const months=Object.keys(sp.byMonth).sort().reverse();
  const thisMonth=months[0];

  wrap.append(h('div','card',
    el('div',{class:'row'},h('h2','grow','Money'),
      el('button',{class:'btn pri',onclick:openPurchaseForm},'Log a shop')),
    sp.rows.length
      ? el('div',{class:'row',style:'gap:26px;margin-top:6px'},
          el('div',{},h('div','tiny dim','SPENT ALL TIME'),h('h1',null,money(sp.total))),
          thisMonth?el('div',{},h('div','tiny dim',thisMonth.toUpperCase()),h('h1',null,money(sp.byMonth[thisMonth]))):null,
          el('div',{},h('div','tiny dim','PURCHASES LOGGED'),h('h1',null,String(sp.rows.length))))
      : h('p','muted','Nothing logged yet. Photograph a receipt on the Add tab and ask Claude to read it, or log a shop by hand.')));

  if(months.length){
    const max=Math.max(...months.map(m=>sp.byMonth[m]));
    wrap.append(h('div','card',h('h3',null,'By month'),
      el('div',{},months.map(m=>el('div',{class:'row',style:'padding:4px 0'},
        el('b',{style:'width:74px'},m),
        el('div',{class:'bar grow'},el('i',{style:'width:'+Math.round(sp.byMonth[m]/max*100)+'%'})),
        el('span',{style:'width:80px;text-align:right'},money(sp.byMonth[m])))))));
    const stores=Object.keys(sp.byStore).sort((a,b)=>sp.byStore[b]-sp.byStore[a]);
    wrap.append(h('div','card',h('h3',null,'By shop'),
      el('ul',{class:'clean'},stores.map(st=>el('li',{class:'row'},
        el('span',{class:'grow'},st),el('b',{},money(sp.byStore[st])))))));
  }

  const items=uniq((S.prices.buy||[]).map(b=>b.item)).sort();
  if(items.length){
    const card=h('div','card',h('h3',null,'What things cost'),
      h('p','small dim','Every price we have paid, most recent first. The cheapest is marked — that is what the shopping route falls back on when no rule says otherwise.'));
    items.forEach(it=>{
      const hist=priceHistory(it);
      const best=bestPrice(it);
      const up=unitPrice(it);
      card.append(el('div',{style:'border-top:1px solid #26221c;padding:8px 0'},
        el('div',{class:'row'},el('b',{class:'grow'},it),
          up?h('span','tiny dim','last '+money(up.paid)+' for '+up.amount+' at '+(up.store||'?')):null),
        el('div',{class:'chips',style:'margin-top:4px'},hist.map(b=>{
          const base=toBase(b.qty||'1',b.unit||'');
          const per=base&&base.n?b.price/base.n:null;
          const cheapest=best&&per!=null&&Math.abs(per-best.per)<1e-9;
          return h('span','tag',b.date+' · '+money(b.price)+' · '+([b.qty,b.unit].filter(Boolean).join(' ')||'1')
            +' · '+(b.store||'?')+(cheapest?'  ✓ cheapest':''));
        }))));
    });
    wrap.append(card);
  }

  const costs=S.recipes.map(r=>({r,c:recipeCost(r)})).filter(x=>x.c.priced.length)
    .sort((a,b)=>a.c.total-b.c.total);
  if(costs.length){
    wrap.append(h('div','card',h('h3',null,'What our meals cost'),
      h('p','small dim','Worked out from what we actually paid. Anything never bought is left out of the total and named, rather than guessed at.'),
      el('ul',{class:'clean'},costs.map(x=>el('li',{class:'row'},
        el('span',{class:'grow',style:'cursor:pointer',onclick:()=>openRecipe(x.r)},x.r.name),
        x.c.unpriced.length?h('span','tiny dim','no price for '+x.c.unpriced.join(', ')):null,
        el('b',{},costLabel(x.c)),
        h('span','tiny dim','serves '+(x.r.meta.serves||'2')))))));
  }

  wrap.append(h('div','card',h('h3',null,'Where to shop'),
    h('p','small dim','Edit stores.md to teach it. A rule under “Best for” always wins; otherwise it uses what is in season, then what each shop is good at, then wherever we last paid least.'),
    (S.stores.list||[]).length
      ? el('ul',{class:'clean'},S.stores.list.map(s=>el('li',{},
          el('b',{},s.name),h('span','dim','  '+s.good.join(', ')),s.note?h('div','tiny dim',s.note):null)))
      : h('p','muted','No shops listed yet.'),
    el('button',{class:'btn sm',onclick:()=>{go('files');setTimeout(()=>editConfig('stores.md'),50);}},'Edit stores.md')));
  return wrap;
}
function openPurchaseForm(prefillOther){
  const rows=[];
  const list=h('div',null);
  const addRow=(item,qty,price)=>{
    const r={item:item||'',qty:qty||'',price:price||''};
    rows.push(r);
    list.append(el('div',{class:'row',style:'padding:4px 0'},
      el('input',{type:'text',placeholder:'item',value:r.item,style:'flex:2',oninput:e=>r.item=e.target.value}),
      el('input',{type:'text',placeholder:'2 lb',value:r.qty,style:'flex:1',oninput:e=>r.qty=e.target.value}),
      el('input',{type:'text',placeholder:'0.00',value:r.price,style:'width:90px',oninput:e=>r.price=e.target.value})));
  };
  S.grocery.need.concat(S.grocery.manual).filter(Boolean).slice(0,12).forEach(t=>{
    const p=parseIngredient(t);
    addRow(p.item,[p.qty,p.unit].filter(Boolean).join(' '),'');
  });
  if(!rows.length)addRow();
  const dateIn=el('input',{type:'date',value:todayISO(),style:'width:auto'});
  const storeIn=el('input',{type:'text',placeholder:'shop',style:'width:auto',
    value:(S.stores.list[0]||{}).name||''});
  const lumpIn=el('input',{type:'text',placeholder:'e.g. farm share, or what a guest bought',style:'flex:2'});
  const lumpAmt=el('input',{type:'text',placeholder:'0.00',style:'width:90px'});
  showModal(h('div','box',
    h('div','row',h('h2','grow','Log a shop'),el('button',{class:'btn sm',onclick:closeModal},'Close')),
    h('p','small dim','Pre-filled from the grocery list. Anything logged here tops the pantry back up, records the price, and counts towards the spending total. Leave a price blank to skip a line.'),
    el('div',{class:'row'},dateIn,storeIn),
    el('div',{class:'row tiny dim',style:'margin-top:10px'},
      el('span',{style:'flex:2'},'ITEM'),el('span',{style:'flex:1'},'AMOUNT'),el('span',{style:'width:90px'},'PRICE')),
    list,
    el('button',{class:'btn sm',onclick:()=>addRow()},'Another line'),
    hr(),
    h('div','stockgroup','Or just a lump sum'),
    h('p','small dim','For a farm share, or money a guest spent that we are never going to itemise. It still counts towards the total.'),
    el('div',{class:'row'},lumpIn,lumpAmt),
    el('div',{class:'row',style:'margin-top:14px'},
      el('button',{class:'btn pri',onclick:async()=>{
        const items=rows.filter(r=>r.item.trim()&&String(r.price).trim()).map(r=>{
          const a=parseAmount(r.qty);
          return {item:r.item.trim(),qty:a.qty,unit:a.unit,price:r.price};
        });
        const other=lumpIn.value.trim()&&lumpAmt.value.trim()
          ? [{what:lumpIn.value.trim(),price:lumpAmt.value}] : [];
        if(!items.length&&!other.length)return toast('Nothing to log.');
        recordPurchase({date:dateIn.value,store:storeIn.value,items,other});
        status('Saving…','busy');
        await persistPrices(); markStockDirty();
        closeModal(); status('Logged','good');
        toast((items.length+other.length)+' logged, pantry topped up.'); render();
      }},'Save'))));
}

/* ---------------- SETTINGS ---------------- */
function viewSettings(){
  const wrap=h('div');
  const cid=el('input',{type:'text',value:LS.get('clientId',''),placeholder:'1234-abcd.apps.googleusercontent.com'});
  const key=el('input',{type:'password',value:LS.get('anthropicKey',''),placeholder:'sk-ant-… (optional)'});
  const modelSel=el('select',{},el('option',{value:LS.get('anthropicModel','claude-sonnet-4-5')},LS.get('anthropicModel','claude-sonnet-4-5')));
  wrap.append(h('div','card',
    h('h2',null,'Google Drive'),
    h('p','small dim','Paste the OAuth Client ID from your Google Cloud project here. See the setup guide that came with this file — four minutes, once, and then this works on any computer you open it on.'),
    el('label',{class:'f'},el('span',{},'OAuth Client ID'),cid),
    el('label',{class:'f'},el('span',{},'Drive folder name'),
      el('input',{type:'text',value:LS.get('folderName',APP.FOLDER),
        onchange:e=>LS.set('folderName',e.target.value.trim()||APP.FOLDER)})),
    el('div',{class:'row'},
      el('button',{class:'btn pri',onclick:async()=>{
        LS.set('clientId',cid.value.trim()); Drive.client=null; Drive.token=null; LS.del('tok');
        if(!Drive.init())return toast('Google library not loaded yet — reload the page.');
        try{ await Drive.auth(true); toast('Connected.'); await syncAll(); render(); }
        catch(e){ toast('Sign-in failed: '+e.message); }
      }},'Save and connect'),
      el('button',{class:'btn',onclick:async()=>{ await syncAll(); render(); }},'Sync now'),
      el('span',{class:'small dim'},'This browser: '+(window.location.origin||'file://')))));

  wrap.append(h('div','card',
    h('h2',null,'Smarter adapting (optional)'),
    h('p','small dim','With an Anthropic API key, pasted recipes get rewritten by Claude against your house rules instead of by simple find-and-replace. It is a big quality difference on messy sources like video transcripts. Costs a fraction of a cent per recipe. Without a key everything else still works.'),
    el('label',{class:'f'},el('span',{},'API key'),key),
    el('label',{class:'f'},el('span',{},'Model'),modelSel),
    el('div',{class:'row'},
      el('button',{class:'btn',onclick:async()=>{
        LS.set('anthropicKey',key.value.trim());
        try{ const ms=await aiModels(); modelSel.innerHTML='';
          ms.forEach(m=>modelSel.append(el('option',{value:m,selected:m===LS.get('anthropicModel','')?'selected':null},m)));
          modelSel.onchange=()=>LS.set('anthropicModel',modelSel.value);
          if(!ms.includes(LS.get('anthropicModel','')))LS.set('anthropicModel',ms[0]);
          toast('Key works — '+ms.length+' models available.');
        }catch(e){ toast('Key check failed: '+e.message); }
      }},'Save key and load models'))));

  wrap.append(h('div','card',
    h('h2',null,'This device'),
    h('div','kv',
      el('b',{},'Recipes'),el('span',{},String(S.recipes.length)),
      el('b',{},'Last sync'),el('span',{},S.loadedAt?new Date(S.loadedAt).toLocaleString():'never'),
      el('b',{},'Drive folder'),el('span',{},S.ids.root||'not found yet'),
      el('b',{},'Version'),el('span',{},APP.VER)),
    el('div',{class:'row',style:'margin-top:10px'},
      el('button',{class:'btn',onclick:()=>{LS.del('cache');location.reload();}},'Clear local cache'),
      el('button',{class:'btn danger',onclick:()=>{
        if(confirm('Forget the sign-in and API key on this computer? Your Drive data is untouched.')){
          LS.del('tok');LS.del('anthropicKey');LS.del('clientId');location.reload();}
      }},'Sign out of this device'))));
  return wrap;
}

/* ---------------- modal ---------------- */
function showModal(box){
  closeModal();
  const m=el('div',{class:'modal',onclick:e=>{ if(e.target===m)closeModal(); }},box);
  $('#modalHost').append(m);
  document.body.style.overflow='hidden';
}
function closeModal(){ $('#modalHost').innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* ---------------- boot ---------------- */
$('#btnSync').addEventListener('click',async()=>{ await syncAll(); render(); });
$('#btnSignin').addEventListener('click',async()=>{
  try{ await Drive.auth(true); await syncAll(); render(); }catch(e){ toast(e.message); }
});

async function boot(){
  renderNav();
  if(UI.scanMode)document.querySelector('header').classList.add('hide');
  const cached=loadCache();
  render();
  if(cached) status('Showing the last synced copy…','');
  const url=new URL(location.href);
  if(url.searchParams.get('client_id')) LS.set('clientId',url.searchParams.get('client_id'));
  let tries=0;
  while(!(window.google&&google.accounts)&&tries<40){ await new Promise(r=>setTimeout(r,150)); tries++; }
  if(!Drive.clientId()){ status('Needs a one-time setup — open Settings','err'); $('#btnSignin').classList.remove('hide'); render(); return; }
  if(!Drive.init()){ status('Google sign-in did not load. Are you offline?','err'); return; }
  try{
    await Drive.auth(false);
    await syncAll();
  }catch(e){
    status('Tap Connect Drive to sign in','');
    $('#btnSignin').classList.remove('hide');
  }
  render();
}
boot();
