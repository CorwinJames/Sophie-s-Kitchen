<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sophie’s Kitchen</title>
<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#232019; --line:#332e26;
  --ink:#f2ece2; --ink2:#b8ae9e; --ink3:#7d7466;
  --hot:#e0703a; --hot2:#f0a06a; --ok:#7fa86a; --warn:#d9a441; --bad:#c05646;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--hot2)}
h1,h2,h3,h4{margin:0 0 .4em;font-weight:600;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:17px}
h3{font-size:15px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.right{margin-left:auto}
.hide{display:none !important}

/* shell */
header{
  position:sticky;top:0;z-index:20;background:rgba(18,16,14,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand span{color:var(--hot)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--ink2);
  cursor:pointer;white-space:nowrap;font-size:14px
}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button.on{background:var(--hot);color:#1a1005;font-weight:600}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}

/* bits */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:12px}
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;cursor:pointer;color:var(--ink);white-space:nowrap
}
.btn:hover{border-color:#4a4236;background:#2b271f}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#1a1005;font-weight:600}
.btn.pri:hover{background:var(--hot2);border-color:var(--hot2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:#4a2e28}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%
}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--hot)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;
  font-size:13px;user-select:none
}
.chip:hover{border-color:#4a4236}
.chip.on{background:var(--hot);border-color:var(--hot);color:#1a1005;font-weight:600}
.chip.out{opacity:.45;text-decoration:line-through;border-style:dashed}
.chip.out:hover{opacity:.85;text-decoration:none;border-color:var(--ok);color:var(--ok)}
.chip .x{opacity:.35;font-weight:700;font-size:12px;line-height:1}
.chip:hover .x{opacity:.9;color:var(--bad)}
.chip.out:hover .x{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stockgroup{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.chip.lvl-some{border-color:#4a4236}
.chip.lvl-low{border-color:var(--warn);color:var(--warn)}
.chip .lv{font-size:10.5px;opacity:.75;font-weight:600;letter-spacing:.03em}
.chip .qty{font-size:10.5px;opacity:.6}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0}
.sec .n{color:var(--ink3);font-size:13px}
.searchbar{display:flex;gap:8px;align-items:center}
.searchbar input{font-size:16px;padding:11px 13px}
.chg{display:block;padding:4px 0;font-size:13.5px}
.chg b{font-weight:600}
.chg.sub b{color:var(--ok)}
.chg.protein b{color:var(--hot2)}
.chg.drop b{color:var(--ink3)}
.chg.add b{color:var(--ok)}
.chg.technique b{color:var(--hot2)}
.chg.missing b{color:var(--warn)}
.chg.warn b{color:var(--bad)}
.chg.scratch b{color:#9ad0c8}
.scratch{color:#9ad0c8}
.pill.scratch{background:#1d3330;color:#9ad0c8}
.steps-scratch{color:#9ad0c8;font-weight:600;margin-top:6px}

/* the cook's log */
.logentry{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.logentry:hover{border-left-color:var(--hot)}
.logdate{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px}
.logdate .del{opacity:0;cursor:pointer;color:var(--bad);font-weight:700}
.logentry:hover .logdate .del{opacity:.6}
.logdate .del:hover{opacity:1}
.logtext{white-space:pre-wrap;margin-top:2px}
.lastnote{background:#231d16;border:1px solid #4a3b28;border-left:3px solid var(--warn);
  border-radius:8px;padding:10px 12px;margin:10px 0}
.lastnote .h{font-size:11.5px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.jot{background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px}
.jot textarea{border:0;background:transparent;padding:0;min-height:70px}
.jot .h{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.jot .saved{font-size:11.5px;color:var(--ok)}
.was{color:var(--ink3);text-decoration:line-through}
.subbed{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--hot);color:#1a1005;font-weight:600}
.scanwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:70vh;text-align:center;gap:18px}
.scanbtn{width:min(320px,80vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--hot);
  background:var(--panel2);color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.scanbtn:active{background:var(--hot);color:#1a1005}

/* Cook: recipes lead, the house sits beside them */
.cooklayout{display:grid;grid-template-columns:284px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.cooklayout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:62px;max-height:calc(100vh - 130px);overflow:auto;padding:12px}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:#332e26;border-radius:4px}
.sidehead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sidehead h3{margin:0}
.pgroup{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;
  margin:12px 0 3px;padding:0 8px}
.pitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;
  cursor:pointer;user-select:none;font-size:13.5px;line-height:1.3;
  -webkit-touch-callout:none;-webkit-user-select:none}
.pitem:hover{background:var(--panel2)}
.pitem.on{background:var(--hot);color:#1a1005;font-weight:600}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .lvl{font-size:10px;letter-spacing:.04em;opacity:.55;white-space:nowrap}
.pitem .frz{font-size:10px;opacity:.45;flex:none}
.pitem.on .frz{opacity:.8}
.pitem.on .lvl{opacity:.7}
.pitem .kill{opacity:0;font-weight:700;font-size:14px;line-height:1;padding:1px 5px;
  border-radius:5px;color:var(--bad);flex:none}
.pitem:hover .kill,.pitem:focus-within .kill{opacity:.6}
.pitem .kill:hover{opacity:1;background:#3a201b}
.pitem.on .kill{color:#6b2214}
.pitem.on .kill:hover{background:#00000022;color:#4a1610}
.pitem.pressing{background:#3a201b;color:var(--ink)}
.pitem.gone{opacity:.45;text-decoration:line-through}
.pitem.gone:hover{opacity:.8;text-decoration:none;color:var(--ok)}
.sidefind{width:100%;margin-bottom:4px;font-size:13px;padding:6px 9px}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.tag{display:inline-block;background:#2a2419;border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;font-size:11.5px;color:var(--ink2);margin:0 4px 4px 0}
.bar{height:5px;background:#2a251d;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--hot)}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:#25331e;color:#a8d18d}
.pill.warn{background:#3a2f14;color:#e6c268}
.pill.bad{background:#3a201b;color:#e08b78}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv b{color:var(--ink2);font-weight:400}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:5px 0;border-bottom:1px solid #26221c}
ul.clean li:last-child{border-bottom:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.split{grid-template-columns:1fr}.hwrap{flex-wrap:wrap}}

/* status */
#status{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel2);
  border-top:1px solid var(--line);padding:7px 16px;font-size:13px;display:flex;gap:10px;align-items:center}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
#status.busy .dot{background:var(--warn)}
#status.good .dot{background:var(--ok)}
#status.err .dot{background:var(--bad)}
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:40;
  background:#2c2720;border:1px solid var(--line);border-radius:8px;padding:9px 16px;
  box-shadow:0 8px 24px #0008;opacity:0;transition:opacity .18s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-start;
  justify-content:center;padding:24px 12px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:min(860px,100%);padding:18px}

/* diff */
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;
  background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:320px}
.diff .del{color:#e08b78;background:#3a201b55;text-decoration:line-through}
.diff .add{color:#a8d18d;background:#25331e55}
.step-ref{color:var(--hot2);font-weight:600;cursor:help;border-bottom:1px dotted var(--hot2)}
.miss{color:var(--warn)}
.sub{color:var(--ok)}

/* ---------------- BAKE ---------------- */
.subbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);
  padding:7px 13px;border-radius:99px;cursor:pointer}
.subbar button.on{background:var(--hot);border-color:var(--hot);color:#1a120c;font-weight:600}
.bakelayout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bakelayout{grid-template-columns:1fr}}
.bakeside{display:flex;flex-direction:column;gap:12px;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding-right:4px}
@media (max-width:900px){.bakeside{position:static;max-height:none;overflow:visible}}
.bakemain{display:flex;flex-direction:column;gap:14px;min-width:0}

.fld{display:flex;align-items:center;gap:8px;margin:8px 0}
.fld .fldl{flex:1;color:var(--ink2);font-size:13px}
.fld input,.fld select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;width:112px;text-align:right}
.fld .fldl{cursor:pointer}
/* our own stepper — the native arrows sit on top of right-aligned digits */
.numwrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--panel2);flex:none}
.numwrap input[type=number]{border:none;background:none;border-radius:0;width:66px;text-align:center;padding:6px 2px;
  -moz-appearance:textfield}
.numwrap.tight input[type=number]{width:48px;padding:5px 2px;font-size:13px}
.numwrap.tight button.stp{width:26px;font-size:14px}
.numwrap input[type=number]::-webkit-inner-spin-button,
.numwrap input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
.numwrap input:focus{outline:none;background:rgba(224,112,58,.10)}
.numwrap:focus-within{border-color:var(--hot)}
button.stp{background:var(--panel);border:none;color:var(--ink2);width:30px;cursor:pointer;
  font-size:16px;line-height:1;padding:0;user-select:none;-webkit-user-select:none;flex:none;
  transition:background .08s}
button.stp:hover{background:var(--hot);color:#1a120c}
button.stp:active{background:var(--hot2);color:#1a120c}
.fld select:focus{outline:2px solid var(--hot);outline-offset:-1px;border-color:var(--hot)}
.fld input[type=datetime-local]{width:auto;min-width:184px;text-align:left}
.fld select{width:auto;max-width:190px;text-align:left}
.fld .fldu{color:var(--ink3);font-size:12px;width:22px;flex:none}
.fld.small{margin:4px 0}
.fld.small select{width:96px;padding:4px 6px;font-size:13px}
.fld.small .fldl{font-size:12px}
.hint{font-size:12px;line-height:1.55;color:var(--ink3);margin:2px 0 12px;border-left:2px solid var(--line);padding-left:9px}
input.wide{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;text-align:left}
.howto{margin-top:14px;padding:12px 14px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--hot)}
.howto h3{margin-bottom:6px}
.howto p{margin:6px 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{margin-top:3px}
.lockrow{display:flex;flex-direction:column;gap:2px;margin:8px 0;padding:8px;background:var(--panel2);border-radius:8px}

.blendrow{display:flex;flex-direction:column;gap:5px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.blendrow:last-of-type{border-bottom:none}
.blendrow select.fname{width:100%;max-width:none;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;text-align:left}
.blendfoot{display:flex;gap:6px;align-items:center}
.blendfoot .fldu{color:var(--ink3);font-size:12px}
.blendfoot button.x{margin-left:auto}
.blendrow .pctin{text-align:center}
button.x{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
button.x:hover{color:var(--bad)}
button.link{background:none;border:none;color:var(--hot2);cursor:pointer;padding:0;text-align:left;text-decoration:underline}

table.formula{width:100%;border-collapse:collapse;margin:6px 0}
table.formula th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
table.formula td{padding:6px;border-bottom:1px solid var(--line)}
table.formula .r,table.deltas .r{text-align:right;font-variant-numeric:tabular-nums}
table.formula tfoot td{font-weight:600;border-bottom:none;border-top:1px solid var(--line)}
table.formula tr.k-levain td,table.formula tr.k-salt td{color:var(--hot2)}
table.formula tr.subrow td{font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line);padding-top:0}
table.deltas{width:100%;border-collapse:collapse;margin:6px 0}
table.deltas td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.deltas tr.anchor td,table.deltas tr.tot td{font-weight:600}
table.deltas tr.tot td{border-bottom:none;border-top:1px solid var(--line)}
.big{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:8px 0 2px}

.tier{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;cursor:help}
.t-pr{background:#1e3320;border-color:#31552f;color:#a7d39a}
.t-prderived{background:#2a3320;border-color:#4a5530;color:#c8d39a}
.t-std{background:#1e2c33;border-color:#2f4a55;color:#9ac3d3}
.t-bk{background:#2a2333;border-color:#463a55;color:#c2a7d3}
.t-ind{background:#33301e;border-color:#55502f;color:#d3c89a}
.t-prac{background:#33261e;border-color:#553d2f;color:#d3b39a}
.t-craft{background:#2b2b2b;border-color:#454545;color:#b5b5b5}
.t-nodata{background:#331e1e;border-color:#552f2f;color:#d39a9a}
.src{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.45}
.why{margin:10px 0;padding:8px 10px;background:var(--panel2);border-radius:8px;font-size:13px;color:var(--ink2)}

.alert{padding:10px 12px;border-radius:8px;margin:8px 0;font-size:13px;line-height:1.5}
.alert.hard{background:#3a1f1a;border:1px solid #6a3227;color:#f0c4ba}
.alert.soft{background:#332a1a;border:1px solid #5a4a27;color:#e8d8b0}
.warnline{color:var(--warn);font-size:13px}

.timeline{display:flex;flex-direction:column;gap:0;margin:8px 0}
.tstep{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tstep:last-child{border-bottom:none}
.twhen{font-size:12px;color:var(--hot2);font-variant-numeric:tabular-nums;padding-top:2px}
.tlabel{font-weight:600}
.tdur{color:var(--ink3);font-weight:400;font-size:12px;margin-left:8px}
.tdetail{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5}

.limit{padding:10px 12px;border-radius:8px;background:var(--panel2);margin:8px 0}
.limit.soft{border-left:3px solid var(--warn)}
.limit.hard{border-left:3px solid var(--bad)}
.lhead{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px;flex-wrap:wrap}
.limit p{margin:4px 0;font-size:13px;line-height:1.55}
ol.proto{margin:8px 0 4px;padding-left:20px;font-size:13px;color:var(--ink2)}
ol.proto li{margin:4px 0}
.ovrow{padding:8px 0;border-bottom:1px solid var(--line)}
.ovrow:last-child{border-bottom:none}
.ovv{font-size:15px;margin:2px 0}
.honest{padding:8px 0;border-bottom:1px solid var(--line)}
.honest:last-child{border-bottom:none}
.honest h3{margin-bottom:3px}
.honest p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}
.tierkey{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.tkrow{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
ul.srclist{margin:8px 0;padding-left:0;list-style:none}
ul.srclist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);line-height:1.5}
.btag{padding:10px 0;border-bottom:1px solid var(--line)}
.btag:last-child{border-bottom:none}
.btaghead{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.btaghead code{background:var(--hot);color:#1a120c;padding:3px 8px;border-radius:5px;font-weight:700;font-size:12px;letter-spacing:.02em}
.btag p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}

<body>
<header>
  <div class="hwrap">
    <div class="brand">Sophie’s <span>Kitchen</span></div>
    <nav id="nav"></nav>
    <div class="right row">
      <button class="btn sm" id="btnSync">Sync</button>
      <button class="btn sm pri hide" id="btnSignin">Connect Drive</button>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="status"><span class="dot"></span><span id="statusText">Starting…</span>
  <span class="right dim tiny" id="statusMeta"></span></div>
<div id="toast"></div>
<div id="modalHost"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   Kitchen — local-first recipe system backed by Google Drive
   Everything lives as plain text .md files in your Drive folder.
   This app is just a lens on those files. Delete it and your data
   is still perfectly readable.
   ============================================================ */

const APP = {
  NAME: 'Sophie’s Kitchen',
  FOLDER: 'Recipes',            // top-level folder name in My Drive
  DINNER_HOUR: 18,              // used for thaw math
  VER: '3.4'
};

/* ---------- tiny store (degrades if storage is blocked) ---------- */
const LS = (()=>{
  let mem = {};
  let ok = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ ok=false; }
  return {
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ const s=JSON.stringify(v);
      if(!ok){ mem[k]=s; return; }
      try{ localStorage.setItem(k,s); }
      catch(e){ mem[k]=s; if(/quota|exceeded/i.test((e&&(e.name+' '+e.message))||''))throw e; } },
    del(k){ try{ ok?localStorage.removeItem(k):delete mem[k];}catch(e){} }
  };
})();

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==='class')n.className=a[k]; else if(k==='html')n.innerHTML=a[k];
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)n.setAttribute(k,a[k]); }
  kids.flat().forEach(c=>{ if(c==null||c===false)return; n.append(c.nodeType?c:document.createTextNode(c)); });
  return n;};
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'recipe';
const uniq = a=>[...new Set(a)];
const todayISO = ()=>fmtDate(new Date());
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim()); if(!m)return null;
  return new Date(+m[1],+m[2]-1,+m[3],12,0,0); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a,b){ return Math.round((parseDate(b)-parseDate(a))/864e5); }
function weekday(iso){ const d=parseDate(iso); return d?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]:''; }
function niceDate(iso){ const d=parseDate(iso); if(!d)return iso;
  return weekday(iso)+' '+(d.getMonth()+1)+'/'+d.getDate(); }
function niceTime(d){ let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
  const ap=h<12?'am':'pm'; h=h%12||12; return h+(m==='00'?'':':'+m)+ap; }

function toast(msg,ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),ms); }
function status(text,kind=''){ $('#statusText').textContent=text; $('#status').className=kind; }

/* ============================================================
   TEXT FORMAT — parsers and serializers
   These define the file format. Keep them tolerant: a human typing
   into Drive on a phone should never be able to "break" a file.
   ============================================================ */

/* split "## Section" blocks out of a markdown doc */
function sections(text){
  const out={_head:[]}; let cur='_head';
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m=/^##\s+(.+?)\s*$/.exec(line);
    if(m){ cur=m[1].trim().toLowerCase(); out[cur]=out[cur]||[]; }
    else (out[cur]=out[cur]||[]).push(line);
  });
  return out;
}
/* bullet lines only, comments and prose stripped */
function bullets(lines){
  return (lines||[]).map(l=>l.trim())
    .filter(l=>/^[-*]\s+/.test(l))
    .map(l=>l.replace(/^[-*]\s+/,'').trim())
    .filter(l=>l && l!=='-');
}

/* ---------- units & ingredient normalisation ---------- */
const UNIT_CANON={
  teaspoon:'tsp',teaspoons:'tsp',tsp:'tsp',tsps:'tsp',
  tablespoon:'tbsp',tablespoons:'tbsp',tbsp:'tbsp',tbsps:'tbsp',tbs:'tbsp',
  cup:'cup',cups:'cup',c:'cup',
  ounce:'oz',ounces:'oz',oz:'oz',
  pound:'lb',pounds:'lb',lb:'lb',lbs:'lb',
  gram:'g',grams:'g',g:'g',kilogram:'kg',kilograms:'kg',kg:'kg',
  milliliter:'ml',milliliters:'ml',ml:'ml',liter:'l',liters:'l',l:'l',
  clove:'clove',cloves:'clove',can:'can',cans:'can',pinch:'pinch',pinches:'pinch',
  bunch:'bunch',bunches:'bunch',slice:'slice',slices:'slice',stick:'stick',sticks:'stick',
  quart:'qt',quarts:'qt',qt:'qt',pint:'pint',pints:'pint',head:'head',heads:'head',
  sprig:'sprig',sprigs:'sprig',piece:'piece',pieces:'piece',handful:'handful',
  dash:'dash',dashes:'dash',package:'pkg',packages:'pkg',pkg:'pkg',package_:'pkg',
  floz:'floz',flozs:'floz','fl oz':'floz','fluid ounce':'floz','fluid ounces':'floz',
  gallon:'gal',gallons:'gal',gal:'gal',
  dozen:'dozen',dozens:'dozen',doz:'dozen',handful:'handful',handfuls:'handful',
  leaf:'leaf',leaves:'leaf',knob:'knob',knobs:'knob',splash:'splash',splashes:'splash',
  drizzle:'drizzle',glug:'glug',squeeze:'squeeze',squeezes:'squeeze',drop:'drop',drops:'drop',
  stalk:'stalk',stalks:'stalk'
};
/* "2 lb", "1 1/2 cups", "12" — a bare amount with no ingredient after it */
function parseAmount(str){
  const s=deVulgar(String(str||'')).trim();
  if(!s)return {qty:null,unit:null};
  const m=/^([\d.\/]+(?:\s+\d+\/\d+)?)\s*([a-zA-Z ]*)$/.exec(s);
  if(!m)return {qty:null,unit:null};
  const u=(m[2]||'').trim().toLowerCase().replace(/\s+/g,' ');
  return {qty:m[1].trim(), unit:UNIT_CANON[u]||UNIT_CANON[u.replace(/\s/g,'')]||(u||null)};
}
const VULGAR={'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
function deVulgar(s){ return String(s).replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g,c=>' '+VULGAR[c]).replace(/\s+/g,' ').trim(); }

/* words that describe prep, not identity — dropped when matching */
const PREP=['fresh','freshly','chopped','finely','roughly','diced','minced','sliced','thinly','shredded',
 'grated','crushed','smashed','peeled','trimmed','rinsed','drained','packed','softened','melted','room',
 'temperature','large','small','medium','extra','ripe','optional','taste','cold','warm','hot','dry','dried?no',
 'boneless','bone-in','skin-on','skinless','whole','halved','quartered','cubed','julienned','beaten',
 'leftover','any','good','quality','plus','more','for','serving','garnish','divided','about','approximately',
 'frozen','thawed','defrosted',
 'leaves','leaf','sprigs','sprig','stalks','stalk','fronds','tops','needed','required',
 'a','an','little','few','extra','best','your','favourite','favorite','preferably','of',
 /* amounts that arrive as words rather than numbers */
 'pinch','pinches','handful','handfuls','splash','splashes','knob','knobs','dash','dashes',
 'drizzle','glug','squeeze','sprinkling','grating','generous','scant','heaped','heaping','level'];
const SYN={
  'scallion':'green onion','scallions':'green onion','spring onion':'green onion',
  'coriander leaf':'cilantro','yellow onion':'onion','white onion':'onion','red onion':'onion',
  'all purpose flour':'flour','all-purpose flour':'flour','ap flour':'flour',
  'kosher salt':'salt','sea salt':'salt','table salt':'salt','flaky salt':'salt',
  'chicken thighs':'chicken thigh','chicken breasts':'chicken breast',
  'short rib':'short ribs','beef short rib':'short ribs','beef short ribs':'short ribs',
  'olive oil extra virgin':'olive oil','extra virgin olive oil':'olive oil',
  'garlic clove':'garlic','cloves garlic':'garlic','garlic cloves':'garlic',
  'chicken broth':'chicken stock','beef broth':'beef stock','vegetable broth':'vegetable stock',
  'tomatoes canned':'canned tomatoes','crushed tomatoes':'canned tomatoes','diced tomatoes':'canned tomatoes',
  'soy':'soy sauce','parmigiano reggiano':'parmesan','parmigiano':'parmesan',
  'chicken backs':'chicken bones','chicken back':'chicken bones',
  'chicken carcass':'chicken bones','chicken frames':'chicken bones',
  'chicken wings':'chicken wing',
  /* a British cookbook in an American kitchen */
  'chilli':'chili','chillies':'chili','chilli powder':'chili powder','chilli flakes':'red pepper flakes',
  'courgette':'zucchini','courgettes':'zucchini','aubergine':'eggplant','aubergines':'eggplant',
  'rocket':'arugula','prawn':'shrimp','prawns':'shrimp','mangetout':'snow peas',
  'coriander leaves':'cilantro','fresh coriander':'cilantro',
  'plain flour':'flour','strong white flour':'bread flour','cornflour':'cornstarch',
  'caster sugar':'sugar','icing sugar':'powdered sugar','demerara sugar':'brown sugar',
  'double cream':'heavy cream','single cream':'cream','soured cream':'sour cream',
  'natural yoghurt':'yogurt','yoghurt':'yogurt',
  'bicarbonate of soda':'baking soda','tomato purée':'tomato paste','tomato puree':'tomato paste',
  'streaky bacon':'bacon','back bacon':'bacon','gammon':'ham','beetroot':'beet','swede':'rutabaga',
  'sultanas':'raisins','flat-leaf parsley':'parsley','flat leaf parsley':'parsley',
  'spring greens':'collard greens','pepper deseeded':'bell pepper',
  'greek yoghurt':'greek yogurt','sunflower oil':'vegetable oil','rapeseed oil':'canola oil'
};
function singular(w){
  if(/(ss|us|is)$/.test(w))return w;
  if(/oes$/.test(w)&&w.length>4)return w.slice(0,-2);   // tomatoes, potatoes
  if(/ies$/.test(w))return w.slice(0,-3)+'y';
  if(/(ches|shes|xes|sses)$/.test(w))return w.slice(0,-2);
  if(/s$/.test(w)&&w.length>3)return w.slice(0,-1);
  return w;
}
/* "oil for frying", "flour for dusting", "parsley to garnish" — the tail says
   what it is FOR, not what it IS. Strip it so the ingredient is just the thing. */
const PURPOSE=/\s*(?:,\s*)?(?:\bplus\s+(?:more|extra)\s+)?\b(?:for|to)\s+(?:frying|deep[- ]frying|shallow[- ]frying|dusting|dredging|coating|greasing|oiling|brushing|drizzling|sprinkling|serving|serve|garnish|garnishing|topping|finishing|finish|taste|thin|thicken|the\s+pan|the\s+tin|the\s+tray)\b.*$/i;
const ASNEEDED=/\s*(?:,\s*)?(?:or\s+)?as\s+(?:needed|required)\b.*$/i;
const PLUSMORE=/\s*,?\s*plus\s+(?:more|extra)\b.*$/i;
/* British book, American kitchen: "plain [all-purpose] flour" is all-purpose
   flour, "cornflour [cornstarch]" is cornstarch. But "225g [8oz] chorizo" is a
   unit conversion, not a translation — leave anything with digits alone. */
function preferBracketed(s){
  let t=String(s||'');
  t=t.replace(/([A-Za-z-]+)?\s*\[([^\]0-9]+)\]/g,(m,w,inner)=>' '+inner.trim()+' ');
  t=t.replace(/\[[^\]]*\]/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function stripPurpose(s){
  let t=String(s||'');
  t=t.replace(PURPOSE,'').replace(ASNEEDED,'').replace(PLUSMORE,'');
  t=t.replace(/[,\s]+$/,'').trim();
  return t||String(s||'');
}
/* the canonical key used for all matching */
function normCore(t){
  t=String(t||'').replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();
  if(SYN[t])t=SYN[t];
  let words=t.split(' ').filter(w=>{
    if(!w)return false;
    if(PREP.includes(w))return false;
    /* "extra-large" is two prep words wearing one hyphen. Drop it only when
       every part is prep — "self-raising" and "flat-leaf" must survive. */
    if(w.includes('-')){
      const parts=w.split('-').filter(Boolean);
      if(parts.length>1&&parts.every(x=>PREP.includes(x)))return false;
    }
    return true;
  });
  words=words.map(singular);
  t=words.join(' ').trim();
  if(SYN[t])t=SYN[t];
  return t;
}
/* norm is called a very large number of times — every ingredient against
   every pantry item against every class member — and it is pure, so it is
   worth remembering. Without this, one pass over a 400-recipe library was
   taking minutes. */
const _normCache=new Map();
function norm(s){
  const k=String(s==null?'':s);
  if(_normCache.has(k))return _normCache.get(k);
  const v=_norm(k);
  if(_normCache.size<50000)_normCache.set(k,v);
  return v;
}
function _norm(s){
  let t=deVulgar(preferBracketed(stripPurpose(String(s||'')))).toLowerCase();
  t=t.replace(/\([^)]*\)/g,' ');                       // drop parentheticals
  const raw=t.split(/\bor\b/).map(x=>x.trim()).filter(Boolean);
  if(raw.length<2)return normCore(t);
  /* Two shapes hide behind the same word.

       "chilli powder or flakes"        the first alternative names the thing
       "light or dark brown sugar"      the noun is only in the LAST one

     Taking the first alternative blindly turned "fresh or frozen cranberries"
     into "fresh", which is a prep word, which left nothing — so the
     ingredient vanished and a cranberry sauce with no cranberries reported
     "can make now". You can tell the shapes apart by length: if the last
     alternative is wordier than the first, the shared noun lives at its end.
     Quantities and units do not count towards that length. */
  const wc=x=>x.split(/\s+/).filter(w=>w&&!/^[\d./%-]+$/.test(w)&&!UNIT_CANON[w]).length;
  const first=raw[0], last=raw[raw.length-1];
  const order=wc(last)>wc(first)?[last,first].concat(raw):[first,last].concat(raw);
  for(const cand of order){ const n=normCore(cand); if(n)return n; }
  return '';
}
/* words that make a different product, not just a described version of the same one.
   "green onion" is not "onion"; "sesame oil" is not "oil"; "chicken stock" is not "stock". */
const DISTINCT=new Set(['green','spring','sesame','olive','avocado','coconut','almond','soy','fish',
 'oyster','hoisin','tomato','chili','chilli','brown','powdered','confectioners','heavy','sour','rice',
 'apple','balsamic','red','white','peanut','sunflower','canola','vegetable','chicken','beef','pork',
 'lamb','wine','smoked','sweet','condensed','evaporated','buttermilk','almond','oat','goat','blue',
 'cream','corn','potato','sweet','bread','pastry','puff','self-raising','baking',
 /* modifiers that turn tap water into something you have to go and buy */
 'rose','tonic','sparkling','seltzer','soda','mineral','blossom','orange','barley','tamarind',
 'chinese','sichuan','szechuan','napa']);
/* A word that makes a different product, not just a described version of the
   same one. The built-in set below plus anything the user has added under
   "## Different product" in classes.md. */
function isDistinctWord(w){
  if(DISTINCT.has(w))return true;
  if(typeof classIndex!=='function')return false;
  const d=classIndex().distinct;
  return !!(d&&d.has(w));
}
/* do two ingredient names refer to the same thing? */
function sameThing(a,b){
  const x=norm(a),y=norm(b);
  if(!x||!y)return false;
  if(x===y)return true;
  const xs=x.split(' '),ys=y.split(' ');
  const [shortS,longS]=xs.length<=ys.length?[xs,ys]:[ys,xs];
  if(!longS.join(' ').includes(shortS.join(' ')))return false;
  if(shortS[shortS.length-1]!==longS[longS.length-1])return false;   // must share the head noun
  const extra=longS.filter(w=>!shortS.includes(w));
  if(extra.some(isDistinctWord))return false;                        // "green" onion / "quail" egg
  return true;
}

/* Does having X satisfy a recipe asking for Y?
   Deliberately one-way. A recipe asking for plain "oil" is happy with olive
   oil; a recipe asking for "sesame oil" is not happy with olive oil. So a
   bare, single-word request matches anything whose head noun is that word. */
function satisfies(haveItem,wantItem){
  if(sameThing(haveItem,wantItem))return true;
  const w=norm(wantItem), h=norm(haveItem);
  if(!w||!h)return false;
  const ws=w.split(' ');
  if(ws.length!==1)return false;                 // a specific ask needs a specific match
  const hs=h.split(' ');
  return hs[hs.length-1]===ws[0];                // "olive oil" answers "oil"
}

const QTY=/^\s*((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d+(?:\.\d+)?)(?:\s*[-–]\s*\d+(?:\.\d+)?)?)\s*/;
function parseIngredient(raw){
  const line=deVulgar(raw).trim();
  let rest=line, qty=null, unit=null;
  const m=QTY.exec(rest);
  if(m){ qty=m[1].trim(); rest=rest.slice(m[0].length); }
  const um=/^([a-zA-Z]+)\.?\s+/.exec(rest);
  if(um && UNIT_CANON[um[1].toLowerCase()]){ unit=UNIT_CANON[um[1].toLowerCase()]; rest=rest.slice(um[0].length); }
  /* An amount written in words: "a large pinch of", "a knob of", "2 handfuls
     of". These get stripped as descriptions when matching the name, which is
     right — but the size is real information and costing needs it. */
  if(!unit){
    const am=/^\s*(?:a|an|one)?\s*(?:large|small|good|generous|scant|heaped|heaping|big|little)?\s*(pinch|pinches|handful|handfuls|knob|knobs|splash|splashes|dash|dashes|drizzle|drizzles|glug|glugs|squeeze|squeezes|drop|drops|sprig|sprigs|stalk|stalks|leaf|leaves|slice|slices|piece|pieces|clove|cloves|head|heads|bunch|bunches|stick|sticks)\s+(?:of\s+)?/i.exec(rest);
    if(am){
      unit=UNIT_CANON[am[1].toLowerCase()]||am[1].toLowerCase();
      if(qty==null)qty='1';
      rest=rest.slice(am[0].length);
    }
  }
  rest=rest.replace(/^of\s+/i,'');                       // "3 cloves of garlic"
  let note=null;
  /* split the note off at the first comma whose head actually names something —
     "melted, cooled butter" must not become the ingredient "melted" */
  let from=0, ci=-1;
  while(true){
    const at=rest.indexOf(',',from);
    if(at<0)break;
    if(norm(rest.slice(0,at))){ ci=at; break; }
    from=at+1;
  }
  if(ci>0){ note=rest.slice(ci+1).trim(); rest=rest.slice(0,ci); }
  const item=rest.trim().replace(/\s+/g,' ');
  return {raw:line,qty,unit,item,note,key:norm(item)};
}
const PLURAL_UNITS=new Set(['cup','clove','slice','stick','can','sprig','piece','bunch','head','pinch','dash','pkg','pint','handful']);
function ingLine(i){
  let u=i.unit;
  if(u && PLURAL_UNITS.has(u)){ const n=fracToNum(i.qty); if(n&&n>1)u=u+'s'; }
  return [i.qty,u,i.item].filter(Boolean).join(' ') + (i.note?', '+i.note:'');
}

/* ---------- recipe file <-> object ---------- */
const META_KEYS=['tags','serves','time','active','source','status','rating','added','lastmade','times',
  'makes','yields','leaves'];
function parseRecipe(text,file){
  const lines=String(text||'').split(/\r?\n/);
  let name='Untitled';
  const ti=lines.findIndex(l=>/^#\s+/.test(l));
  if(ti>=0) name=lines[ti].replace(/^#\s+/,'').trim();
  const S=sections(text);
  const meta={};
  (S._head||[]).forEach(l=>{
    const m=/^([A-Za-z ]+):\s*(.*)$/.exec(l.trim());
    if(m && META_KEYS.includes(m[1].trim().toLowerCase())) meta[m[1].trim().toLowerCase()]=m[2].trim();
  });
  const tags=(meta.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  const ingredients=bullets(S['ingredients']).map(parseIngredient);
  const steps=(S['steps']||[]).map(l=>l.trim())
      .filter(l=>/^(\d+[.)]\s+|[-*]\s+)/.test(l))
      .map(l=>l.replace(/^(\d+[.)]\s+|[-*]\s+)/,'').trim())
      .filter(Boolean);
  const notes=(S['notes']||[]).join('\n').trim();
  const log=parseLog(S['log']);
  return {
    fileId:file&&file.id, fileName:file&&file.name, modifiedTime:file&&file.modifiedTime,
    name, meta, tags, ingredients, steps, notes, log, raw:text,
    slug:file&&file.name?file.name.replace(/\.md$/,''):slug(name)
  };
}
/* ---------- the cook's log ----------
   Every time you make it, what you changed and what went wrong. Kept in the
   recipe file itself so the history travels with the recipe, and so it is
   still readable in twenty years by anything that can open a text file.

   ## Log
   ### 2026-08-15
   Doubled the garlic. Better. Oven runs hot — 15 min, not 20.
*/
function parseLog(lines){
  const ls=lines||[];
  const dated=ls.some(l=>/^###\s+/.test(l.trim()));
  const out=[]; let cur=null;
  ls.forEach(l=>{
    const m=/^###\s+(.+?)\s*$/.exec(l.trim());
    if(m){ cur={date:m[1].trim(),text:''}; out.push(cur); return; }
    if(!cur){
      /* prose before the first dated heading is the section's own explanation,
         not something you wrote after cooking — unless there are no headings
         at all, in which case you clearly just typed a note by hand */
      if(!dated && l.trim()){ cur={date:'',text:l.trim()}; out.push(cur); }
      return;
    }
    cur.text += (cur.text?'\n':'')+l;
  });
  out.forEach(e=>e.text=e.text.trim());
  return out.filter(e=>e.text);
}
function addLogEntry(r,text,date){
  const t=String(text||'').trim();
  if(!t)return false;
  r.log=r.log||[];
  r.log.unshift({date:date||todayISO(),text:t});
  return true;
}

function serializeRecipe(r){
  const out=['# '+r.name,''];
  const meta=Object.assign({},r.meta);
  if(r.tags&&r.tags.length)meta.tags=r.tags.join(', ');
  META_KEYS.forEach(k=>{ if(meta[k]!=null&&meta[k]!=='') out.push(k+': '+meta[k]); });
  out.push('','## Ingredients');
  r.ingredients.forEach(i=>out.push('- '+(i.raw&&!i.dirty?i.raw:ingLine(i))));
  out.push('','## Steps');
  r.steps.forEach((s,n)=>out.push((n+1)+'. '+s));
  if(r.notes&&r.notes.trim()){ out.push('','## Notes',r.notes.trim()); }
  if(r.log&&r.log.length){
    out.push('','## Log','Newest first. One entry per time we made it.');
    r.log.forEach(e=>{ out.push('','### '+(e.date||todayISO()),e.text); });
  }
  return out.join('\n')+'\n';
}

/* ---------- house rules ---------- */
function parseRules(text){
  const S=sections(text);
  const swap=bullets(S['swap']).map(l=>{
    const p=l.split(/\s*->\s*/); return p.length>1?{from:p[0].trim(),to:p.slice(1).join('->').trim()}:null;
  }).filter(Boolean);
  const always=bullets(S['always']).map(l=>{
    const m=/^when\s+(.+?)\s*->\s*(.+)$/i.exec(l);
    return m?{trigger:m[1].trim(),do:m[2].trim()}:{trigger:'',do:l};
  });
  const thaw={};
  bullets(S['thaw']).forEach(l=>{ const m=/^(.+?):\s*([\d.]+)/.exec(l); if(m)thaw[norm(m[1])]=parseFloat(m[2]); });
  const portions={};
  bullets(S['portions']).forEach(l=>{ const m=/^(.+?):\s*(.+)$/.exec(l); if(m)portions[m[1].trim().toLowerCase()]=m[2].trim(); });
  /* things that can just be left out when we don't have them */
  const drop=bullets(S['drop']);
  /* things that are never shopping. Water comes out of the wall; being told
     we are "missing water" is noise, and worse, it drags a recipe's coverage
     score down and pushes it out of "can make now". Editable, because what
     counts as always-on-hand is a fact about your kitchen, not about food. */
  const free=bullets(S['always have']);
  /* swapping the whole protein: what to add, and how the method changes.
     "fish -> add: lemon, butter | technique: never braise | time: 15 minutes" */
  const proteins={};
  bullets(S['protein swaps']).forEach(l=>{
    const m=/^(.+?)\s*->\s*(.+)$/.exec(l); if(!m)return;
    const o={name:m[1].trim(),add:[],technique:'',time:''};
    m[2].split('|').forEach(part=>{
      const p=/^\s*(add|technique|time)\s*:\s*(.+)$/i.exec(part); if(!p)return;
      const k=p[1].toLowerCase();
      if(k==='add')o.add=p[2].split(',').map(s=>s.trim()).filter(Boolean);
      else o[k]=p[2].trim();
    });
    proteins[norm(o.name)]=o;
  });
  const shelf=bullets(S['shelf order']).map(x=>norm(x).replace(/s$/,''))
    .map(x=>CAT_DEFAULT.find(c=>c.startsWith(x)||x.startsWith(c))).filter(Boolean);
  return {
    shelf: shelf.length?uniq(shelf.concat(CAT_DEFAULT)):CAT_DEFAULT.slice(),
    never:bullets(S['never']), swap, always, drop, proteins,
    free: free.length?free:FREE_DEFAULT.slice(),
    prefer:bullets(S['prefer']), thaw, portions,
    raw:text
  };
}

const FREE_DEFAULT=['water','ice','ice cubes'];

/* ---------- pantry / inventory ----------
   A line is just the name. Everything else is optional and lives in a
   trailing parenthetical, so a phone-typed line can never be wrong:

     - apples                          we have plenty
     - apples (some)                   getting through them
     - apples (low)                    nearly gone
     - ! apples                        out
     - apples (6 lb, bought 2026-08-10)   exact, straight off a receipt

   Levels beat counts here on purpose. Nobody is going to tell an app
   they ate an apple, so the app tracks confidence, not arithmetic —
   and stores the real number only when a receipt actually gave it one.
*/
const LEVELS=['out','low','some','plenty'];
const LEVEL_LABEL={out:'out',low:'nearly gone',some:'some left',plenty:'plenty'};
function parsePantryItem(line){
  let s=String(line||'').trim();
  const flaggedOut=/^!\s*/.test(s);
  s=s.replace(/^!\s*/,'');
  let level=null,qty=null,unit=null,bought=null;
  const m=/\(([^)]*)\)\s*$/.exec(s);
  if(m){
    s=s.slice(0,m.index).trim();
    m[1].split(',').forEach(tok=>{
      const t=tok.trim().toLowerCase(); if(!t)return;
      if(LEVELS.includes(t)){ level=t; return; }
      let d=/^(?:bought\s+)?(\d{4}-\d{2}-\d{2})$/.exec(t);
      if(d){ bought=d[1]; return; }
      d=/^(?:bought\s+)?(\d{1,2})\/(\d{1,2})$/.exec(t);
      if(d){ bought=new Date().getFullYear()+'-'+String(+d[1]).padStart(2,'0')+'-'+String(+d[2]).padStart(2,'0'); return; }
      const q=/^([\d.\/\s]+?)\s*([a-z]*)$/.exec(t);
      if(q && fracToNum(q[1])!=null){ qty=q[1].trim(); unit=UNIT_CANON[q[2]]||q[2]||null; }
    });
  }
  if(flaggedOut)level='out';
  if(!level)level='plenty';
  return {name:s,level,out:level==='out',qty,unit,bought,key:norm(s)};
}
function pantryItemLine(i){
  const bits=[];
  if(i.level && i.level!=='plenty' && i.level!=='out')bits.push(i.level);
  if(i.qty)bits.push([i.qty,i.unit].filter(Boolean).join(' '));
  if(i.bought)bits.push('bought '+i.bought);
  return (i.out?'! ':'')+i.name+(bits.length?' ('+bits.join(', ')+')':'');
}
/* the only way levels should ever be set — keeps out/level in step */
function setLevel(item,level){
  if(!LEVELS.includes(level))return;
  item.level=level; item.out=(level==='out');
  if(level==='out'){ item.qty=null; item.unit=null; }
}
function stepDown(item){ setLevel(item,LEVELS[Math.max(0,LEVELS.indexOf(item.level)-1)]); }
function stepUp(item){ setLevel(item,LEVELS[Math.min(LEVELS.length-1,LEVELS.indexOf(item.level)+1)]); }

function parsePantry(text){
  const S=sections(text);
  const groups=[];
  Object.keys(S).forEach(k=>{
    if(k==='_head')return;
    const items=bullets(S[k]).map(parsePantryItem).filter(i=>i.name);
    if(items.length)groups.push({name:k,items});
  });
  return {groups,raw:text};
}
function pantryAll(p){ return p.groups.flatMap(g=>g.items.map(i=>Object.assign({group:g.name},i))); }
function pantryHave(p){ return pantryAll(p).filter(i=>!i.out); }
function serializePantry(p){
  const out=['# Pantry',''];
  out.push('What is in the house. The app assumes anything here is available,');
  out.push('so it only ever tells you what you would have to go buy.','');
  out.push('Just the name means we have plenty. Everything else is optional:','');
  out.push('    - apples                            plenty');
  out.push('    - apples (some)                     working through them');
  out.push('    - apples (low)                      nearly gone');
  out.push('    - ! apples                          out — lands on the grocery list');
  out.push('    - apples (6 lb, bought 2026-08-10)  exact, off a receipt','');
  p.groups.forEach(g=>{
    out.push('## '+g.name.replace(/\b\w/g,c=>c.toUpperCase()));
    g.items.forEach(i=>out.push('- '+pantryItemLine(i)));
    out.push('');
  });
  return out.join('\n');
}

/* ============================================================
   UNITS — enough conversion to price a recipe honestly
   Three families. Inside a family we convert exactly; across families
   we refuse to guess, and say so, rather than inventing a number.
   ============================================================ */
const UNIT_G={g:1,kg:1000,oz:28.3495,lb:453.592};
const UNIT_ML={ml:1,l:1000,tsp:4.92892,tbsp:14.7868,cup:236.588,pint:473.176,qt:946.353,floz:29.5735,gal:3785.41};
const COUNT_UNITS=new Set(['clove','can','bunch','slice','stick','sprig','piece','head','pkg','handful','pinch','dash','dozen',
  'leaf','knob','splash','drizzle','glug','squeeze','drop','stalk','']);
function unitKey(u){
  const t=String(u||'').toLowerCase().trim();
  if(!t)return '';
  return UNIT_CANON[t]||t.replace(/e?s$/,'');
}
function unitFamily(u){
  const k=(u||'').toLowerCase();
  if(UNIT_G[k])return 'weight';
  if(UNIT_ML[k])return 'volume';
  if(COUNT_UNITS.has(k))return 'count';
  return null;
}
function toBase(qty,unit){
  const n=fracToNum(qty); if(n==null)return null;
  const k=(unit||'').toLowerCase();
  if(k==='dozen')return {fam:'count',n:n*12};   // "2 dozen quail eggs" is 24 of them
  if(UNIT_G[k])return {fam:'weight',n:n*UNIT_G[k]};
  if(UNIT_ML[k])return {fam:'volume',n:n*UNIT_ML[k]};
  if(COUNT_UNITS.has(k))return {fam:'count',n:n};
  return null;
}
function money(n){
  if(n==null||isNaN(n))return '—';
  return '$'+(Math.round(n*100)/100).toFixed(2);
}

/* ---------- prices ----------
   An append-only log of what we actually paid. Never edited by the app,
   only added to, so the history stays true. */
/* Sensible weights for the units recipes actually count in. A recipe that
   says "20 pieces" of a cabbage does not mean twenty cabbages, and until now
   that was exactly how it was costed. Absolute amounts where the unit means
   the same thing whatever the food; a fraction of one whole where it does
   not, so a leaf scales with the size of the vegetable it came off. */
const PORTION_DEFAULT={
  pinch:{fam:'weight',n:0.35,as:'0.35 g'},
  dash:{fam:'volume',n:0.6,as:'0.6 ml'},
  drop:{fam:'volume',n:0.05,as:'0.05 ml'},
  splash:{fam:'volume',n:15,as:'15 ml'},
  drizzle:{fam:'volume',n:10,as:'10 ml'},
  glug:{fam:'volume',n:20,as:'20 ml'},
  handful:{fam:'weight',n:30,as:'30 g'},
  knob:{fam:'weight',n:15,as:'15 g'},
  squeeze:{fam:'volume',n:15,as:'15 ml'},
  clove:{fam:'weight',n:5,as:'5 g'},
  sprig:{fam:'weight',n:2,as:'2 g'},
  stalk:{fam:'weight',n:40,as:'40 g'},
  stick:{fam:'weight',n:113,as:'4 oz'},
  slice:{of:'whole',f:1/16,as:'1/16 whole'},
  piece:{of:'whole',f:1/20,as:'1/20 whole'},
  leaf:{of:'whole',f:1/30,as:'1/30 whole'},
  head:{of:'whole',f:1,as:'1 whole'},
  bunch:{of:'whole',f:1,as:'1 whole'},
  can:{fam:'weight',n:397,as:'14 oz'},
  pkg:{fam:'weight',n:340,as:'12 oz'}
};
/* "small" and "large" are stripped out of the name when matching, but they
   are real information about size — worth keeping for the arithmetic. */
function sizeFactor(raw){
  const t=' '+String(raw||'').toLowerCase()+' ';
  if(/\b(extra[- ]large|jumbo|xl)\b/.test(t))return 1.7;
  if(/\b(large|big)\b/.test(t))return 1.4;
  if(/\b(small|baby|mini|little)\b/.test(t))return 0.6;
  return 1;
}
function parsePrices(text){
  const S=sections(text);
  const buy=bullets(S['purchases']).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<4)return null;
    const amt=parseAmount(p[2]||'');
    return {date:p[0],item:p[1],qty:amt.qty,unit:amt.unit,
      price:parseFloat(String(p[3]).replace(/[^0-9.-]/g,'')),
      store:p[4]||'',key:norm(p[1])};
  }).filter(x=>x&&x.item&&!isNaN(x.price)&&x.price>0);
  const weights={};
  bullets(S['typical weights']).forEach(l=>{
    const m=/^(.+?):\s*(.+)$/.exec(l); if(!m)return;
    const a=parseAmount(m[2]); const b=toBase(a.qty,a.unit);
    if(b&&b.fam==='weight')weights[norm(m[1])]={item:m[1].trim(),g:b.n,as:m[2].trim()};
  });
  /* What one of a given unit weighs. Either an absolute amount, or a
     fraction of one whole thing — "piece: 1/20 whole" means a piece of a
     cabbage is a twentieth of a cabbage, whatever a cabbage happens to
     weigh. Falls back to PORTION_DEFAULT for anything not listed. */
  const portions={};
  bullets(S['portions']).forEach(l=>{
    const m=/^(.+?):\s*(.+)$/.exec(l); if(!m)return;
    const key=unitKey(m[1]), v=m[2].trim();
    const frac=/^([\d./]+)\s*(?:x\s*)?whole\b/i.exec(v);
    if(frac){ const f=fracToNum(frac[1]); if(f!=null)portions[key]={of:'whole',f,as:v}; return; }
    const a=parseAmount(v), b=toBase(a.qty,a.unit);
    if(b&&(b.fam==='weight'||b.fam==='volume'))portions[key]={fam:b.fam,n:b.n,as:v};
  });
  const other=bullets(S['other spending']).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<3)return null;
    return {date:p[0],what:p[1],price:parseFloat(String(p[2]).replace(/[^0-9.-]/g,'')),store:p[3]||''};
  }).filter(x=>x&&!isNaN(x.price));
  return {buy,other,weights,portions,raw:text};
}
function serializePrices(p){
  const out=['# Prices','',
    'Everything we have actually paid. The app only ever appends to this —',
    'your history is never rewritten. Recipe costs are worked out from it.','',
    'Written as:  YYYY-MM-DD | item | amount | price | store','','## Purchases',''];
  p.buy.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>
    out.push(`- ${b.date} | ${b.item} | ${[b.qty,b.unit].filter(Boolean).join(' ')||'1'} | ${Number(b.price).toFixed(2)} | ${b.store}`));
  out.push('','## Typical weights',
    'What one of a thing weighs, so a recipe saying "3 carrots" can be costed',
    'from a price paid per pound. Only used when the units do not otherwise',
    'line up, and anything costed this way is shown as an estimate.',
    'Written as:  item: amount','');
  Object.values(p.weights||{}).forEach(w=>out.push(`- ${w.item}: ${w.as}`));
  out.push('','## Portions',
    'What one of a COUNTED unit weighs — a piece, a leaf, a stalk, a pinch.',
    'Twenty pieces of cabbage is not twenty cabbages, and this is how the app',
    'knows the difference. Either an absolute amount, or a fraction of one',
    'whole thing, which then scales with whatever that thing weighs.',
    'Anything not listed here uses a sensible built-in default.',
    'Written as:  unit: amount   or   unit: 1/20 whole','');
  Object.keys(p.portions||{}).forEach(k=>out.push(`- ${k}: ${p.portions[k].as}`));
  out.push('','## Other spending',
    'Money that is not a line item — a farm share, a guest\'s shopping run.',
    'Written as:  YYYY-MM-DD | what | amount | store','');
  p.other.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>
    out.push(`- ${o.date} | ${o.what} | ${Number(o.price).toFixed(2)} | ${o.store}`));
  return out.join('\n')+'\n';
}

/* ---------- stores ---------- */
function parseStores(text){
  const S=sections(text);
  const list=bullets(S['stores']).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    return p[0]?{name:p[0],good:(p[1]||'').split(',').map(s=>s.trim()).filter(Boolean),note:p[2]||''}:null;
  }).filter(Boolean);
  const best={};
  bullets(S['best for']).forEach(l=>{
    const m=/^(.+?)\s*->\s*(.+)$/.exec(l); if(!m)return;
    best[norm(m[1])]={item:m[1].trim(),store:m[2].trim()};
  });
  const season={};
  bullets(S['seasons']).forEach(l=>{
    const m=/^(.+?):\s*(\d{1,2})\s*[-–]\s*(\d{1,2})\s*$/.exec(l); if(!m)return;
    season[norm(m[1])]={item:m[1].trim(),from:+m[2],to:+m[3]};
  });
  return {list,best,season,raw:text};
}
function serializeStores(s){
  const out=['# Stores','',
    'Where to buy what, and when it is worth buying.','',
    'Written as:  name | what it is good for | note','','## Stores',''];
  s.list.forEach(x=>out.push(`- ${x.name} | ${x.good.join(', ')} | ${x.note}`.trimEnd()));
  out.push('','## Best for','Written as:  item or category -> store','');
  Object.values(s.best).forEach(b=>out.push(`- ${b.item} -> ${b.store}`));
  out.push('','## Seasons','When something is actually worth buying. Written as:  item: first month - last month','');
  Object.values(s.season).forEach(b=>out.push(`- ${b.item}: ${b.from}-${b.to}`));
  return out.join('\n')+'\n';
}
function inSeason(item,month){
  const m=month||(new Date().getMonth()+1);
  const hit=Object.values(S.stores?S.stores.season:{}).find(s=>sameThing(s.item,item));
  if(!hit)return null;
  return hit.from<=hit.to ? (m>=hit.from&&m<=hit.to) : (m>=hit.from||m<=hit.to);
}

/* ---------- ingredient families ----------
   So that searching "beef" finds the short ribs, while searching
   "short ribs" stays specific to short ribs. */
const FAMILY={
  beef:['beef','short ribs','chuck','steak','brisket','ribeye','sirloin','flank','ground beef','stew meat','oxtail'],
  chicken:['chicken','chicken thigh','chicken breast','chicken wing','drumstick','whole chicken'],
  pork:['pork','bacon','sausage','ham','pork shoulder','pork chop','pork belly','pancetta','prosciutto'],
  lamb:['lamb','lamb shoulder','lamb chop'],
  fish:['fish','salmon','cod','halibut','tuna','snapper','trout','sea bass','mackerel','anchovy'],
  seafood:['shrimp','prawn','scallop','mussel','clam','squid','crab','lobster','octopus'],
  egg:['egg'],
  tofu:['tofu','tempeh'],
  pasta:['pasta','spaghetti','noodle','penne','rigatoni','linguine','orzo'],
  rice:['rice','risotto','arborio','jasmine rice','basmati'],
  potato:['potato','fingerling','yukon','russet'],
  mushroom:['mushroom','shiitake','cremini','portobello','porcini'],
  cheese:['cheese','parmesan','cheddar','mozzarella','gruyere','feta','goat cheese']
};
const PROTEIN_FAMILIES=['beef','chicken','pork','lamb','fish','seafood','tofu','egg'];
/* which family does this ingredient belong to, if any */
function familyOf(item){
  const n=norm(item);
  for(const k of Object.keys(FAMILY)){
    if(FAMILY[k].some(w=>sameThing(w,n)||n.includes(norm(w))))return k;
  }
  return null;
}
function isProtein(item){ const f=familyOf(item); return f&&PROTEIN_FAMILIES.includes(f)?f:null; }

/* ---------- what kind of thing is this? ----------
   Storage groups say WHERE a thing lives; this says WHAT IT IS, which is how
   you actually scan a list. Meat is in both the fridge and the freezer, and
   you think of it as one thing. */
const CAT_WORDS={
  meat:['beef','chicken','pork','lamb','veal','duck','turkey','bacon','sausage','ham','chorizo',
        'prosciutto','pancetta','salami','steak','rib','brisket','chuck','mince','meatball','frank',
        'hot dog','fish','salmon','cod','halibut','tuna','trout','snapper','sole','anchovy','sardine',
        'shrimp','prawn','scallop','mussel','clam','squid','crab','lobster','oyster','tofu','tempeh',
        'bone','back','wing','thigh','breast','drumstick','shoulder','loin','belly','carcass'],

function catByWords(n,cat){
  const words=String(n||'').split(' ').filter(Boolean);
  return CAT_WORDS[cat].some(w=>{
    if(w.includes(' '))return n.includes(w);            // multi-word terms match as phrases
    return words.some(x=>x===w||x===w+'s'||x===w+'es'); // …single words match whole, never inside
  });
}
function categoryOf(item,group){
  const g=String(group||'').toLowerCase();
  const n=norm(item)||String(item||'').toLowerCase();
  if(/season|spice/.test(g))return 'seasonings';
  if(/snack|treat|sweet/.test(g))return 'snacks';
  if(/staple|pantry|dry/.test(g))return 'staples';      // trust the file first
  if(catByWords(n,'dairy'))return 'dairy';             // eggs included, that is where you look
  if(isProtein(item)||catByWords(n,'meat'))return 'meat';
  if(catByWords(n,'fruit'))return 'fruit';
  if(catByWords(n,'vegetable'))return 'vegetable';
  if(/produce|veg/.test(g))return 'vegetable';
  if(catByWords(n,'staples'))return 'staples';
  return 'other';
}

/* ---------- steps library ---------- */
function parseSteps(text){
  const map={}; let cur=null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const h=/^###\s+(.+?)\s*$/.exec(line);
    if(h){ cur=h[1].trim(); map[cur]={name:cur,text:'',matches:[]}; return; }
    if(!cur)return;
    const m=/^match:\s*(.+)$/i.exec(line.trim());
    if(m){ map[cur].matches.push(m[1].trim().toLowerCase()); return; }
    if(/^#/.test(line))return;
    map[cur].text+=(map[cur].text?'\n':'')+line;
  });
  Object.values(map).forEach(s=>s.text=s.text.trim());
  return {map,raw:text};
}
function serializeSteps(lib){
  const out=['# Steps Library',''];
  Object.values(lib.map).forEach(s=>{
    out.push('### '+s.name, s.text);
    s.matches.forEach(m=>out.push('match: '+m));
    out.push('');
  });
  return out.join('\n');
}

/* ---------- meal plan ---------- */
function parsePlan(text){
  const S=sections(text);
  const away=bullets(S['away']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s*(?:to|-|–)\s*(\d{4}-\d{2}-\d{2})\s*(.*)$/.exec(l);
    return m?{from:m[1],to:m[2],label:m[3].trim()}:null;
  }).filter(Boolean);
  const skip=bullets(S['skip']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s+(\w+)\s*(.*)$/.exec(l);
    return m?{date:m[1],meal:m[2].toLowerCase(),reason:m[3].trim()}:null;
  }).filter(Boolean);
  const plan=bullets(S['plan']).map(l=>{
    const m=/^(\d{4}-\d{2}-\d{2})\s+(\w+)\s*:\s*(.*)$/.exec(l);
    return m?{date:m[1],meal:m[2].toLowerCase(),recipe:m[3].trim()}:null;
  }).filter(Boolean);
  const guests=bullets(S['guests']).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    const m=/^(\d{4}-\d{2}-\d{2})\s*(?:to|-|–)\s*(\d{4}-\d{2}-\d{2})$/.exec(p[0]||'');
    return m?{from:m[1],to:m[2],who:p[1]||'guests',extra:parseInt(p[2]||'1')||1}:null;
  }).filter(Boolean);
  const favourites=bullets(S['guest favourites']);
  return {away,skip,plan,guests,favourites,raw:text};
}
function serializePlan(p,thaws){
  const out=['# Meal Plan','','## Away','Written as:  YYYY-MM-DD to YYYY-MM-DD  label',''];
  p.away.forEach(a=>out.push(`- ${a.from} to ${a.to}  ${a.label||''}`.trimEnd()));
  out.push('','## Skip','Written as:  YYYY-MM-DD meal  reason','');
  p.skip.forEach(s=>out.push(`- ${s.date} ${s.meal}  ${s.reason||''}`.trimEnd()));
  out.push('','## Guests',
    'People staying with us. The planner buys for more mouths and leans on',
    'the favourites below. Written as:  YYYY-MM-DD to YYYY-MM-DD | who | extra people','');
  (p.guests||[]).forEach(g=>out.push(`- ${g.from} to ${g.to} | ${g.who} | ${g.extra}`));
  out.push('','## Guest favourites','What we always end up making when people stay.','');
  (p.favourites||[]).forEach(f=>out.push('- '+f));
  out.push('','## Plan','Written as:  YYYY-MM-DD meal: recipe name','');
  p.plan.slice().sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(s=>out.push(`- ${s.date} ${s.meal}: ${s.recipe}`));
  out.push('','## Thaw','Auto-generated from the plan.','');
  (thaws||[]).forEach(t=>out.push(`- ${t.when}  pull ${t.item} out for ${t.date} ${t.meal}`));
  return out.join('\n')+'\n';
}

/* ---------- grocery ---------- */
function parseGrocery(text){
  const S=sections(text);
  return {need:bullets(S['need']),manual:bullets(S['manual']),got:bullets(S['got']),raw:text};
}
function serializeGrocery(g){
  const out=['# Grocery List','','## Need',''];
  g.need.forEach(i=>out.push('- '+i));
  out.push('','## Manual','Things you add yourself. The app never touches this section.','');
  g.manual.forEach(i=>out.push('- '+i));

}

/* ---------- flours ----------
   One "## Name" block per flour, then plain key: value lines. Anything
   you leave out is simply not used — the calculator tells you which
   numbers it is missing rather than inventing them. */
function parseFlours(text){
  const out=[];
  const blocks=String(text||'').split(/\n(?=##\s)/);
  blocks.forEach(b=>{
    const m=/^##\s+(.+)$/m.exec(b);
    if(!m)return;
    const f={name:m[1].trim(),protein:null,fiber:null,whole:0,mill:'roller',grain:'wheat',source:'',note:''};
    b.split('\n').slice(1).forEach(l=>{
      const kv=/^\s*([a-z]+)\s*:\s*(.*)$/i.exec(l);
      if(!kv)return;
      const k=kv[1].toLowerCase(), v=kv[2].trim();
      if(k==='protein')f.protein=parseFloat(v);
      else if(k==='fiber'||k==='fibre')f.fiber=parseFloat(v);
      else if(k==='whole')f.whole=parseFloat(v)||0;
      else if(k==='mill')f.mill=/stone/i.test(v)?'stone':'roller';
      else if(k==='grain')f.grain=v.toLowerCase();
      else if(k==='source')f.source=v;
      else if(k==='note')f.note=v;
    });
    if(f.name)out.push(f);
  });
  return out;
}
function serializeFlours(list){
  const out=['# Flours','',
    'Everything the dough calculator knows about what is in your cupboard.',
    'Protein and fiber come off the bag, as a percentage. "whole" is how',
    'much of that flour is whole grain, 0 to 100. "mill" is roller or stone.',
    'Leave a number out and the calculator will say so rather than guess.',''];
  (list||[]).forEach(f=>{
    out.push('## '+f.name);
    if(f.protein!=null&&isFinite(f.protein))out.push('protein: '+f.protein);
    if(f.fiber!=null&&isFinite(f.fiber))out.push('fiber: '+f.fiber);
    out.push('whole: '+(f.whole||0));
    out.push('mill: '+(f.mill||'roller'));
    if(f.grain&&f.grain!=='wheat')out.push('grain: '+f.grain);
    if(f.source)out.push('source: '+f.source);
    if(f.note)out.push('note: '+f.note);
    out.push('');
  });
  return out.join('\n');
}

/* ---------- saved bakes ---------- */
function parseBakes(text){
  const out=[];
  String(text||'').split(/\n(?=##\s)/).forEach(b=>{
    const m=/^##\s+(.+)$/m.exec(b);
    if(!m)return;
    const k={name:m[1].trim(),blend:[],notes:''};
    b.split('\n').slice(1).forEach(l=>{
      const kv=/^\s*([a-z]+)\s*:\s*(.*)$/i.exec(l);
      if(!kv)return;
      const key=kv[1].toLowerCase(), v=kv[2].trim();
      if(key==='blend'){
        v.split(/\s*,\s*/).forEach(part=>{
          const p=/^(.*?)\s+(\d+(?:\.\d+)?)\s*%?$/.exec(part.trim());
          if(p)k.blend.push({flour:p[1].trim(),pct:parseFloat(p[2])});
        });
      }
      else if(/^(flour|hydration|salt|pff|temp|levainhyd|scald|retard|anchor|anchorprotein|friction)$/.test(key))k[key]=parseFloat(v);
      else k[key]=v;
    });
    if(k.name)out.push(k);
  });
  return out;
}
function serializeBakes(list){
  const out=['# Bakes','','Saved dough formulas. Edit the numbers here and the calculator picks them up.',''];
  (list||[]).forEach(k=>{
    out.push('## '+k.name);
    if(k.style)out.push('style: '+k.style);
    if(k.blend&&k.blend.length)out.push('blend: '+k.blend.map(b=>b.flour+' '+b.pct).join(', '));
    ['flour','hydration','salt','pff','temp','levainhyd','scald','anchor','anchorprotein','friction'].forEach(f=>{
      if(k[f]!=null&&isFinite(k[f]))out.push(f+': '+k[f]);
    });
    if(k.path)out.push('path: '+k.path);
    if(k.notes)out.push('notes: '+k.notes);
    out.push('');
  });
  return out.join('\n');
}

const Drive = {
  token:null, tokenExp:0, client:null, ready:false,

  clientId(){ return LS.get('clientId','') || ''; },

  init(){
    const cid=this.clientId();
    if(!cid || !window.google || !google.accounts) return false;
    this.client = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive',
      callback: (resp)=>{
        if(resp && resp.access_token){
          Drive.token=resp.access_token;
          Drive.tokenExp=Date.now()+((resp.expires_in||3600)-120)*1000;
          LS.set('tok',{t:Drive.token,e:Drive.tokenExp});
          if(Drive._resolve){ Drive._resolve(resp.access_token); Drive._resolve=null; }
        }else if(Drive._reject){ Drive._reject(new Error('No token returned')); Drive._reject=null; }
      },
      error_callback: (e)=>{ if(Drive._reject){ Drive._reject(new Error(e&&e.type||'auth failed')); Drive._reject=null; } }
    });
    const cached=LS.get('tok',null);
    if(cached && cached.e>Date.now()){ this.token=cached.t; this.tokenExp=cached.e; }
    this.ready=true;
    return true;
  },

  signedIn(){ return !!this.token && this.tokenExp>Date.now(); },

  auth(interactive){
    if(this.signedIn()) return Promise.resolve(this.token);
    if(!this.client && !this.init()) return Promise.reject(new Error('Google sign-in not configured'));
    return new Promise((res,rej)=>{
      let done=false;
      const finish=(fn,v)=>{ if(done)return; done=true; clearTimeout(t); fn(v); };
      this._resolve=v=>finish(res,v);
      this._reject=e=>finish(rej,e);
      const t=setTimeout(()=>finish(rej,new Error(
        'Google sign-in did not answer. A blocked popup is the usual cause — allow popups for this page and press Sync.')),45000);
      try{ this.client.requestAccessToken({prompt: interactive?'consent':''}); }
      catch(e){ finish(rej,e); }
    });
  },

  async req(url,opts={},attempt){
    attempt=attempt||0;
    const tok=await this.auth(false);
    const o=Object.assign({},opts);
    o.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
    let r;
    try{ r=await fetch(url,o); }
    catch(netErr){                                    // dropped connection, flaky wifi
      if(attempt<4){ await this.backoff(attempt); return this.req(url,opts,attempt+1); }
      throw new Error('Could not reach Google Drive. Check the connection and press Sync.');
    }
    if(r.status===401){
      this.token=null; LS.del('tok');
      const t2=await this.auth(true);
      o.headers.Authorization='Bearer '+t2;
      r=await fetch(url,o);
    }
    /* Google throttles a burst of requests with 429, or 403 + a rate-limit
       reason. Both are "slow down", not "give up". */
    if(r.status===429 || r.status===403 || r.status>=500){
      const body=await r.text();
      const throttled = r.status===429 || r.status>=500 ||
        /rateLimitExceeded|userRateLimitExceeded|backendError|internalError/i.test(body);
      if(throttled && attempt<5){
        await this.backoff(attempt);
        return this.req(url,opts,attempt+1);
      }
      throw new Error('Drive '+r.status+': '+body.slice(0,300));
    }
    if(!r.ok){ const t=await r.text(); throw new Error('Drive '+r.status+': '+t.slice(0,300)); }
    return r;
  },
  backoff(attempt){
    const ms=Math.min(16000, 500*Math.pow(2,attempt)) + Math.floor(Math.random()*400);
    return new Promise(r=>setTimeout(r,ms));
  },

  /* Drive pages at 1000 max. Follow nextPageToken to the end — otherwise a
     library bigger than one page silently loses everything past it. */
  async list(q,fields='files(id,name,mimeType,modifiedTime,size)',onPage){
    let out=[],token=null,guard=0;
    do{
      const url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)
        +'&fields='+encodeURIComponent('nextPageToken,'+fields)
        +'&pageSize=1000&orderBy=name'+(token?'&pageToken='+encodeURIComponent(token):'');
      const r=await this.req(url); const j=await r.json();
      out=out.concat(j.files||[]);
      token=j.nextPageToken||null;
      if(onPage)onPage(out.length);
    }while(token && ++guard<50);
    return out;
  },

  async findFolder(name,parent){
    const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`
      + (parent?` and '${parent}' in parents`:'');
    const f=await this.list(q); return f[0]||null;
  },

  async makeFolder(name,parent){
    const r=await this.req('https://www.googleapis.com/drive/v3/files',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})
    });
    return r.json();
  },

  async ensureFolder(name,parent){
    return (await this.findFolder(name,parent)) || (await this.makeFolder(name,parent));
  },

  async readText(file){
    if(file.mimeType==='application/vnd.google-apps.document'){
      const r=await this.req(`https://www.googleapis.com/drive/v3/files/${file.id}/export?mimeType=text/plain`);
      return r.text();
    }
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
    return r.text();
  },

  /* photos and other binaries: create the file, then PATCH the bytes in */
  async createBinary(name,parent,blob,mime){
    const r=await this.req('https://www.googleapis.com/drive/v3/files',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,parents:parent?[parent]:undefined})});
    const f=await r.json();
    const r2=await this.req(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media&fields=id,name,webViewLink`,
      {method:'PATCH',headers:{'Content-Type':mime||'application/octet-stream'},body:blob});
    return r2.json();
  },

  async create(name,parent,text,mime='text/markdown'){
    const b='-----kitchen'+Math.random().toString(36).slice(2);
    const meta={name,parents:parent?[parent]:undefined};
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`
      +JSON.stringify(meta)+`\r\n--${b}\r\nContent-Type: ${mime}; charset=UTF-8\r\n\r\n`+text+`\r\n--${b}--`;
    const r=await this.req('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',
      {method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    return r.json();
  },

  async write(fileId,text,mime='text/markdown'){
    const r=await this.req(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,modifiedTime`,
      {method:'PATCH',headers:{'Content-Type':mime+'; charset=UTF-8'},body:text});
    return r.json();
  },

  async meta(fileId){
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,modifiedTime`);
    return r.json();
  },

  async move(fileId,addParent,removeParent){
    const r=await this.req(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${addParent}&removeParents=${removeParent}&fields=id,parents`,
      {method:'PATCH'});
    return r.json();
  },

  async trash(fileId){
    return this.req(`https://www.googleapis.com/drive/v3/files/${fileId}`,
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});
  }
};

Different words for one product. Works in every direction, and these never
